                      <i class="fa-solid fa-plus"></i> + Giao Việc Mới
                    </button>
                  ` : ``}
                </div>
              </div>

              <!-- Quick Group Filter Bar -->
              <div class="filter-bar" style="margin-top:10px;margin-bottom:0;padding-top:10px;border-top:1px solid var(--border-light)">
                <button class="filter-btn ${this.currentGroup === "all" ? "active" : ""}" onclick="AppModules.tasks.setGroup('all')">Tất Cả</button>
                <button class="filter-btn ${this.currentGroup === "urgent" ? "active" : ""}" onclick="AppModules.tasks.setGroup('urgent')">🔥 Gấp / Cao</button>
                <button class="filter-btn ${this.currentGroup === "cho_nghiem_thu" ? "active" : ""}" onclick="AppModules.tasks.setGroup('cho_nghiem_thu')">⏳ Chờ Nghiệm Thu (${pendingReviewTasks})</button>
                <button class="filter-btn ${this.currentGroup === "ky_thuat" ? "active" : ""}" onclick="AppModules.tasks.setGroup('ky_thuat')">💻 Kỹ Thuật</button>
                <button class="filter-btn ${this.currentGroup === "hcns" ? "active" : ""}" onclick="AppModules.tasks.setGroup('hcns')">📋 Hành Chính - Nhân Sự</button>
                <button class="filter-btn ${this.currentGroup === "san_xuat" ? "active" : ""}" onclick="AppModules.tasks.setGroup('san_xuat')">🏭 Sản Xuất</button>
                <button class="filter-btn ${this.currentGroup === "ke_toan" ? "active" : ""}" onclick="AppModules.tasks.setGroup('ke_toan')">💰 Kế Toán</button>
                <!-- [THÊM MỚI 28/08/2026] Nút lọc xem riêng việc ĐÃ ĐÌNH CHỈ (hủy, không làm nữa). -->
                <button class="filter-btn ${this.currentGroup === "dinh_chi" ? "active" : ""}" onclick="AppModules.tasks.setGroup('dinh_chi')" style="${this.currentGroup === "dinh_chi" ? "" : (soDinhChi > 0 ? "border-color:#fecaca;color:#b91c1c;" : "")}">⛔ Đã Đình Chỉ (${soDinhChi})</button>
              </div>
            </div>

            <!-- VIEW CONTAINER (KANBAN / BẢNG / hoặc DANH SÁCH ĐÌNH CHỈ) -->
            <!-- [SỬA 28/08/2026] Khi lọc "Đã đình chỉ" → hiện danh sách riêng (kanban vốn ẩn việc đình chỉ). -->
            ${this.currentGroup === "dinh_chi"
              ? this.renderDanhSachDinhChi(taskList)
              : (this.currentViewMode === "kanban" ? this.renderKanbanBoard(taskList) : this.renderTableView(taskList))}
          `;
        },

        /* [THÊM MỚI 28/08/2026] Danh sách việc ĐÃ ĐÌNH CHỈ (dạng thẻ), kèm lý do + nút "Bỏ đình chỉ". */
        renderDanhSachDinhChi(taskList) {
          const cu = CoreService.currentUser;
          const capBac = PhanQuyenService.capBacCua(cu.role);
          const laQuanLy = ["manager", "hr", "director", "it_admin"].indexOf(capBac) >= 0;
          if (!taskList.length) {
            return `<div class="card" style="text-align:center;padding:40px 16px;color:var(--text-muted)">
              <i class="fa-solid fa-ban" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px"></i>
              Không có công việc nào đang bị đình chỉ.</div>`;
          }
          return `<div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
            ${taskList.map(t => `
              <div style="border:1px solid #fecaca;background:#fff7f7;border-radius:10px;padding:12px">
                <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:6px">
                  <strong style="font-size:13.5px">${t.tenCV}</strong>
                  <span class="badge badge-danger" style="font-size:10px;white-space:nowrap"><i class="fa-solid fa-ban"></i> Đình chỉ</span>
                </div>
                <div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:8px">
                  <i class="fa-solid fa-user"></i> ${t.tenNguoiNhan || t.nguoiNhan || "—"}
                  ${t.lyDoDinhChi ? `<br><i class="fa-solid fa-circle-info"></i> Lý do: ${t.lyDoDinhChi}` : ""}
                </div>
                <div style="display:flex;gap:6px">
                  <button class="btn btn-sm btn-secondary" onclick="AppModules.tasks.openTaskDrawer('${t.id}')"><i class="fa-solid fa-eye"></i> Xem</button>
                  ${laQuanLy ? `<button class="btn btn-sm btn-success" onclick="AppModules.tasks.khoiPhucCongViec('${t.id}')"><i class="fa-solid fa-rotate-left"></i> Bỏ đình chỉ</button>` : ""}
                </div>
              </div>`).join("")}
          </div></div>`;
        },

        /* RENDER KANBAN BOARD */
        renderKanbanBoard(taskList) {
          // [THÊM MỚI 27/08/2026] Bảng kanban chỉ hiện việc ĐANG hiệu lực; việc đình chỉ
          // bỏ khỏi 4 cột (xem/quản lý ở chế độ Bảng). Tránh rối bảng việc.
          taskList = taskList.filter(t => t.trangThai !== "dinh_chi");
          // [THÊM MỚI 28/08/2026] Tách việc TRẢ LẠI ra cột riêng (cột 5); 4 cột kia KHÔNG lẫn việc trả lại.
          const colTraLai = taskList.filter(t => t.trangThai === "tra_lai");
          const conLai = taskList.filter(t => t.trangThai !== "tra_lai");
          const colMoi = conLai.filter(t => t.tienDo === 0 && t.trangThai !== "hoan_thanh");
          const colDangLam = conLai.filter(t => t.tienDo > 0 && t.tienDo < 100 && t.trangThai !== "cho_nghiem_thu");
          const colChoNghiemThu = conLai.filter(t => t.trangThai === "cho_nghiem_thu" || (t.tienDo >= 100 && t.trangThai !== "hoan_thanh"));
          const colHoanThanh = conLai.filter(t => t.trangThai === "hoan_thanh");

          return `
            <div class="kanban-board">
              <!-- Cột 1: Mới Phân Công -->
              <div class="kanban-column">
                <div class="kanban-header">
                  <span style="color:#0284c7;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-circle-dot" style="font-size:11px;"></i> Mới Phân Công
                  </span>
                  <span class="badge badge-info">${colMoi.length}</span>
                </div>
                <div class="kanban-card-list">
                  ${colMoi.length === 0 ? `
                    <div style="text-align:center;padding:35px 10px;color:var(--text-muted);font-size:12px">
                      <i class="fa-solid fa-inbox" style="font-size:24px;margin-bottom:8px;opacity:0.4;display:block;"></i>
                      Không có việc mới
                    </div>
                  ` : colMoi.map(t => this.renderKanbanCard(t)).join("")}
                </div>
              </div>

              <!-- Cột 2: Đang Thực Hiện -->
              <div class="kanban-column">
                <div class="kanban-header">
                  <span style="color:#2563eb;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-spinner" style="font-size:11px;"></i> Đang Thực Hiện
                  </span>
                  <span class="badge badge-info">${colDangLam.length}</span>
                </div>
                <div class="kanban-card-list">
                  ${colDangLam.length === 0 ? `
                    <div style="text-align:center;padding:35px 10px;color:var(--text-muted);font-size:12px">
                      <i class="fa-solid fa-briefcase" style="font-size:24px;margin-bottom:8px;opacity:0.4;display:block;"></i>
                      Chưa có việc đang làm
                    </div>
                  ` : colDangLam.map(t => this.renderKanbanCard(t)).join("")}
                </div>
              </div>

              <!-- Cột 3: Chờ Nghiệm Thu -->
              <div class="kanban-column">
                <div class="kanban-header">
                  <span style="color:#7c3aed;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-hourglass-half" style="font-size:11px;"></i> Chờ Nghiệm Thu
                  </span>
                  <span class="badge badge-purple">${colChoNghiemThu.length}</span>
                </div>
                <div class="kanban-card-list">
                  ${colChoNghiemThu.length === 0 ? `
                    <div style="text-align:center;padding:35px 10px;color:var(--text-muted);font-size:12px">
                      <i class="fa-solid fa-circle-check" style="font-size:24px;margin-bottom:8px;opacity:0.4;display:block;"></i>
                      Không có việc chờ duyệt
                    </div>
                  ` : colChoNghiemThu.map(t => this.renderKanbanCard(t)).join("")}
                </div>
              </div>

              <!-- Cột 4: Đã Hoàn Thành & Tính KPI -->
              <div class="kanban-column">
                <div class="kanban-header">
                  <span style="color:#059669;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-circle-check" style="font-size:11px;"></i> Đã Nghiệm Thu (KPI)
                  </span>
                  <span class="badge badge-success">${colHoanThanh.length}</span>
                </div>
                <div class="kanban-card-list">
                  ${colHoanThanh.length === 0 ? `
                    <div style="text-align:center;padding:35px 10px;color:var(--text-muted);font-size:12px">
                      <i class="fa-solid fa-award" style="font-size:24px;margin-bottom:8px;opacity:0.4;display:block;"></i>
                      Chưa có việc hoàn thành
                    </div>
                  ` : colHoanThanh.map(t => this.renderKanbanCard(t)).join("")}
                </div>
              </div>

              <!-- [THÊM MỚI 28/08/2026] Cột 5: TRẢ LẠI (nghiệm thu không đạt → trả về làm lại). -->
              <div class="kanban-column">
                <div class="kanban-header">
                  <span style="color:#dc2626;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-rotate-left" style="font-size:11px;"></i> Trả Lại
                  </span>
                  <span class="badge" style="background:#fee2e2;color:#b91c1c">${colTraLai.length}</span>
                </div>
                <div class="kanban-card-list">
                  ${colTraLai.length === 0 ? `
                    <div style="text-align:center;padding:35px 10px;color:var(--text-muted);font-size:12px">
                      <i class="fa-solid fa-rotate-left" style="font-size:24px;margin-bottom:8px;opacity:0.4;display:block;"></i>
                      Không có việc bị trả lại
                    </div>
                  ` : colTraLai.map(t => this.renderKanbanCard(t)).join("")}
                </div>
              </div>
            </div>
          `;
        },

        renderKanbanCard(item) {
          const isOverdue = new Date(item.deadline) < new Date(new Date().toISOString().split("T")[0]) && item.trangThai !== "hoan_thanh";
          const initials = (item.tenNguoiNhan || "NV").split(" ").map(n => n[0]).join("").slice(-2);
          const starsHtml = "⭐".repeat(item.trongSoKPI || 3);
          const diffDays = Math.round((new Date(item.deadline) - new Date(new Date().toISOString().split("T")[0])) / (1000 * 60 * 60 * 24));
          const deadlineText = isOverdue ? `Trễ ${Math.abs(diffDays)} ngày` : diffDays === 0 ? "Hôm nay" : `Còn ${diffDays} ngày`;
          // [THÊM MỚI 28/08/2026] Nút đình chỉ nhanh trên thẻ (chỉ quản lý trở lên). event.stopPropagation()
          // để bấm nút KHÔNG mở luôn drawer chi tiết. Xét theo cấp bậc nền cho vai trò tùy biến.
          const _cap = PhanQuyenService.capBacCua(CoreService.currentUser.role);
          const laQuanLy = ["manager", "hr", "director", "it_admin"].indexOf(_cap) >= 0;

          return `
            <div class="kanban-card ${item.uuTien === "cao" ? "urgent" : ""} ${isOverdue ? "overdue" : ""}" onclick="AppModules.tasks.openTaskDrawer('${item.id}')">
              <div class="kanban-tags">
                <span class="badge ${item.uuTien === "cao" ? "badge-danger" : "badge-info"}" style="font-size:10px">
                  ${item.uuTien === "cao" ? "🔥 Gấp" : "Thường"}
                </span>
                <span class="badge badge-purple" style="font-size:10px">${starsHtml} (${item.trongSoKPI || 3})</span>
                ${item.diemDanhGia > 0 ? `<span class="badge badge-success" style="font-size:10px">⭐ ${item.diemDanhGia}đ</span>` : ""}
                ${laQuanLy ? `<button title="Đình chỉ / hủy việc này" onclick="event.stopPropagation();AppModules.tasks.dinhChiCongViec('${item.id}')" style="margin-left:auto;border:none;background:transparent;color:#b91c1c;cursor:pointer;font-size:12px;padding:0 2px"><i class="fa-solid fa-ban"></i></button>` : ""}
              </div>

              <div class="kanban-card-title">${item.tenCV}</div>
              ${item.trangThai === "tra_lai" ? `
                <!-- [THÊM MỚI 28/08/2026] Việc bị trả lại: hiện lý do màu đỏ cho người làm biết phải sửa gì. -->
                <div style="font-size:11px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:4px 6px;margin:6px 0">
                  <i class="fa-solid fa-rotate-left"></i> Bị trả lại: ${item.lyDoTraLai || item.danhGiaNote || "Yêu cầu làm lại"}
                </div>` : ""}

              <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;">
                <i class="fa-solid fa-bullseye" style="color:var(--primary-main);"></i> ${item.tieuChuan || item.moTa || "Chưa có mô tả"}
              </div>

              <!-- Mini Progress Bar -->
              <div style="background:#e2e8f0;border-radius:4px;overflow:hidden;height:6px;margin-bottom:8px">
                <div style="background:${item.tienDo >= 100 ? "var(--success-text)" : "linear-gradient(90deg, #2563eb, #38bdf8)"};width:${item.tienDo}%;height:100%;border-radius:4px;"></div>
              </div>

              <div class="kanban-footer">
                <div class="user-avatar-badge" title="Người nhận: ${item.tenNguoiNhan}">
                  <span class="user-avatar-circle">${initials}</span>
                  <span style="font-weight:600;color:var(--text-primary);">${item.tenNguoiNhan.split(" ").slice(-1)[0]}</span>
                </div>
                
                <div style="display:flex;align-items:center;gap:4px;color:${isOverdue ? "var(--danger-text)" : "var(--text-muted)"};font-weight:${isOverdue ? "700" : "500"};font-size:11px;">
                  <i class="fa-regular fa-clock"></i> <span>${deadlineText}</span>
                </div>
              </div>
            </div>
          `;
        },

        /* RENDER TABLE VIEW */
        renderTableView(taskList) {
          const currentUser = CoreService.currentUser;
          const isManager = currentUser.role === "admin" || currentUser.role === "manager" || currentUser.role === "director" || currentUser.role === "hr" || currentUser.role === "it_admin";

          return `
            <div class="card">
              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:40px">STT</th>
                      <th class="col-ma" style="width:75px">Mã Việc</th>
                      <th>Tên Công Việc & Tiêu Chuẩn Nghiệm Thu</th>
                      <th style="width:130px">Người Nhận</th>
                      <th style="width:75px;text-align:center">Ưu Tiên</th>
                      <th style="width:95px;text-align:center">Trọng Số KPI</th>
                      <th class="col-ngay" style="width:95px">Hạn Xong</th>
                      <th style="width:120px">Tiến Độ %</th>
                      <th style="width:105px;text-align:center">Trạng Thái</th>
                      <th style="width:110px;text-align:center">Đánh Giá KPI</th>
                      <th class="col-action" style="width:110px">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${taskList.length === 0 ? `<tr><td colspan="11" class="col-action o-rong">Không có công việc nào</td></tr>` : taskList.map((item, idx) => {
                      const isOverdue = new Date(item.deadline) < new Date(new Date().toISOString().split("T")[0]) && item.trangThai !== "hoan_thanh";
                      return `
                        <tr style="${isOverdue ? "background:#fff1f2;" : ""};cursor:pointer" onclick="AppModules.tasks.openTaskDrawer('${item.id}')">
                          <td class="col-stt">${idx + 1}</td>
                          <td class="col-ma">${item.id}</td>
                          <td>
                            <strong>${item.tenCV}</strong>
                            ${isOverdue ? `<span class="badge badge-danger" style="margin-left:6px;font-size:10px">Quá hạn</span>` : ""}
                            <br>
                            <small class="text-muted"><i class="fa-solid fa-circle-info"></i> ${item.tieuChuan || item.moTa || "Chưa có tiêu chuẩn"}</small>
                          </td>
                          <td><strong>${item.tenNguoiNhan}</strong><br><small class="text-muted">${item.nguoiNhan}</small></td>
                          <td style="text-align:center">${item.uuTien === "cao" ? `<span class="badge badge-danger">Gấp</span>` : `<span class="badge badge-info">Thường</span>`}</td>
                          <td style="text-align:center;font-size:12px">${"⭐".repeat(item.trongSoKPI || 3)}</td>
                          <td class="col-ngay ${isOverdue ? "text-danger" : ""}" style="font-weight:${isOverdue ? "bold" : "normal"}">${formatDateDisplay(item.deadline)}</td>
                          <td>
                            <div style="background:#e2e8f0;border-radius:4px;overflow:hidden;height:10px;width:70px;margin-bottom:3px">
                              <div style="background:${item.tienDo >= 100 ? "var(--success-text)" : "var(--primary-main)"};width:${item.tienDo}%;height:100%"></div>
                            </div>
                            <small class="col-so" style="font-weight:bold">${item.tienDo}%</small>
                          </td>
                          <td style="text-align:center">
                            ${
                              item.trangThai === "dinh_chi"
                                ? `<span class="badge badge-danger" title="${item.lyDoDinhChi || ''}">⏸️ Đình chỉ</span>`
                                : item.trangThai === "tra_lai"
                                ? `<span class="badge" style="background:#fee2e2;color:#b91c1c" title="${item.lyDoTraLai || ''}">↩️ Trả lại</span>`
                                : item.trangThai === "hoan_thanh"
                                ? `<span class="badge badge-success">Đã xong</span>`
                                : item.trangThai === "cho_nghiem_thu" || item.tienDo >= 100
                                ? `<span class="badge badge-purple">Chờ duyệt</span>`
                                : `<span class="badge badge-info">Đang làm</span>`
                            }
                            ${(item.trangThai !== "dinh_chi" && item.trangThai !== "tra_lai") ? `<br><small class="text-muted" style="font-size:10px">${(timGiaiDoan(giaiDoanTuTask(item))||{}).ten || ""}</small>` : ``}
                          </td>
                          <td style="text-align:center">
                            ${item.diemDanhGia > 0 ? `<span class="badge badge-success" style="font-weight:bold">${item.diemDanhGia} đ</span>` : `<span class="badge badge-warning">Chưa chấm</span>`}
                          </td>
                          <td class="col-action" onclick="event.stopPropagation()">
                            <button class="btn btn-sm btn-secondary" onclick="AppModules.tasks.openTaskDrawer('${item.id}')">
                              <i class="fa-solid fa-expand"></i> Chi tiết
                            </button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        },

        /* =========================================================================
           SLIDE-OVER TASK DRAWER (LINEAR / NOTION STYLE)
           ========================================================================= */
        /* [THÊM MỚI 25/08/2026] MỞ Ô GHI NHẬT KÝ CÔNG VIỆC.
           Nút "Báo cáo" ở Trang chủ gọi hàm này nhưng hàm CHƯA ĐƯỢC VIẾT
           -> bấm chỉ nhảy sang tab Công Việc rồi đứng im.
           Ngăn kéo chi tiết công việc đã có sẵn nên chỉ cần mở đúng việc đó. */
        openLogModal(cvId) {
          this.openTaskDrawer(cvId);
        },

        openTaskDrawer(cvId) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;

          const currentUser = CoreService.currentUser;
          const isManager = currentUser.role === "admin" || currentUser.role === "manager" || currentUser.role === "director" || currentUser.role === "hr" || currentUser.role === "it_admin";
          const isOverdue = new Date(cv.deadline) < new Date(new Date().toISOString().split("T")[0]) && cv.trangThai !== "hoan_thanh";

          // Khởi tạo checklist mặc định nếu chưa có
          if (!cv.checklist || cv.checklist.length === 0) {
            cv.checklist = [
              { id: "c1", text: "Khảo sát và chuẩn bị tài liệu / vật tư liên quan", done: cv.tienDo >= 30 },
              { id: "c2", text: "Thực hiện xử lý chuyên môn theo đúng tiêu chuẩn kỹ thuật", done: cv.tienDo >= 70 },
              { id: "c3", text: "Kiểm tra đối soát chất lượng và hoàn tất sản phẩm đầu ra", done: cv.tienDo >= 100 }
            ];
          }

          // Cập nhật Header Drawer
          document.getElementById("drawerTaskId").textContent = cv.id;
          // [THÊM MỚI 27/08/2026] Giai đoạn hiện tại của việc (suy từ dữ liệu cũ nếu chưa có trường giaiDoan).
          const gdHienTai = giaiDoanTuTask(cv);
          const statusBadgeEl = document.getElementById("drawerTaskStatusBadge");
          if (cv.trangThai === "dinh_chi") {
            statusBadgeEl.className = "badge badge-danger";
            statusBadgeEl.innerHTML = "<i class='fa-solid fa-ban'></i> Đã Đình Chỉ";
          } else if (cv.trangThai === "tra_lai") {
            // [THÊM MỚI 28/08/2026] Trạng thái Trả lại (nghiệm thu không đạt → làm lại).
            statusBadgeEl.className = "badge";
            statusBadgeEl.setAttribute("style", "background:#fee2e2;color:#b91c1c");
            statusBadgeEl.innerHTML = "<i class='fa-solid fa-rotate-left'></i> Bị Trả Lại";
          } else if (cv.trangThai === "hoan_thanh") {
            statusBadgeEl.className = "badge badge-success";
            statusBadgeEl.innerHTML = "<i class='fa-solid fa-check'></i> Đã Nghiệm Thu";
          } else if (cv.trangThai === "cho_nghiem_thu" || cv.tienDo >= 100) {
            statusBadgeEl.className = "badge badge-purple";
            statusBadgeEl.innerHTML = "<i class='fa-solid fa-hourglass-half'></i> Chờ Nghiệm Thu";
          } else {
            statusBadgeEl.className = "badge badge-info";
            statusBadgeEl.innerHTML = "<i class='fa-solid fa-spinner'></i> Đang Thực Hiện";
          }

          // Cập nhật Body Drawer
          const bodyHtml = `
            <div style="margin-bottom:16px">
              <h2 style="font-size:18px;font-family:var(--font-doc);margin-bottom:6px;line-height:1.4">${cv.tenCV}</h2>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <span class="badge ${cv.uuTien === "cao" ? "badge-danger" : "badge-info"}">${cv.uuTien === "cao" ? "🔥 Gấp / Ưu Tiên Cao" : "Thường"}</span>
                <span class="badge badge-purple">${"⭐".repeat(cv.trongSoKPI || 3)} Trọng số KPI: ${cv.trongSoKPI || 3}</span>
                <span class="badge badge-info"><i class="fa-solid fa-user"></i> ${cv.tenNguoiNhan}</span>
                <span class="badge ${isOverdue ? "badge-danger" : "badge-secondary"}"><i class="fa-regular fa-clock"></i> Hạn: ${formatDateDisplay(cv.deadline)}</span>
              </div>
            </div>

            <!-- [THÊM MỚI 27/08/2026] GIAI ĐOẠN CÔNG VIỆC (5 bước) — bấm để chuyển giai đoạn.
                 Mỗi giai đoạn ứng một % hoàn thành → KPI tính đúng công theo từng bước. -->
            <div class="card" style="padding:12px;margin-bottom:16px;border-left:4px solid var(--primary-main)">
              <div style="font-weight:bold;font-size:13px;margin-bottom:8px"><i class="fa-solid fa-list-ol"></i> Giai Đoạn Công Việc (căn cứ tính KPI)</div>
              ${cv.trangThai === "dinh_chi" ? `
                <div><span class="badge badge-danger"><i class="fa-solid fa-ban"></i> Đã đình chỉ — không tính KPI</span>${cv.lyDoDinhChi ? ` <small class="text-muted">Lý do: ${cv.lyDoDinhChi}</small>` : ``}</div>
                ${isManager ? `<button class="btn btn-sm btn-secondary" style="margin-top:8px" onclick="AppModules.tasks.khoiPhucCongViec('${cv.id}')"><i class="fa-solid fa-rotate-left"></i> Bỏ đình chỉ (tiếp tục làm)</button>` : ``}
              ` : `
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
                  ${getGiaiDoanCV().map(g => `<button class="btn btn-sm ${gdHienTai === g.id ? "btn-primary" : "btn-secondary"}" onclick="AppModules.tasks.datGiaiDoan('${cv.id}','${g.id}')">${g.ten} <span style="opacity:0.7">(${g.pt}%)</span></button>`).join("")}
                </div>
                ${isManager ? `<button class="btn btn-sm btn-danger" onclick="AppModules.tasks.dinhChiCongViec('${cv.id}')"><i class="fa-solid fa-ban"></i> Đình chỉ công việc này</button>` : ``}
              `}
            </div>

            <!-- Thông tin tiêu chuẩn đầu ra -->
            <div style="background:var(--primary-lighter);padding:12px;border-radius:6px;margin-bottom:16px;border-left:4px solid var(--primary-main)">
              <div style="font-weight:bold;color:var(--primary-dark);font-size:12px;margin-bottom:3px"><i class="fa-solid fa-bullseye"></i> TIÊU CHUẨN NGHIỆM THU ĐẦU RA (KPI OUTPUT):</div>
              <div style="font-size:13px;color:var(--text-primary)">${cv.tieuChuan || cv.moTa || "Hoàn thành công việc theo đúng quy trình nội bộ."}</div>
            </div>

            <!-- 1. Interactive Checklist (Tích chọn tự nhảy %) -->
            <div style="margin-bottom:20px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <strong style="font-size:14px"><i class="fa-solid fa-list-check"></i> Tiêu Chí Nghiệm Thu Con (Interactive Checklist)</strong>
                <span style="font-weight:bold;color:var(--primary-main);font-size:13px" id="drawerProgressText">${cv.tienDo}%</span>
              </div>
              <div style="background:#e2e8f0;border-radius:4px;overflow:hidden;height:8px;margin-bottom:10px">
                <div id="drawerProgressBar" style="background:var(--primary-main);width:${cv.tienDo}%;height:100%;transition:width 0.2s ease"></div>
              </div>
              
              <div class="checklist-container">
                ${cv.checklist.map((c, i) => `
                  <div class="checklist-item ${c.done ? "completed" : ""}" id="chkItem_${c.id}">
                    <input type="checkbox" id="chk_${c.id}" ${c.done ? "checked" : ""} onchange="AppModules.tasks.toggleChecklistItem('${cv.id}', '${c.id}', this.checked)">
                    <label for="chk_${c.id}" style="cursor:pointer;flex:1">${c.text}</label>
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- 2. Khai Báo Nhật Ký Tiến Độ Hôm Nay (Daily Log) -->
            <div class="card" style="padding:14px;margin-bottom:20px;background:var(--bg-surface)">
              <div style="font-weight:bold;font-size:13px;margin-bottom:10px"><i class="fa-solid fa-pen-to-square"></i> Khai Báo Báo Cáo Ngày (Daily Log)</div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Số Giờ Làm</label>
                  <input type="number" id="inpDrawerGio" class="form-control" value="2" step="0.5" min="0.5">
                </div>
                <div class="form-group">
                  <label class="form-label">Tiến Độ % Mới</label>
                  <input type="number" id="inpDrawerTienDo" class="form-control" value="${cv.tienDo}" min="0" max="100">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Nội Dung Thực Hiện & Bàn Giao</label>
                <textarea id="inpDrawerNoiDung" class="form-control" rows="2" placeholder="Ghi chú kết quả xử lý hôm nay..."></textarea>
              </div>
              <button type="button" class="btn btn-sm btn-primary" onclick="AppModules.tasks.saveDrawerDailyLog('${cv.id}')">
                <i class="fa-solid fa-plus"></i> Lưu Nhật Ký Ngày
              </button>
            </div>

            <!-- 3. Lịch Sử Báo Cáo -->
            <div style="margin-bottom:20px">
              <strong style="font-size:13px"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử Khai Báo (${(cv.dailyLogs || []).length} lượt)</strong>
              <div class="table-responsive" style="max-height:140px;margin-top:8px">
                <table>
                  <thead>
                    <tr>
                      <th class="col-ngay" style="width:100px">Ngày</th>
                      <th class="col-so" style="width:60px">Số Giờ</th>
                      <th class="col-so" style="width:60px">Tiến Độ</th>
                      <th>Nội Dung</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(cv.dailyLogs || []).length === 0 ? `<tr><td colspan="4" class="col-action o-rong">Chưa có nhật ký</td></tr>` : (cv.dailyLogs || []).map(l => `
                      <tr>
                        <td class="col-ngay">${formatDateDisplay(l.ngay)}</td>
                        <td class="col-so">${l.gioLam}h</td>
                        <td class="col-so">${l.tienDoLog}%</td>
                        <td>${l.noiDung}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- 4. Khối Nghiệm Thu & Chấm Điểm KPI (Quản Lý) -->
            ${isManager ? `
              <div class="card" style="padding:14px;background:#f8fafc;border:1px solid #cbd5e1">
                <div style="font-weight:bold;font-size:13px;margin-bottom:10px;color:var(--primary-dark)"><i class="fa-solid fa-award"></i> Nghiệm Thu & Đánh Giá Chất Lượng KPI (Trưởng Phòng)</div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Điểm Chất Lượng (0 - 100)</label>
                    <input type="number" id="inpDrawerDiem" class="form-control" value="${cv.diemDanhGia > 0 ? cv.diemDanhGia : 95}" min="0" max="100">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Trạng Thái Duyệt</label>
                    <select id="inpDrawerStatus" class="form-control">
                      <option value="hoan_thanh" ${cv.trangThai === "hoan_thanh" ? "selected" : ""}>✅ Hoàn Thành Nghiệm Thu</option>
                      <!-- [SỬA 28/08/2026] "Trả lại" là 1 TRẠNG THÁI RIÊNG (không đạt → trả về làm lại), hiện ở cột Trả Lại. -->
                      <option value="tra_lai" ${cv.trangThai === "tra_lai" ? "selected" : ""}>↩️ Trả Lại — Yêu Cầu Làm Lại</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Nhận Xét Chất Lượng</label>
                  <textarea id="inpDrawerNote" class="form-control" rows="2" placeholder="Đánh giá ưu nhược điểm...">${cv.danhGiaNote || ""}</textarea>
                </div>
                <button type="button" class="btn btn-sm btn-success" onclick="AppModules.tasks.saveDrawerReview('${cv.id}')">
                  <i class="fa-solid fa-check-double"></i> Xác Nhận Nghiệm Thu & Tính KPI
                </button>
              </div>
            ` : ``}
          `;

          // Cập nhật Footer Drawer
          const footerHtml = `
            <button type="button" class="btn btn-secondary btn-sm" onclick="AppModules.tasks.closeDrawer()">Đóng</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="AppModules.tasks.submitDrawerCompletion('${cv.id}')">
              <i class="fa-solid fa-paper-plane"></i> Nộp Nghiệm Thu 100%
            </button>
          `;

          document.getElementById("drawerTaskBody").innerHTML = bodyHtml;
          document.getElementById("drawerTaskFooter").innerHTML = footerHtml;
          document.getElementById("taskDrawerOverlay").classList.add("active");
        },

        closeDrawer(e) {
          if (e && e.target !== document.getElementById("taskDrawerOverlay") && e.target.tagName !== "BUTTON" && !e.target.closest("button")) {
            return;
          }
          document.getElementById("taskDrawerOverlay").classList.remove("active");
          this.render();
        },

        toggleChecklistItem(cvId, checkId, isDone) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv || !cv.checklist) return;

          const item = cv.checklist.find(c => c.id === checkId);
          if (item) item.done = isDone;

          // Tính lại % tiến độ dựa trên số lượng checkbox hoàn thành
          const doneCount = cv.checklist.filter(c => c.done).length;
          const totalCount = cv.checklist.length;
          const newPercent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
          cv.tienDo = newPercent;
          if (cv.tienDo >= 100) cv.trangThai = "cho_nghiem_thu";

          DataService.saveData(data);

          // Cập nhật UI tức thì trên Drawer
          document.getElementById("drawerProgressText").textContent = newPercent + "%";
          document.getElementById("drawerProgressBar").style.width = newPercent + "%";
          document.getElementById("inpDrawerTienDo").value = newPercent;
          const chkRow = document.getElementById(`chkItem_${checkId}`);
          if (chkRow) {
            if (isDone) chkRow.classList.add("completed");
            else chkRow.classList.remove("completed");
          }
        },

        saveDrawerDailyLog(cvId) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;

          const noiDung = document.getElementById("inpDrawerNoiDung").value.trim();
          if (!noiDung) {
            CoreService.showToast("Vui lòng nhập nội dung thực hiện!", "warning");
            return;
          }

          const gioLam = parseFloat(document.getElementById("inpDrawerGio").value) || 0;
          const tienDoLog = parseInt(document.getElementById("inpDrawerTienDo").value) || 0;

          if (!cv.dailyLogs) cv.dailyLogs = [];
          cv.dailyLogs.unshift({
            ngay: new Date().toISOString().split("T")[0],
            gioLam,
            tienDoLog,
            noiDung
          });
          cv.tienDo = tienDoLog;
          if (cv.tienDo >= 100) cv.trangThai = "cho_nghiem_thu";
          // [THÊM MỚI 28/08/2026] Việc đang bị TRẢ LẠI mà người làm cập nhật tiến độ (<100%)
          // thì tự chuyển về "đang làm" — coi như đã nhận làm lại.
          else if (cv.trangThai === "tra_lai") cv.trangThai = "dang_lam";

          DataService.saveData(data);
          CoreService.showToast("Đã lưu nhật ký báo cáo ngày!", "success");
          this.openTaskDrawer(cvId); // Reload drawer
        },

        saveDrawerReview(cvId) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;

          const diem = parseInt(document.getElementById("inpDrawerDiem").value) || 0;
          const status = document.getElementById("inpDrawerStatus").value;
          const note = document.getElementById("inpDrawerNote").value.trim();

          cv.trangThai = status;
          cv.danhGiaNote = note;
          // [SỬA 28/08/2026] Tách 2 nhánh: HOÀN THÀNH (tính điểm KPI) vs TRẢ LẠI (không tính điểm, ghi lý do).
          if (status === "hoan_thanh") {
            cv.diemDanhGia = diem;
            cv.tienDo = 100;
            cv.giaiDoan = "hoan_tat";                       // nghiệm thu xong = giai đoạn Hoàn tất
            cv.ngayNghiemThu = new Date().toISOString().split("T")[0];
          } else { // tra_lai
            cv.lyDoTraLai = note;                            // lý do trả lại hiện trên thẻ cột Trả Lại
            cv.giaiDoan = "thuc_thi";                        // trả về giai đoạn Thực thi để làm lại
            // KHÔNG tính điểm, giữ nguyên tiến độ hiện tại để người làm sửa tiếp.
          }

          DataService.saveData(data);
          CoreService.showToast(status === "hoan_thanh" ? "Đã nghiệm thu & tính điểm KPI!" : "Đã TRẢ LẠI việc — yêu cầu làm lại.", status === "hoan_thanh" ? "success" : "warning");
          this.closeDrawer();
        },

        /* [THÊM MỚI 27/08/2026] ĐỔI GIAI ĐOẠN CÔNG VIỆC.
           Đặt giai đoạn mới → đồng bộ tiến độ % theo giai đoạn (để KPI tính đúng) và
           trạng thái cũ (dang_lam/cho_nghiem_thu/hoan_thanh) để phần code cũ không vỡ.
           Nhận: cvId (mã việc), gd (mã giai đoạn). */
        datGiaiDoan(cvId, gd) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;
          const gdObj = timGiaiDoan(gd);
          if (!gdObj) return;
          cv.giaiDoan = gd;
          cv.tienDo = gdObj.pt;                       // tiến độ = % của giai đoạn
          cv.trangThai = trangThaiTuGiaiDoan(gd);     // ánh xạ về trạng thái cũ
          if (gd === "hoan_tat") cv.ngayNghiemThu = cv.ngayNghiemThu || new Date().toISOString().split("T")[0];
          DataService.saveData(data);
          CoreService.showToast("Đã chuyển sang giai đoạn: " + gdObj.ten + " (" + gdObj.pt + "%).", "success");
          this.openTaskDrawer(cvId);                      // vẽ lại ngăn chi tiết
          this.render();                              // vẽ lại bảng/kanban
        },

        /* Đình chỉ công việc (không làm nữa) → LOẠI khỏi KPI. Hỏi lý do trước. */
        dinhChiCongViec(cvId) {
          const bodyHtml = `
            <form onsubmit="return false;">
              <p style="font-size:13px">Đình chỉ = việc <strong>không thực hiện nữa</strong> và <strong>không tính vào KPI</strong> (không coi là trượt).</p>
              <div class="form-group">
                <label class="form-label">Lý do đình chỉ</label>
                <input type="text" id="inpLyDoDinhChi" class="form-control" placeholder="VD: Đổi hướng dự án / khách hủy / gộp vào việc khác...">
              </div>
            </form>`;
          CoreService.openModal("Đình Chỉ Công Việc", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            { text: "<i class='fa-solid fa-ban'></i> Xác nhận đình chỉ", class: "btn-danger", close: false, onClick: () => {
              const lyDo = (document.getElementById("inpLyDoDinhChi").value || "").trim();
              const d = DataService.getData();
              const c = (d.congViec || []).find(x => x.id === cvId);
              if (c) {
                // Nhớ trạng thái trước khi đình chỉ để lúc bỏ đình chỉ trả về đúng chỗ.
                c.trangThaiTruocDinhChi = c.trangThai;
                c.trangThai = "dinh_chi";
                c.lyDoDinhChi = lyDo;
                c.ngayDinhChi = new Date().toISOString().split("T")[0];
                DataService.saveData(d);
              }
              CoreService.closeModal();
              CoreService.showToast("Đã đình chỉ công việc (loại khỏi KPI).", "info");
              this.openTaskDrawer(cvId);
              this.render();
            } }
          ]);
        },

        /* Bỏ đình chỉ → trả việc về trạng thái/giai đoạn trước khi đình chỉ. */
        khoiPhucCongViec(cvId) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;
          cv.trangThai = cv.trangThaiTruocDinhChi || trangThaiTuGiaiDoan(giaiDoanTuTask(cv));
          delete cv.trangThaiTruocDinhChi;
          delete cv.lyDoDinhChi;
          delete cv.ngayDinhChi;
          DataService.saveData(data);
          CoreService.showToast("Đã bỏ đình chỉ, công việc tiếp tục được tính KPI.", "success");
          this.openTaskDrawer(cvId);
          this.render();
        },

        submitDrawerCompletion(cvId) {
          const data = DataService.getData();
          const cv = (data.congViec || []).find(c => c.id === cvId);
          if (!cv) return;

          cv.tienDo = 100;
          cv.trangThai = "cho_nghiem_thu";
          if (cv.checklist) cv.checklist.forEach(c => c.done = true);

          DataService.saveData(data);
          CoreService.showToast("Đã nộp nghiệm thu cho Quản lý / Trưởng phòng!", "success");
          this.openTaskDrawer(cvId);
        },

        /* =========================================================================
           SUBTAB 2: THƯ VIỆN MẪU CÔNG VIỆC CHUẨN HOÁ (JOB TEMPLATES)
           ========================================================================= */
        renderSubTabThuVienMau() {
          const data = DataService.getData();
          const templates = data.danhMucCongViec || [];
          const currentUser = CoreService.currentUser;
          const isManager = currentUser.role === "admin" || currentUser.role === "manager" || currentUser.role === "director" || currentUser.role === "hr" || currentUser.role === "it_admin";

          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-book-bookmark"></i> Danh Mục Công Việc (Mẫu Việc Theo Phòng Ban)</div>
                ${isManager ? `
                  <button class="btn btn-primary btn-sm" onclick="AppModules.tasks.openAddTemplateModal()">
                    <i class="fa-solid fa-plus"></i> + Thêm Mẫu Công Việc Mới
                  </button>
                ` : ``}
              </div>

              <p class="text-muted" style="margin-bottom:12px;font-size:13px">
                Thư viện công việc mẫu giúp Quản lý phân công việc trong <strong>3 giây</strong>. Hệ thống tự động điền tiêu chuẩn nghiệm thu, số giờ chuẩn và trọng số KPI để đánh giá công bằng.
              </p>

              <!-- [THÊM MỚI 28/08/2026] Dải minh hoạ % KPI theo 5 GIAI ĐOẠN — giúp người dùng HÌNH DUNG
                   việc đang ở giai đoạn nào thì được tính bao nhiêu % vào KPI (số lấy từ Cài đặt, sửa được). -->
              <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-bottom:14px">
                <div style="font-weight:600;font-size:12.5px;color:#15803d;margin-bottom:8px">
                  <i class="fa-solid fa-gauge-high"></i> Cách tính KPI theo giai đoạn (việc đang ở giai đoạn nào được tính đúng % đó vào điểm)
                </div>
                <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
                  ${getGiaiDoanCV().map((g, i) => `
                    <div style="flex:1;min-width:104px;border:1px solid var(--border-color);border-radius:8px;padding:8px 6px;text-align:center;background:#fff">
                      <div style="font-size:10.5px;color:var(--text-secondary)">Giai đoạn ${i + 1}</div>
                      <div style="font-weight:600;font-size:12px;margin:2px 0;line-height:1.25">${g.ten}</div>
                      <span class="badge ${g.mau}" style="font-size:12px">${g.pt}%</span>
                    </div>
                  `).join('<div style="color:var(--text-muted);flex:0 0 auto"><i class="fa-solid fa-chevron-right"></i></div>')}
                </div>
                <div style="font-size:10.5px;color:var(--text-muted);margin-top:6px">Sửa các mốc % này trong <strong>Cài đặt → Doanh Nghiệp → "Khoảng điểm 5 giai đoạn"</strong>.</div>
              </div>

              <div class="table-responsive">

        /* =========================================================================
           SUBTAB 3: BẢNG VINH DANH & TỔNG HỢP KPI THÁNG (LARK SUITE / OKR STYLE)
           ========================================================================= */
        renderSubTabTongHopKpi() {
          const data = DataService.getData();
          // [THÊM MỚI 26/08/2026] Cần cài đặt để lấy tỷ trọng hai trục và công chuẩn
          const settings = getCompanySettings();
          const allEmployees = (data.nhanVien || []).filter(n => n.trangThai !== "dinh_chi");
          const depts = [...new Set(allEmployees.map(n => n.phongBan).filter(Boolean))];
          const tasks = data.congViec || [];

          // Lọc nhân sự theo phòng ban
          let filterEmployees = allEmployees;
          if (this.selectedKpiDept !== "all") {
            filterEmployees = filterEmployees.filter(n => n.phongBan === this.selectedKpiDept);
          }

          // Tính toán KPI cho từng nhân sự
          const kpiResults = filterEmployees.map(emp => {
            // [SỬA 27/08/2026] LOẠI việc ĐÌNH CHỈ khỏi KPI — không tính vào tử số lẫn mẫu số,
            // không coi là trượt (đúng lựa chọn "đình chỉ = loại khỏi KPI").
            const empTasks = tasks.filter(t => t.nguoiNhan === emp.id && t.trangThai !== "dinh_chi");
            const totalAssigned = empTasks.length;
            const completedList = empTasks.filter(t => t.trangThai === "hoan_thanh" || t.tienDo >= 100);
            const totalCompleted = completedList.length;
            const completionRate = totalAssigned > 0 ? Math.round((totalCompleted / totalAssigned) * 100) : 0;

            let onTimeCount = 0;
            let totalQualityScore = 0;
            let reviewedCount = 0;
            let weightedScoreSum = 0;
            let totalMaxWeightSum = 0;

            empTasks.forEach(t => {
              const weight = t.trongSoKPI || 3;
              totalMaxWeightSum += weight * 100;

              const finishDate = t.ngayNghiemThu || new Date().toISOString().split("T")[0];
              const isLate = finishDate > t.deadline;
              const daysLate = isLate ? Math.max(1, Math.round((new Date(finishDate) - new Date(t.deadline)) / (1000 * 60 * 60 * 24))) : 0;
              
              let onTimeFactor = 1.0;
              if (isLate) {
                onTimeFactor = Math.max(0.5, 1.0 - (daysLate * 0.05));
              } else {
                onTimeCount++;
              }

              const quality = t.diemDanhGia > 0 ? t.diemDanhGia : (t.trangThai === "hoan_thanh" ? 90 : (t.tienDo || 0));
              if (t.diemDanhGia > 0) {
                totalQualityScore += t.diemDanhGia;
                reviewedCount++;
              }

              const taskScore = (t.tienDo / 100) * onTimeFactor * quality * weight;
              weightedScoreSum += taskScore;
            });

            const onTimeRate = totalAssigned > 0 ? Math.round((onTimeCount / totalAssigned) * 100) : 100;
            const avgQuality = reviewedCount > 0 ? Math.round(totalQualityScore / reviewedCount) : (completionRate > 0 ? 85 : 0);
            
            /* ---- TRỤC 1: HIỆU QUẢ (công thức cũ, giữ nguyên không đổi) ----
               Đo việc được giao làm tốt tới đâu: xong bao nhiêu %, đúng hạn không,
               chất lượng mấy điểm, việc nặng hay nhẹ. */
            let diemHieuQua = totalMaxWeightSum > 0 ? Math.round((weightedScoreSum / totalMaxWeightSum) * 100) : (totalAssigned === 0 ? 80 : 0);
            if (diemHieuQua > 100) diemHieuQua = 100;

            /* ---- TRỤC 2: KHỐI LƯỢNG ([THÊM MỚI 26/08/2026]) ----
               Đo làm được NHIỀU hay ÍT, dựa trên giờ dự kiến của việc đã xong. */
            const kl = tinhDiemKhoiLuong(emp, data, settings);

            /* ---- GỘP HAI TRỤC THEO TỶ TRỌNG TRONG CÀI ĐẶT ----
               Ví dụ: hiệu quả 92 điểm, khối lượng 75 điểm, tỷ trọng 80/20
                   -> (92 × 80 + 75 × 20) ÷ 100 = 88,6 -> làm tròn 89 điểm.
               Nếu ai lỡ đặt cả hai tỷ trọng bằng 0 thì quay về chỉ dùng hiệu quả,
               tránh phép chia cho 0 ra kết quả vô lý. */
            const ttHieuQua = Number(settings.kpiTyTrongHieuQua);
            const ttKhoiLuong = Number(settings.kpiTyTrongKhoiLuong);
            const tt1 = isNaN(ttHieuQua) ? 80 : ttHieuQua;
            const tt2 = isNaN(ttKhoiLuong) ? 20 : ttKhoiLuong;
            const tongTyTrong = tt1 + tt2;

            let totalKpiScore = tongTyTrong > 0
              ? Math.round((diemHieuQua * tt1 + kl.diem * tt2) / tongTyTrong)
              : diemHieuQua;
            if (totalKpiScore > 100) totalKpiScore = 100;

            let rank = "B";
            let rankBadge = "badge-info";
            let rankTitle = "Tier B (Đạt)";
            let bonusRate = 0.7;

            if (totalKpiScore >= 95) {
              rank = "A+";
              rankBadge = "badge-purple";
              rankTitle = "Tier A+ (Xuất Sắc)";
              bonusRate = 1.2;
            } else if (totalKpiScore >= 85) {
              rank = "A";
              rankBadge = "badge-success";
              rankTitle = "Tier A (Tốt)";
              bonusRate = 1.0;
            } else if (totalKpiScore >= 70) {
              rank = "B";
              rankBadge = "badge-info";
              rankTitle = "Tier B (Hoàn Thành)";
              bonusRate = 0.7;
            } else {
              rank = "C";
              rankBadge = "badge-danger";
              rankTitle = "Tier C (Cần Cải Thiện)";
              bonusRate = 0.0;
            }

            const kpiBonusEst = Math.round((emp.luongCoBan || 10000000) * 0.15 * bonusRate);

            return {
              emp,
              totalAssigned,
              totalCompleted,
              completionRate,
              onTimeRate,
              avgQuality,
              diemHieuQua,          // [THÊM MỚI 26/08/2026] điểm trục hiệu quả
              diemKhoiLuong: kl.diem,   // điểm trục khối lượng
              gioDaLam: kl.gioDaLam,    // tổng giờ chuẩn việc đã xong
              quyGioThang: kl.quyGioThang,
              totalKpiScore,
              rank,
              rankBadge,
              rankTitle,
              bonusRate,
              kpiBonusEst
            };
          });

          // Sắp xếp theo điểm KPI từ cao xuống thấp để vinh danh Top 3
          const sortedKpi = [...kpiResults].sort((a, b) => b.totalKpiScore - a.totalKpiScore);
          const top1 = sortedKpi[0];
          const top2 = sortedKpi[1];
          const top3 = sortedKpi[2];

          return `
            <!-- BẢNG VINH DANH TOP PERFORMERS (PODIUM 3 TẦNG) -->
            ${top1 ? `
              <div class="card" style="background:linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);padding:20px;margin-bottom:20px">
                <div style="text-align:center;margin-bottom:10px">
                  <div style="font-size:18px;font-weight:bold;font-family:var(--font-doc);color:var(--primary-dark)"><i class="fa-solid fa-trophy text-warning"></i> BẢNG VINH DANH TOP HIỆU SUẤT THÁNG ${this.selectedKpiMonth}</div>
                  <small class="text-muted">Ghi nhận những nhân sự có đóng góp xuất sắc nhất dựa trên ma trận KPI 4 chiều</small>
                </div>

                <div class="podium-wrapper">
                  <!-- Hạng 2: Bạc -->
                  ${top2 ? `
                    <div class="podium-card rank-2">
                      <div class="podium-medal">🥈</div>
                      <div class="podium-avatar" style="background:#64748b">${top2.emp.hoTen.split(" ").map(n => n[0]).join("").slice(-2)}</div>
                      <strong style="font-size:14px">${top2.emp.hoTen}</strong><br>
                      <small class="text-muted">${top2.emp.phongBan}</small>
                      <div class="podium-score">${top2.totalKpiScore} đ</div>
                      <span class="badge ${top2.rankBadge}">${top2.rankTitle}</span>
                    </div>
                  ` : ``}

                  <!-- Hạng 1: Vàng (Cao nhất) -->
                  <div class="podium-card rank-1">
                    <div class="podium-medal">🥇</div>
                    <div class="podium-avatar" style="background:#f59e0b">${top1.emp.hoTen.split(" ").map(n => n[0]).join("").slice(-2)}</div>
                    <strong style="font-size:15px;color:#92400e">${top1.emp.hoTen}</strong><br>
                    <small style="color:#b45309;font-weight:bold">${top1.emp.phongBan}</small>
                    <div class="podium-score" style="color:#b45309;font-size:22px">${top1.totalKpiScore} đ</div>
                    <span class="badge badge-purple" style="font-size:12px;padding:3px 10px">${top1.rankTitle}</span>
                  </div>

                  <!-- Hạng 3: Đồng -->
                  ${top3 ? `
                    <div class="podium-card rank-3">
                      <div class="podium-medal">🥉</div>
                      <div class="podium-avatar" style="background:#f97316">${top3.emp.hoTen.split(" ").map(n => n[0]).join("").slice(-2)}</div>
                      <strong style="font-size:14px">${top3.emp.hoTen}</strong><br>
                      <small class="text-muted">${top3.emp.phongBan}</small>
                      <div class="podium-score">${top3.totalKpiScore} đ</div>
                      <span class="badge ${top3.rankBadge}">${top3.rankTitle}</span>
                    </div>
                  ` : ``}
                </div>
              </div>
            ` : ``}

            <!-- BẢNG TỔNG HỢP CHI TIẾT & BỘ LỌC -->
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-chart-line"></i> Bảng Đánh Giá & Xếp Loại KPI Hiệu Suất Tháng ${this.selectedKpiMonth}</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <select class="form-control" style="width:130px;padding:4px 8px;font-size:12px" onchange="AppModules.tasks.selectedKpiMonth = this.value; AppModules.tasks.render();">
                    <option value="2026-08" selected>Tháng 08/2026</option>
                    <option value="2026-07">Tháng 07/2026</option>
                    <option value="2026-06">Tháng 06/2026</option>
                  </select>
                  <select class="form-control" style="width:170px;padding:4px 8px;font-size:12px" onchange="AppModules.tasks.selectedKpiDept = this.value; AppModules.tasks.render();">
                    <option value="all">-- Tất Cả Phòng Ban --</option>
                    ${depts.map(d => `<option value="${d}" ${this.selectedKpiDept === d ? "selected" : ""}>${d}</option>`).join("")}
                  </select>
                  <button class="btn btn-sm btn-secondary" onclick="AppModules.tasks.exportKpiExcel()">
                    <i class="fa-solid fa-file-excel"></i> Xuất Excel KPI
                  </button>
                  <button class="btn btn-sm btn-primary" onclick="AppModules.tasks.openPrintKpiReportModal()">
                    <i class="fa-solid fa-print"></i> In Báo Cáo KPI A4
                  </button>
                </div>
              </div>

              <div class="table-responsive">
                <!-- [THÊM MỚI 27/08/2026] class "bang-the" → điện thoại: bảng KPI thành THẺ từng người. -->
                <table class="bang-the">
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:40px">STT</th>
                      <th class="col-ma" style="width:75px">Mã NV</th>
                      <th>Họ Và Tên Nhân Viên</th>
                      <th>Chức Vụ & Phòng Ban</th>
                      <th class="col-so" style="width:80px">Số Việc</th>
                      <th class="col-so" style="width:90px">Đã Xong</th>
                      <th class="col-so" style="width:90px">Đúng Hạn</th>
                      <th class="col-so" style="width:90px">Chất Lượng</th>
                      <th class="col-so" style="width:105px" title="Tổng giờ chuẩn của các việc đã làm xong, so với quỹ giờ cả tháng (số ngày công chuẩn × 8 giờ). Chặn trần ở 120.">Khối Lượng</th>
                      <th style="width:130px;text-align:center">Điểm KPI Tổng</th>
                      <th style="width:135px;text-align:center">Phân Tầng Thi Đua</th>
                      <th class="col-so" style="width:130px">Thưởng KPI Dự Kiến</th>
                      <th class="col-action" style="width:110px">Chi Tiết</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${sortedKpi.map((k, idx) => `
                      <tr>
                        <td class="col-stt">${idx + 1}</td>
                        <td class="col-ma" data-label="Mã NV">${k.emp.id}</td>
                        <td data-label="Họ tên"><strong>${k.emp.hoTen}</strong></td>
                        <td data-label="Chức vụ">${k.emp.chucVu}<br><small class="text-muted">${k.emp.phongBan}</small></td>
                        <td class="col-so" data-label="Số việc">${k.totalAssigned}</td>
                        <td class="col-so" data-label="Đã xong">
                          <strong style="color:${k.completionRate >= 80 ? "var(--success-text)" : "inherit"}">${k.totalCompleted}</strong>
                          <small>(${k.completionRate}%)</small>
                        </td>
                        <td class="col-so" data-label="Đúng hạn">${k.onTimeRate}%</td>
                        <td class="col-so" data-label="Chất lượng">${k.avgQuality} đ</td>
                        <td class="col-so" data-label="Khối lượng" title="Đã làm xong ${formatNumber(k.gioDaLam, 0)} giờ / quỹ ${formatNumber(k.quyGioThang, 0)} giờ tháng">
                          <strong style="color:${k.diemKhoiLuong >= 80 ? "var(--success-text)" : k.diemKhoiLuong >= 50 ? "inherit" : "var(--danger-color)"}">${k.diemKhoiLuong}</strong>
                          <small style="color:var(--text-muted)"> (${formatNumber(k.gioDaLam, 0)}h)</small>
                        </td>
                        <td data-label="Điểm KPI" style="text-align:center">
                          <div style="background:#e2e8f0;border-radius:4px;overflow:hidden;height:12px;width:80px;margin:0 auto 3px">
                            <div style="background:${k.totalKpiScore >= 85 ? "var(--success-text)" : k.totalKpiScore >= 70 ? "var(--primary-main)" : "var(--warning-text)"};width:${k.totalKpiScore}%;height:100%"></div>
                          </div>
                          <strong style="font-size:13px;color:var(--primary-dark)">${k.totalKpiScore} / 100</strong>
                        </td>
                        <td data-label="Phân tầng" style="text-align:center">
                          <span class="badge ${k.rankBadge}" style="font-weight:bold">${k.rankTitle}</span>
                        </td>
                        <td class="col-so" data-label="Thưởng KPI" style="font-weight:bold;color:var(--success-text)">
                          +${formatCurrency(k.kpiBonusEst)}
                        </td>
                        <td class="col-action">
                          <button class="btn btn-sm btn-secondary" onclick="AppModules.tasks.viewEmployeeKpiDetail('${k.emp.id}')">
                            <i class="fa-solid fa-eye"></i> Chi tiết
                          </button>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        },

        /* =========================================================================
           CÁC MODAL HỖ TRỢ KHÁC
           ========================================================================= */
        openCreateModal(templateData = null) {

          // [SỬA 28/08/2026] Thiết kế lại hộp thoại Giao Việc: LƯỚI 2 CỘT gọn gàng, cân đối, ĐỠ PHẢI KÉO.

          const opt = sel.options[sel.selectedIndex];

          if (/kỹ thuật|ky thuat| it |công nghệ|cong nghe|phần mềm|phan mem|r&d|nghiên cứu|nghien cuu/.test(pb)) g = "ky_thuat";

          const data = DataService.getData();
          const allEmployees = (data.nhanVien || []).filter(n => n.trangThai !== "dinh_chi");

          const excelData = allEmployees.map((emp, idx) => {

            const totalAssigned = empTasks.length;
            const completedCount = empTasks.filter(t => t.trangThai === "hoan_thanh" || t.tienDo >= 100).length;

        checkInToday() {
          const todayStr = new Date().toISOString().split("T")[0];
          const user = CoreService.currentUser;
          const data = DataService.getData();
          const exist = (data.bangCong || []).find(b => b.maNV === user.id && b.ngay === todayStr);
          if (exist) {
            CoreService.showToast("Bạn đã điểm danh báo công hôm nay rồi!", "info");
            return;
          }
          const nowTime = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
          data.bangCong = data.bangCong || [];
          data.bangCong.unshift({
            maNV: user.id,
            ngay: todayStr,
            caLam: "Ca HC (08:00-17:30)",
            gioVao: nowTime,
            gioRa: "17:30",
            gioOT: 0,
            trangThai: "du_cong"
          });
          DataService.saveData(data);
          CoreService.showToast(`Điểm danh ngày ${formatDateDisplay(todayStr)} thành công!`, "success");
          AppModules.attendance.render();
        },

        /* [THÊM MỚI 25/08/2026] NHẬP BẢNG CHẤM CÔNG TỪ FILE EXCEL.
           Nút "Nhập Excel" vẫn gọi hàm này từ trước nhưng hàm CHƯA ĐƯỢC VIẾT
           -> chọn file xong không có gì xảy ra. Nay viết bổ sung, làm theo
           đúng khuôn của AppModules.employees.processImportEmployees().

           Nhận vào : rows — các dòng đọc được từ file Excel
           Ghi vào  : bảng bangCong. Trùng cùng một người + cùng một ngày thì
                      GHI ĐÈ dòng cũ, không tạo thêm dòng trùng. */
        processImportAttendance(rows) {
          if (!rows || rows.length === 0) { CoreService.showToast("File không có dữ liệu!", "warning"); return; }
          const data = DataService.getData();
          if (!data.bangCong) data.bangCong = [];
          let count = 0, boQua = 0;

          rows.forEach(r => {
            const maNV = r["Mã NV"] || r["MaNV"] || r["maNV"] || r["id"];
            const ngayRaw = r["Ngày"] || r["Ngay"] || r["ngay"] || r["Ngày Công"];
            if (!maNV || !ngayRaw) { boQua++; return; }

            // Excel có thể trả ngày dạng số thứ tự (số ngày kể từ 30/12/1899)
            // hoặc dạng chữ "25/08/2026". Đưa hết về dạng chuẩn 2026-08-25.
            let ngay = "";
            if (typeof ngayRaw === "number") {
              const d = new Date(Math.round((ngayRaw - 25569) * 86400 * 1000));
              ngay = d.toISOString().split("T")[0];
            } else {
              const s = String(ngayRaw).trim();
              const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
              if (m) ngay = m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
              else ngay = s.split("T")[0];
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(ngay)) { boQua++; return; }

            const obj = {
              maNV: String(maNV).trim(),
              ngay: ngay,
              caLam: r["Ca Làm"] || r["CaLam"] || "Ca HC (08:00-17:30)",
              gioVao: r["Giờ Vào"] || r["GioVao"] || "",
              gioRa: r["Giờ Ra"] || r["GioRa"] || "",
              gioOT: parseFloat(r["Giờ OT"] || r["GioOT"] || r["Giờ Tăng Ca OT"]) || 0,
              trangThai: r["Trạng Thái"] || r["TrangThai"] || "du_cong",
              hinhThuc: r["Hình Thức"] || r["HinhThuc"] || "nha_may",
              ghiChu: r["Ghi Chú"] || r["GhiChu"] || "Nhập từ file Excel"
            };

            const existIdx = data.bangCong.findIndex(b => b.maNV === obj.maNV && b.ngay === obj.ngay);
            if (existIdx >= 0) data.bangCong[existIdx] = obj;
            else data.bangCong.push(obj);
            count++;
          });

          DataService.saveData(data);
          CoreService.showToast(
            "Đã nhập " + count + " dòng chấm công từ Excel" + (boQua > 0 ? " (bỏ qua " + boQua + " dòng thiếu Mã NV hoặc Ngày)." : "."),
            count > 0 ? "success" : "warning");
          AppModules.attendance.render();
        },

        exportAttendanceExcel() {
          const data = DataService.getData();
          const settings = getCompanySettings();
          const approvedLeaves = (data.donTu || []).filter(d => d.trangThai === "da_duyet");
          const allEmployees = (data.nhanVien || []).filter(n => n.trangThai !== "dinh_chi");

          const rows = allEmployees.map(nv => {

            const luongCong = _l.luongCong;
            const thuongKpi = _l.thuongKpi;
            const ot = _l.luongOT;
            const bhxh = _l.bhxh;
            const thucLinh = _l.tongThucLinh;

            return {
              "Mã NV": nv.id,
              "Họ và Tên": nv.hoTen,
              "Phòng Ban": nv.phongBan,
              "Chức Vụ": nv.chucVu,

              "Thưởng KPI": thuongKpi,
              "Trích BHXH": bhxh,
              "Thực Lĩnh": thucLinh

           [SỬA 26/08/2026] Trước đây có BA mật khẩu viết thẳng trong mã nguồn, và
           app còn IN mật khẩu đó ra màn hình ở ba chỗ (ô gợi ý, dòng chú thích,
           thông báo khi gõ sai). Ai xem nguồn trang, hoặc chỉ cần gõ sai một lần,
           là biết mật khẩu quản trị -> khu vực phân quyền coi như không khoá.

           Nay: app KHÔNG lưu mật khẩu gốc ở đâu cả. Chỉ lưu "mã băm" của nó —
           một chuỗi 64 ký tự sinh ra từ mật khẩu, KHÔNG thể lần ngược lại được.
           Mỗi lần gõ, app băm chuỗi vừa gõ rồi so hai mã băm với nhau.

           Lần đầu (chưa có mã băm nào) -> đây là bước ĐẶT mật khẩu.
           Các lần sau                   -> là bước KIỂM TRA mật khẩu.

           Nhận vào : event (sự kiện bấm nút), đọc ô #inpMasterKey
           Trả ra   : không trả gì; đúng thì mở khoá và vẽ lại màn hình

           ⚠️ GIỚI HẠN CẦN BIẾT: đây là app chạy hoàn toàn trên máy người dùng,
           nên người có kỹ thuật vẫn có thể xoá mã băm trong bộ nhớ trình duyệt để
           đặt lại mật khẩu mới. Cách này chặn được người dùng thường, KHÔNG chặn
           được người biết kỹ thuật. Muốn chặn triệt để phải kiểm tra ở máy chủ. */
        async verifyMasterKey(event) {
          if (event) event.preventDefault();
          const o = document.getElementById("inpMasterKey");
          const matKhau = (o ? o.value : "").trim();
          const cauHinh = getCompanySettings();
          const daDatKhoa = !!cauHinh.rbacMasterKeyHash;

          // Trộn thêm chuỗi muối của app trước khi băm, để hai app khác nhau
          // cùng một mật khẩu vẫn ra mã băm khác nhau
          const bam = await LicenseService.sha256(LicenseService.SALT + "|rbac|" + matKhau);

          if (!daDatKhoa) {
            if (matKhau.length < 6) {
              CoreService.showToast("Mật khẩu quản trị phải dài tối thiểu 6 ký tự.", "warning");
              return;
            }
            cauHinh.rbacMasterKeyHash = bam;
            localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(cauHinh));
            this.unlockedMasterPass = true;
            CoreService.showToast("Đã đặt mật khẩu quản trị. Hãy ghi nhớ, app không tra lại được!", "success");
            this.render();
            return;
          }

          if (bam === cauHinh.rbacMasterKeyHash) {
            this.unlockedMasterPass = true;
            CoreService.showToast("Xác thực thành công! Đã mở khóa khu vực Phân Quyền.", "success");
            this.render();
          } else {
            // KHÔNG bao giờ in mật khẩu hay gợi ý mật khẩu trong thông báo lỗi
            CoreService.showToast("Mật khẩu quản trị không đúng.", "danger");
          }
        },

        lockMasterKey() {
          this.unlockedMasterPass = false;
          CoreService.showToast("Đã khóa lại khu vực Quản trị Phân Quyền!", "info");
          this.render();
        },
