          </div>`;
      },

      chonVaiTro(ma) { this.vaiTroChon = ma; this.render(); },

      // [THÊM MỚI 28/08/2026] Xem NHẬT KÝ THAY ĐỔI QUYỀN — modal bảng: thời gian, người, hành động, chi tiết.
      xemNhatKy() {
        const ds = (DataService.getData().nhatKyQuyen || []);
        // Định dạng ISO → "dd/mm/yyyy HH:MM".
        const dinhDangGio = (iso) => {
          try {
            const d = new Date(iso); const p = (n) => String(n).padStart(2, "0");
            return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
          } catch (e) { return iso; }
        };
        const body = ds.length === 0
          ? `<div style="text-align:center;padding:30px;color:var(--text-muted)"><i class="fa-solid fa-clock-rotate-left" style="font-size:26px;opacity:0.4;display:block;margin-bottom:8px"></i>Chưa có thay đổi quyền nào được ghi lại.</div>`
          : `<div class="table-responsive" style="max-height:55vh;overflow:auto"><table style="min-width:520px">
              <thead><tr><th style="width:130px">Thời gian</th><th style="width:130px">Người thực hiện</th><th style="width:120px">Hành động</th><th>Chi tiết</th></tr></thead>
              <tbody>${ds.map(x => `<tr>
                <td class="col-ngay" style="white-space:nowrap">${dinhDangGio(x.thoiGian)}</td>
                <td>${x.nguoiTen || "?"}<br><small class="text-muted">${x.nguoiMa || ""}</small></td>
                <td><span class="badge badge-info" style="font-size:10.5px">${x.hanhDong || ""}</span></td>
                <td style="font-size:12px">${x.chiTiet || ""}</td></tr>`).join("")}</tbody></table></div>
             <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Hiển thị ${ds.length} thay đổi gần nhất (giữ tối đa 500 dòng).</div>`;
        CoreService.openModal("Nhật Ký Thay Đổi Quyền", body, [{ text: "Đóng", class: "btn-secondary" }]);
      },

      // Bảo đảm vai trò đang chọn có 1 dòng đầy đủ trong ma trận (seed từ mặc định nếu chưa có),
      // rồi trả về object data để sửa tiếp. Nhờ vậy sửa 1 ô không làm mất các ô khác.
      _baoDamDong(data) {
        const role = this.vaiTroChon;
        data.maTranQuyen = data.maTranQuyen || {};
        if (!data.maTranQuyen[role]) {
          data.maTranQuyen[role] = {};
          DS_VUNG.forEach(v => { data.maTranQuyen[role][v.id] = quyenMacDinh(PhanQuyenService.capBacCua(role), v.id); });
        }
        return data;
      },

      // [THÊM MỚI 28/08/2026] Ghi ngày cập nhật cho 1 vai trò (seed data.vaiTro nếu cần) mỗi khi đổi quyền.
      _chamNgayCapNhat(data, ma) {
        data.vaiTro = (data.vaiTro && data.vaiTro.length) ? data.vaiTro : JSON.parse(JSON.stringify(VAI_TRO_MAC_DINH));
        const v = data.vaiTro.find(x => x.ma === ma);
        if (v) v.ngayCapNhat = new Date().toISOString();
      },

      datOQuyen(vung, hanhDong, giaTri) {
        const data = this._baoDamDong(DataService.getData());
        const o = data.maTranQuyen[this.vaiTroChon][vung];
        o[hanhDong] = !!giaTri;
        // Tắt "Xem" thì tắt luôn mọi quyền khác (không xem thì không thao tác được).
        if (hanhDong === "xem" && !giaTri) { ["them", "sua", "xoa", "duyet", "in"].forEach(h => o[h] = false); }
        this._chamNgayCapNhat(data, this.vaiTroChon);
        DataService.saveData(data);
        // [THÊM MỚI 28/08/2026] Ghi nhật ký thay đổi quyền.
        const _vt = PhanQuyenService.timVaiTro(this.vaiTroChon);
        PhanQuyenService.ghiNhatKy("Đổi quyền", `${(_vt && _vt.ten) || this.vaiTroChon}: ${hanhDong} vùng "${vung}" = ${giaTri ? "BẬT" : "TẮT"}`);
        // Chỉ vẽ lại khi bật/tắt "Xem" (để mở/khóa cả dòng); các ô khác lưu ngầm, không giật màn hình.
        if (hanhDong === "xem") this.render();
      },

      datPhamVi(vung, giaTri) {
        const data = this._baoDamDong(DataService.getData());
        data.maTranQuyen[this.vaiTroChon][vung].pham_vi = giaTri;
        this._chamNgayCapNhat(data, this.vaiTroChon);
        DataService.saveData(data);
      },

      khoiPhucVaiTro() {
        const data = DataService.getData();
        if (data.maTranQuyen) delete data.maTranQuyen[this.vaiTroChon];
        this._chamNgayCapNhat(data, this.vaiTroChon);
        DataService.saveData(data);
        CoreService.showToast("Đã khôi phục quyền mặc định cho vai trò này.", "success");
        this.render();
      },

      themVaiTro() {
        const bodyHtml = `
          <form>
            <div class="form-group"><label class="form-label">Tên Vai Trò</label>
              <input type="text" id="inpTenVaiTro" class="form-control" placeholder="VD: Thủ Kho, Trưởng Ca..."></div>
            <div class="form-group"><label class="form-label">Cấp Bậc Nền (quyết định quyền mặc định)</label>
              <select id="inpCapBac" class="form-control">
                <option value="employee">Nhân viên (chỉ việc cá nhân)</option>
                <option value="manager">Quản lý (duyệt theo phòng ban)</option>
                <option value="hr">HR/HCNS (quản lý nhân sự toàn cty)</option>
                <option value="accountant">Kế toán (xem tài chính toàn cty)</option>
                <option value="director">Giám đốc (xem tất cả)</option>
                <option value="it_admin">Quản trị IT (quản trị hệ thống)</option>
              </select>
              <small class="text-muted">Chọn cấp gần nhất; sau đó tinh chỉnh từng ô trong bảng quyền.</small></div>
          </form>`;
        CoreService.openModal("Thêm Vai Trò Mới", bodyHtml, [
          { text: "Hủy", class: "btn-secondary" },
          { text: "<i class='fa-solid fa-plus'></i> Thêm", class: "btn-primary", close: false, onClick: () => this.luuVaiTroMoi() }
        ]);
      },

      luuVaiTroMoi() {
        const ten = (document.getElementById("inpTenVaiTro").value || "").trim();
        const capBac = document.getElementById("inpCapBac").value;
        if (!ten) { CoreService.showToast("Vui lòng nhập tên vai trò!", "warning"); return; }
        const data = DataService.getData();
        data.vaiTro = (data.vaiTro && data.vaiTro.length) ? data.vaiTro : JSON.parse(JSON.stringify(VAI_TRO_MAC_DINH));
        // Sinh mã từ tên (bỏ dấu, gạch nối), tránh trùng.
        let goc = "vt_" + ten.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
        let ma = goc, k = 2; const daCo = new Set(data.vaiTro.map(v => v.ma));
        while (daCo.has(ma)) { ma = goc + "_" + k; k++; }
        // [THÊM MỚI 28/08/2026] Ghi ngày tạo + ngày cập nhật (ISO) cho vai trò mới.
        const bayGio = new Date().toISOString();
        data.vaiTro.push({ ma, ten, capBac, heThong: false, ngayTao: bayGio, ngayCapNhat: bayGio });
        DataService.saveData(data);
        PhanQuyenService.ghiNhatKy("Tạo vai trò", `Tạo vai trò "${ten}" (mã ${ma}, cấp bậc ${capBac})`);
        CoreService.closeModal();
        CoreService.showToast("Đã thêm vai trò [" + ten + "].", "success");
        this.vaiTroChon = ma;
        this.render();
      },

      // [THÊM MỚI 28/08/2026] Nhân bản 1 vai trò: tạo vai trò mới CÙNG cấp bậc + COPY nguyên bảng quyền,
      // để tạo nhanh vai trò gần giống mà không phải tick lại từ đầu. Tên thêm "(bản sao)", admin đổi lại.
      nhanBanVaiTro(ma) {
        const goc = PhanQuyenService.timVaiTro(ma);
        if (!goc) return;
        const data = DataService.getData();
        data.vaiTro = (data.vaiTro && data.vaiTro.length) ? data.vaiTro : JSON.parse(JSON.stringify(VAI_TRO_MAC_DINH));
        // Sinh mã mới không trùng, dựa trên mã gốc + "_copy".
        let gocMa = ma + "_copy", maMoi = gocMa, k = 2; const daCo = new Set(data.vaiTro.map(v => v.ma));
        while (daCo.has(maMoi)) { maMoi = gocMa + "_" + k; k++; }
        const bayGio = new Date().toISOString();
        data.vaiTro.push({ ma: maMoi, ten: goc.ten + " (bản sao)", capBac: goc.capBac, heThong: false, ngayTao: bayGio, ngayCapNhat: bayGio });
        // Copy bảng quyền: lấy quyền HIỆN TẠI của vai trò gốc cho MỌI vùng (kể cả đang dùng mặc định).
        data.maTranQuyen = data.maTranQuyen || {};
        data.maTranQuyen[maMoi] = {};
        DS_VUNG.forEach(v => {
          const q = PhanQuyenService.oQuyen(ma, v.id);
          data.maTranQuyen[maMoi][v.id] = JSON.parse(JSON.stringify(q));
        });
        DataService.saveData(data);
        PhanQuyenService.ghiNhatKy("Nhân bản vai trò", `Nhân bản "${goc.ten}" → "${goc.ten} (bản sao)" (mã ${maMoi})`);
        CoreService.showToast("Đã nhân bản thành [" + goc.ten + " (bản sao)]. Hãy đổi tên lại cho đúng.", "success");
        this.vaiTroChon = maMoi;
        this.render();
      },

      suaVaiTro(ma) {
        const v = PhanQuyenService.timVaiTro(ma);
        if (!v) return;
        const bodyHtml = `
          <form>
            <div class="form-group"><label class="form-label">Tên Vai Trò</label>
              <input type="text" id="inpTenVaiTro" class="form-control" value="${String(v.ten).replace(/"/g, "&quot;")}"></div>
            <div class="form-group"><label class="form-label">Cấp Bậc Nền ${v.heThong ? "(vai trò hệ thống — không đổi)" : ""}</label>
              <select id="inpCapBac" class="form-control" ${v.heThong ? "disabled" : ""}>
                ${["employee", "manager", "hr", "accountant", "director", "it_admin"].map(cb => `<option value="${cb}" ${v.capBac === cb ? "selected" : ""}>${cb}</option>`).join("")}
              </select></div>
          </form>`;
        CoreService.openModal("Sửa Vai Trò - " + v.ten, bodyHtml, [
          { text: "Hủy", class: "btn-secondary" },
          { text: "<i class='fa-solid fa-floppy-disk'></i> Lưu", class: "btn-primary", close: false, onClick: () => this.luuSuaVaiTro(ma) }
        ]);
      },

      luuSuaVaiTro(ma) {
        const ten = (document.getElementById("inpTenVaiTro").value || "").trim();
        if (!ten) { CoreService.showToast("Tên vai trò không được để trống!", "warning"); return; }
        const capBac = document.getElementById("inpCapBac").value;
        const data = DataService.getData();
        data.vaiTro = (data.vaiTro && data.vaiTro.length) ? data.vaiTro : JSON.parse(JSON.stringify(VAI_TRO_MAC_DINH));
        const v = data.vaiTro.find(x => x.ma === ma);
        if (v) { v.ten = ten; if (!v.heThong) v.capBac = capBac; v.ngayCapNhat = new Date().toISOString(); }  // [THÊM 28/08/2026] chạm ngày cập nhật
        DataService.saveData(data);
        PhanQuyenService.ghiNhatKy("Sửa vai trò", `Sửa vai trò "${ten}" (mã ${ma})`);
        CoreService.closeModal();
        CoreService.showToast("Đã cập nhật vai trò.", "success");
        this.render();
      },

      xoaVaiTro(ma) {
        const v = PhanQuyenService.timVaiTro(ma);
        if (!v || v.heThong) { CoreService.showToast("Không xóa được vai trò hệ thống.", "warning"); return; }
        const data = DataService.getData();
        const dangDung = (data.nhanVien || []).filter(n => n.role === ma).length;
        if (dangDung > 0) { CoreService.showToast("Còn " + dangDung + " tài khoản đang dùng vai trò này — hãy đổi họ sang vai trò khác trước.", "warning"); return; }
        CoreService.openModal("Xác nhận xóa", "<p>Xóa vai trò <strong>" + v.ten + "</strong>?</p>", [
          { text: "Hủy", class: "btn-secondary" },
          { text: "<i class='fa-solid fa-trash'></i> Xóa", class: "btn-danger", close: false, onClick: () => {
            const d = DataService.getData();
            d.vaiTro = (d.vaiTro || []).filter(x => x.ma !== ma);
            if (d.maTranQuyen) delete d.maTranQuyen[ma];
            DataService.saveData(d);
            PhanQuyenService.ghiNhatKy("Xóa vai trò", `Xóa vai trò "${v.ten}" (mã ${ma})`);
            CoreService.closeModal();
            CoreService.showToast("Đã xóa vai trò.", "success");
            if (this.vaiTroChon === ma) this.vaiTroChon = "";
            this.render();
          } }
        ]);
      }
    };

    // Đăng ký Service Worker PWA (Offline & Installable)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    /* =========================================================================
       [H] PWAInstall — NÚT CÀI APP RA MÀN HÌNH NGAY TRONG APP
       -------------------------------------------------------------------------
       [THÊM MỚI 26/08/2026] Trước đây app chỉ hiện HƯỚNG DẪN bằng chữ, bắt người
       dùng tự mò menu ba chấm của trình duyệt. Nhiều người không tìm ra.

       CÁCH HOẠT ĐỘNG (kể theo đường đi):
       Khi trang đủ điều kiện cài (có manifest, có service worker, chạy trên
       https), trình duyệt Chrome/Edge tự bắn ra một "lời mời cài". App bắt lấy
       lời mời đó và CẤT LẠI thay vì để trình duyệt tự hiện thanh nhắc.
       Người dùng bấm nút "Cài đặt ngay" -> app lấy lời mời đã cất ra dùng ->
       hộp thoại cài của hệ điều hành bật lên.

       ⚠️ LƯU Ý QUAN TRỌNG: iPhone và iPad KHÔNG có cơ chế lời mời này. Trên máy
       Apple bắt buộc làm tay: Safari > nút Chia sẻ > Thêm vào Màn hình chính.
       Vì vậy hộp thoại vẫn giữ nguyên phần hướng dẫn bằng chữ cho iPhone.

       Mỗi lời mời chỉ dùng được MỘT LẦN — dùng xong phải xoá đi, muốn cài lại
       phải tải lại trang.
       ========================================================================= */
    const PWAInstall = {
      loiMoiCai: null,     // lời mời cài do trình duyệt bắn ra, cất lại để dùng khi bấm nút

      /* App đang mở từ icon ngoài màn hình (đã cài) hay đang mở trong trình duyệt?
         Trả về true = đã cài rồi. */
      dangChayNhuApp() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
            || window.navigator.standalone === true;
      },

      /* Máy đang dùng có phải iPhone / iPad không.
         Cần biết vì máy Apple không có nút cài tự động, phải chỉ cách làm tay. */
      laMayApple() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      },

      /* Bấm nút "Cài đặt ngay" thì chạy hàm này. Không nhận gì, không trả gì. */
      async caiNgay() {
        if (!this.loiMoiCai) {
          CoreService.showToast('Trình duyệt chưa cho cài tự động. Vui lòng làm theo hướng dẫn bên dưới.', 'warning');
          return;
        }
        this.loiMoiCai.prompt();
        const chon = await this.loiMoiCai.userChoice;
        this.loiMoiCai = null;   // lời mời chỉ dùng được một lần
        if (chon && chon.outcome === 'accepted') {
          CoreService.showToast('Đang cài Auto HCNS V2 ra màn hình chính...', 'success');
          CoreService.closeModal();
        } else {
          CoreService.showToast('Bạn đã bỏ qua việc cài đặt.', 'info');
        }
      }
    };
    window.PWAInstall = PWAInstall;   // gắn ra ngoài để nút onclick trong HTML gọi được

    /* Trình duyệt bắn lời mời cài -> giữ lại, chặn thanh nhắc mặc định của trình duyệt
       để người dùng cài qua nút trong app cho thống nhất giao diện */
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      PWAInstall.loiMoiCai = e;
    });

    /* Cài xong thì báo cho người dùng biết */
    window.addEventListener('appinstalled', () => {
      PWAInstall.loiMoiCai = null;
      if (typeof CoreService !== 'undefined' && CoreService.showToast) {
        CoreService.showToast('Đã cài Auto HCNS V2 ra màn hình chính!', 'success');
      }
    });

    // Khởi chạy hệ thống ngay lập tức
    CoreService.init();
  </script>
</body>
</html>
