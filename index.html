       ========================================================================= */
    const LicenseService = {
      SECRET_KEY: "hcns_secret_key_cloud_v1",
      SALT: "AutoEcosystem-HWID-Salt-v1",
      // [SỬA 25/08/2026] Lấy tên ngăn lưu từ CONFIG. Chuỗi giữ nguyên
      // "hcns2_lic_cache" để máy đã kích hoạt bản quyền không bị mất.
      STORAGE_KEY: CONFIG.STORAGE_KEY_LICENSE,
      TTL: 24 * 3600 * 1000, // 24 giờ

      /* ===== [THÊM MỚI 28/08/2026] CẤU HÌNH KEY BẢN QUYỀN (nhà sản xuất chỉnh) =====
         Các con số dưới quyết định trải nghiệm khóa/mở — đọc kỹ trước khi đổi.
         VÌ SAO tách hằng số ra đây: sau này đổi 7→10 ngày, đổi URL… chỉ sửa 1 chỗ. */
      FREE_DAYS: 7,            // Dùng thử MIỄN PHÍ 7 ngày kể từ LẦN MỞ ĐẦU (tính theo máy, có ký)
      TRIAL_DEFAULT_DAYS: 30,  // Key dùng thử mặc định 30 ngày (server cấp từng key ghi hạn riêng)
      ENFORCE: true,           // true = BẬT khóa toàn app sau khi hết hạn. Đặt false để TẠM TẮT lúc phát triển.
      // URL + TOKEN máy chủ Apps Script.
      //   [ĐIỀN 28/08/2026] Đã deploy & test THẬT (ping/check/chống-dò-key đạt). Token phải KHỚP
      //   SHARED_SECRET trong file HCNS-V2-License-AppsScript.gs. Đổi deploy thì đổi lại URL ở đây.
      LICENSE_URL: "https://script.google.com/macros/s/AKfycbyUddI6R5qxKaclFuqOTaAz0HayqIUtPkpT01vBb2K3Stjaas1YTE07dXAoC_W1pTo6/exec",
      LICENSE_TOKEN: "bcc83a6bb6d56c1d2291b9606af4563eee0c9f64726514f0154aa374b786157a",
      // Mã BĂM của KEY NHÀ SẢN XUẤT — mở khóa cục bộ mọi lúc (cả offline). Chống tự khóa nhầm khi chưa có server.
      //   Chữ gốc mặc định: "HCNS-NSX-MASTER-2026" (nhà sản xuất GIỮ KÍN & ĐỔI được bằng nút trong app → lưu licMasterHash).
      //   Chỉ nhúng MÃ BĂM, không nhúng chữ gốc.
      MASTER_KEY_HASH: "6c74bd82ac78094cf0be73e3c22cea7ff42f1a373cb89ad038217ade8a9e45eb",
      FIRST_OPEN_KEY: "hcns_first_open_v1", // ngày mở đầu (có ký chống sửa tay)
      LAST_SEEN_KEY: "hcns_last_seen_v1",   // mốc giờ CAO NHẤT từng thấy (chống lùi đồng hồ)
      ROLLBACK_TOL: 24 * 3600 * 1000,       // dung sai lùi giờ 24h
      _serverTimeMs: 0,                      // giờ máy chủ ở lần kiểm gần nhất (0 = chưa hỏi được)

      async sha256(str) {
        try {
          const enc = new TextEncoder().encode(str);
          const buf = await crypto.subtle.digest("SHA-256", enc);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        } catch (e) {
          let h = 0;
          for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
          return "x" + Math.abs(h).toString(16).padStart(16, "0").repeat(4).slice(0, 64);
        }
      },

      async getHWID() {
        const rawHWID = (typeof window !== "undefined") && (window.__HCNS_HWID || (window.hcnsMayChu && window.hcnsMayChu.hwid));
        if (rawHWID) return await this.sha256(this.SALT + "|" + String(rawHWID));

        let localId = "";
        try { localId = localStorage.getItem("hcns1_may_id") || ""; } catch (e) {}
        if (!localId) {
          localId = "BR-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
          try { localStorage.setItem("hcns1_may_id", localId); } catch (e) {}
        }
        return await this.sha256(this.SALT + "|" + localId);
      },

      async signObject(obj) {
        const raw = [obj.hwid, obj.trangThai, obj.loai, obj.hanDung, obj.luc].join("|");
        return await this.sha256(this.SECRET_KEY + "|" + raw);
      },

      async saveCache(obj) {
        try {
          obj.luc = Date.now();
          obj.ky = await this.signObject(obj);
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(obj));
        } catch (e) {}
      },

      async loadCache() {
        try {
          const s = localStorage.getItem(this.STORAGE_KEY);
          if (!s) return null;
          const obj = JSON.parse(s);
          if (!obj || !obj.ky) return null;
          const expectedSig = await this.signObject(obj);
          if (expectedSig !== obj.ky) {
            localStorage.removeItem(this.STORAGE_KEY);
            return null;
          }
          return obj;
        } catch (e) { return null; }
      },

      // [THÊM MỚI 28/08/2026] GIỜ HIỆU LỰC (chống lùi đồng hồ): luôn = mốc CAO NHẤT từng thấy.
      //   Ai vặn lùi đồng hồ máy để "kéo dài" dùng thử cũng vô ích (ta lấy max, và ghi đè tăng dần).
      effectiveNowSync() {
        let last = 0;
        try { last = Number(localStorage.getItem(this.LAST_SEEN_KEY) || 0) || 0; } catch (e) {}
        const now = Math.max(Date.now(), this._serverTimeMs || 0, last);
        try { localStorage.setItem(this.LAST_SEEN_KEY, String(now)); } catch (e) {}
        return now;
      },

      // [THÊM MỚI 28/08/2026] Lấy/khởi tạo NGÀY MỞ ĐẦU (có ký theo HWID+SECRET → sửa tay là mất hiệu lực).
      //   Lần đầu chạy trên máy → ghi mốc hiện tại. Trả về mili-giây.
      async getFirstOpen() {
        try {
          const s = localStorage.getItem(this.FIRST_OPEN_KEY);
          if (s) {
            const o = JSON.parse(s);
            if (o && o.t) {
              const hw = await this.getHWID();
              const sig = await this.sha256(this.SECRET_KEY + "|fo|" + o.t + "|" + hw);
              if (o.k === sig) return Number(o.t); // chữ ký khớp → tin
            }
          }
        } catch (e) {}
        const t = this.effectiveNowSync();
        try {
          const hw = await this.getHWID();
          const k = await this.sha256(this.SECRET_KEY + "|fo|" + t + "|" + hw);
          localStorage.setItem(this.FIRST_OPEN_KEY, JSON.stringify({ t, k }));
        } catch (e) {}
        return t;
      },

      async getStatus() {
        const hwid = await this.getHWID();
        let lic = await this.loadCache();
        if (!lic || lic.hwid !== hwid) {
          lic = { hwid, trangThai: "Active", loai: "Free", hanDung: "", tenKhach: "", luc: Date.now() };
          await this.saveCache(lic);
        }
        const now = this.effectiveNowSync();
        const firstOpen = await this.getFirstOpen();

        // Hạn KEY (nếu đã kích hoạt key): tính số ngày còn lại theo GIỜ HIỆU LỰC.
        let conLai = "", keyExpired = false, keyDaysLeft = null;
        if (lic.hanDung) {
          const parts = String(lic.hanDung).split("/");
          if (parts.length === 3) {
            const expDate = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]), 23, 59, 59);
            if (!isNaN(expDate.getTime())) {
              const diffDays = Math.ceil((expDate.getTime() - now) / 86400000);
              keyDaysLeft = diffDays;
              if (diffDays > 3650) conLai = "vĩnh viễn";
              else if (diffDays >= 0) conLai = "còn " + diffDays + " ngày";
              else { conLai = "quá hạn " + (-diffDays) + " ngày"; keyExpired = true; }
            }
          }
        }

        // Số ngày DÙNG THỬ MIỄN PHÍ còn lại (7 ngày kể từ mở đầu).
        //   Kẹp elapsed ≥ 0: tránh trường hợp firstOpen chụp sau now vài mili-giây → hiệu âm → lệch +1 ngày.
        const elapsed = Math.max(0, now - firstOpen);
        const freeDaysLeft = Math.max(0, this.FREE_DAYS - Math.floor(elapsed / 86400000));

        // XÁC ĐỊNH TẦNG: blocked > expired(key) > paid > trial > free_expired > free.
        let tier;
        const coKey = (lic.loai === "Paid" || lic.loai === "Trial");
        if (lic.trangThai === "Blocked") tier = "blocked";
        else if (coKey && keyExpired) tier = "expired";
        else if (lic.loai === "Paid") tier = "paid";
        else if (lic.loai === "Trial") tier = "trial";
        else if (freeDaysLeft <= 0) tier = "free_expired";
        else tier = "free";

        const daTraPhi = (tier === "paid");

        // Nhãn hiển thị theo tầng.
        let chu = "Bản miễn phí", mau = "#0284c7", ico = "🆓";
        if (tier === "blocked") { chu = "Đã khóa (nhà sản xuất)"; mau = "#dc2626"; ico = "🔒"; }
        else if (tier === "expired") { chu = "Key đã hết hạn"; mau = "#dc2626"; ico = "⌛"; }
        else if (tier === "paid") { chu = "Đã kích hoạt bản quyền"; mau = "#16a34a"; ico = "⭐"; }
        else if (tier === "trial") { chu = "Đang dùng thử (có key)"; mau = "#d97706"; ico = "🎁"; }
        else if (tier === "free_expired") { chu = "Hết hạn dùng thử " + this.FREE_DAYS + " ngày"; mau = "#dc2626"; ico = "⛔"; }
        else { chu = "Dùng thử miễn phí (còn " + freeDaysLeft + " ngày)"; mau = "#0284c7"; ico = "🆓"; }

        return { ...lic, chu, mau, ico, conLai, daTraPhi, tier, freeDaysLeft, keyDaysLeft, firstOpen };
      },

      /* ===== [THÊM MỚI 28/08/2026] MÁY CHỦ BẢN QUYỀN (gọi Apps Script — khi đã có URL) ===== */
      // Hỏi máy chủ trạng thái theo HWID. Trả JSON, hoặc null nếu lỗi/timeout/chưa cấu hình (fail-open).
      async checkServer(extra) {
        if (!this.LICENSE_URL || !this.LICENSE_TOKEN) return null;
        try {
          const hwid = await this.getHWID();
          const q = new URLSearchParams(Object.assign({ action: "check", token: this.LICENSE_TOKEN, hwid, version: "2.0.0" }, extra || {}));
          const ctrl = new AbortController();
          const to = setTimeout(() => ctrl.abort(), 8000);
          const r = await fetch(this.LICENSE_URL + "?" + q.toString(), { method: "GET", signal: ctrl.signal });
          clearTimeout(to);
          return await r.json();
        } catch (e) { return null; }
      },

      // "Cập nhật trạng thái": hỏi server NGAY → ghi cache đã ký → áp khóa lại. silent=true khi gọi ở nền.
      async refreshStatus(silent) {
        if (!this.LICENSE_URL || !this.LICENSE_TOKEN) { if (!silent) CoreService.showToast("Chưa cấu hình máy chủ bản quyền (URL trống).", "warning"); return null; }
        const res = await this.checkServer();
        if (!res || res.ok === false) { if (!silent) CoreService.showToast("⚠️ Không kết nối được máy chủ bản quyền.", "warning"); return null; }
        const hwid = await this.getHWID();
        if (res.serverTime) { const t = Date.parse(res.serverTime); if (t) this._serverTimeMs = t; }
        // [SỬA 28/08/2026] KHỚP "hợp đồng" dữ liệu của file HCNS-V2-License-AppsScript.gs:
        //   - server dùng trường "status" (không phải "trangThai"); giá trị Blocked = khóa.
        //   - server "loai" là 'Paid' / 'TrialKey' / 'Free7' → quy về 'Paid' / 'Trial' / 'Free' cho client.
        //   - server "hanDung" trả dạng ISO → đổi sang dd/mm/yyyy đúng kiểu client lưu.
        //   - status 'NotFound' (máy chưa có trong danh sách) = khách Free → giữ Free, hạn cục bộ 7 ngày.
        const statusRaw = res.status || res.trangThai || "Active";
        const trangThai = (String(statusRaw) === "Blocked") ? "Blocked" : "Active";
        const loaiRaw = String(res.loai || "");
        let loai = "Free";
        if (/paid/i.test(loaiRaw)) loai = "Paid";
        else if (/trial/i.test(loaiRaw)) loai = "Trial";
        let hanDung = "";
        if (res.hanDung) { const d = new Date(res.hanDung); if (!isNaN(d.getTime())) { const p = n => ("0" + n).slice(-2); hanDung = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear(); } }
        await this.saveCache({ hwid, trangThai, loai, hanDung, tenKhach: res.tenKhach || "", luc: Date.now() });
        if (!silent) CoreService.showToast("✅ Đã cập nhật trạng thái bản quyền mới nhất.", "success");
        // [SỬA 28/08/2026] Chỉ áp cổng khóa (KHÔNG gọi enforce → tránh lặp vô tận gọi server).
        await this.applyGate();
        try { if (document.getElementById("tab-settings")) AppModules.settings.render(); } catch (e) {}
        return res;
      },

      /* ===== [THÊM MỚI 28/08/2026] KEY NHÀ SẢN XUẤT (mở khóa cục bộ, cả offline) ===== */
      async verifyMasterKey(typed) {
        if (!typed) return false;
        const hash = await this.sha256(this.SALT + "|master|" + String(typed).trim());
        const stored = (getCompanySettings().licMasterHash) || this.MASTER_KEY_HASH;
        return hash === stored;
      },
      async activateMaster() {

      },

      /* ===== [THÊM MỚI 28/08/2026] CỔNG KHÓA TOÀN MÀN HÌNH ===== */
      // [THÊM MỚI 28/08/2026] applyGate(): CHỈ tính tầng cục bộ + bung/gỡ cổng khóa.
      //   KHÔNG gọi server (tránh vòng lặp). Dùng lại sau mỗi lần refreshStatus.
      async applyGate() {

        if (this.LICENSE_URL && this.LICENSE_TOKEN) this.refreshStatus(true);

            </div>
            <div style="text-align:center;font-size:11px;color:var(--text-muted,#94a3b8);line-height:1.6">
              📞 Liên hệ cấp key: <strong>Trần Hoạch</strong><br>Zalo/SĐT: 0902.620.715 — 0936.390.715
            </div>
          </div>`;
      },
      _afterActivate() { try { if (document.getElementById("tab-settings")) AppModules.settings.render(); } catch (e) {} },

      // [SỬA 28/08/2026] Kích hoạt THẬT (bỏ kiểu "kiểm text tại chỗ" cũ — ai gõ *PAID* cũng lên Vĩnh viễn).
      //   Thứ tự: (1) Key NHÀ SẢN XUẤT → mở khóa cục bộ ngay (cả offline);
      //           (2) có URL server → gọi máy chủ xác thực key khách;
      //           (3) chưa có server → báo rõ, không tự chế key.
      async handleActivateClick(inputId) {
        const input = document.getElementById(inputId);
        const key = (input ? input.value : "").trim();
        if (!key) { CoreService.showToast("Vui lòng dán mã Key vào ô kích hoạt!", "warning"); return; }

        // (1) KEY NHÀ SẢN XUẤT — mở khóa cục bộ, không cần mạng.
        if (await this.verifyMasterKey(key)) {
          await this.activateMaster();
          if (input) input.value = "";
          CoreService.showToast("✅ Đã mở khóa bằng Key Nhà Sản Xuất.", "success");
          this.removeLockGate(); this._afterActivate();
          return;
        }

        // (2) CÓ MÁY CHỦ → xác thực key khách qua server (thật).
        if (this.LICENSE_URL && this.LICENSE_TOKEN) {
          CoreService.showToast("Đang xác thực key với máy chủ...", "info");
          const hwid = await this.getHWID();
          const isTrial = /trial/i.test(key) || inputId === "inpKeyTrial" || inputId === "gateKeyTrial";
          const q = new URLSearchParams({ action: isTrial ? "activateTrialKey" : "activatePaidKey", token: this.LICENSE_TOKEN, hwid, key });
          let res = null;
          try {
            const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
            const r = await fetch(this.LICENSE_URL + "?" + q.toString(), { method: "GET", signal: ctrl.signal });
            clearTimeout(to); res = await r.json();
          } catch (e) {}
          if (res && res.ok) {
            if (input) input.value = "";
            await this.refreshStatus(true);
            CoreService.showToast("✅ Kích hoạt thành công!", "success");
            this.removeLockGate(); this._afterActivate();
          } else {
            CoreService.showToast("❌ " + ((res && (res.msg || res.error)) || "Key không hợp lệ hoặc lỗi mạng — thử lại."), "danger");
          }
          return;
        }

        // (3) CHƯA CÓ MÁY CHỦ.
        CoreService.showToast("Máy chủ bản quyền chưa cấu hình. Dùng Key Nhà Sản Xuất, hoặc gửi Mã máy cho nhà sản xuất để lấy key.", "warning");
      },

      // [SỬA 28/08/2026] Xin key: có server → gửi yêu cầu (tạo dòng chờ trên Sheet); chưa có → copy Mã máy gửi thủ công.
      async requestTrialKey() {
        const hwid = await this.getHWID();
        if (this.LICENSE_URL && this.LICENSE_TOKEN) {
          const ten = getCompanySettings().companyName || "";
          const q = new URLSearchParams({ action: "requestKey", token: this.LICENSE_TOKEN, hwid, ten });
          try {
            const r = await fetch(this.LICENSE_URL + "?" + q.toString());
            const j = await r.json();
            CoreService.showToast((j && j.msg) || "Đã gửi yêu cầu xin key tới nhà sản xuất.", "success");
          } catch (e) {
            CoreService.showToast("Không gửi được yêu cầu (lỗi mạng). Hãy Copy mã máy gửi thủ công.", "warning");
          }
          return;
        }
        this.copyHWID();
        CoreService.showToast("Đã Copy MÃ MÁY. Gửi cho nhà sản xuất (Zalo/SĐT) để nhận key.", "info");
      },

      // [THÊM MỚI 28/08/2026] Nhà sản xuất ĐỔI key nhà sản xuất (lưu MÃ BĂM vào cài đặt, không lưu chữ gốc).
      async doiKeyNhaSanXuat() {
        const body = `
          <p class="text-muted" style="font-size:12.5px">Đặt lại "Key Nhà Sản Xuất" — chuỗi bí mật để anh tự mở khóa mọi máy (kể cả offline). Chỉ lưu MÃ BĂM, không lưu chữ gốc. Giữ kín.</p>
          <div class="form-group"><label class="form-label">Key nhà sản xuất MỚI (≥ 8 ký tự)</label><input type="text" id="inpNsxMoi" class="form-control"></div>
          <div class="form-group"><label class="form-label">Nhập lại</label><input type="text" id="inpNsxMoi2" class="form-control"></div>`;
        CoreService.openModal("Đổi Key Nhà Sản Xuất", body, [
          { text: "Hủy", class: "btn-secondary" },
          { text: "<i class='fa-solid fa-check'></i> Lưu", class: "btn-primary", close: false, onClick: async () => {
            const a = (document.getElementById("inpNsxMoi").value || "").trim();
            const b = (document.getElementById("inpNsxMoi2").value || "").trim();
            if (a.length < 8) { CoreService.showToast("Key phải từ 8 ký tự trở lên!", "warning"); return; }
            if (a !== b) { CoreService.showToast("Hai lần nhập chưa khớp!", "warning"); return; }
            const hash = await this.sha256(this.SALT + "|master|" + a);
            const st = getCompanySettings(); st.licMasterHash = hash;
            localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(st));
            CoreService.closeModal();
            CoreService.showToast("✅ Đã đổi Key Nhà Sản Xuất.", "success");
          } }
        ]);
      },

      async copyHWID() {
        const hwid = await this.getHWID();
        CoreService.copyToClipboard(hwid, "✅ Đã sao chép toàn bộ 64 ký tự mã máy HWID vào bộ nhớ tạm!");
      },

      exportBackupJson() {
        const data = DataService.getData();
        const settings = getCompanySettings();
        const fullBackup = {
          app: "Auto HCNS",
          version: "1.0",
          exportDate: new Date().toISOString(),
          settings,
          data
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Auto_HCNS_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        CoreService.showToast("Đã xuất file sao lưu JSON thành công!", "success");
      },

      importBackupJson(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.data) {
              DataService.saveData(parsed.data);
              if (parsed.settings) localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(parsed.settings));
              CoreService.showToast("✅ Đã khôi phục dữ liệu từ file JSON thành công!", "success");
              setTimeout(() => location.reload(), 1000);
            } else {
              CoreService.showToast("File JSON không hợp lệ hoặc thiếu cấu trúc data!", "danger");
            }
          } catch (err) {
            CoreService.showToast("Lỗi đọc file JSON: " + err.message, "danger");
          }
        };
        reader.readAsText(file);
      }
    };

    /* =========================================================================
       [D] DataService — KHO DỮ LIỆU (đọc / ghi localStorage)
       -------------------------------------------------------------------------
       Mọi module đều gọi DataService.getData() để lấy dữ liệu và saveData() để ghi.
       Không module nào được đụng thẳng vào localStorage — giữ đúng quy tắc này thì
       sau này chuyển sang máy chủ thật chỉ phải sửa DUY NHẤT trong DataService.
       
       13 bảng dữ liệu: nhanVien, tinTuc, donTu, ordersVPP, danhMucCongViec, congViec,

       initDefaultData() chỉ nạp dữ liệu mẫu khi máy CHƯA có dữ liệu (lần chạy đầu).
       ========================================================================= */
    /* =========================================================================
       [G] tinhLuongThang() — HÀM TÍNH LƯƠNG DUY NHẤT CỦA TOÀN APP
       -------------------------------------------------------------------------
       [THÊM MỚI 25/08/2026] Trước đây công thức lương bị chép ở 3 nơi và
       KHÔNG khớp nhau: bảng lương dùng tỷ lệ BHXH cứng 10,5%, phiếu lương lại
       lấy tỷ lệ từ Cài đặt -> đổi tỷ lệ trong Cài đặt thì hai chỗ ra hai số.
       Nay cả 3 nơi gọi chung hàm này, sửa công thức chỉ còn sửa MỘT chỗ.

       Nhận vào : nv (một nhân viên), data (toàn bộ dữ liệu), settings (cài đặt)
       Trả ra   : một đối tượng chứa đủ các thành phần lương

       CÁCH TÍNH (ví dụ nhân viên lương cơ bản 12.000.000 đ, công chuẩn 22):
         - Lương theo công = 12.000.000 / 22 x 22          = 12.000.000 đ
         - Phụ cấp                                          =  1.500.000 đ
         - Lương tăng ca (tạm tính cố định)                 =    600.000 đ
         - Thưởng KPI = 12.000.000 x 15% x hệ số            =  1.800.000 đ
             hệ số = 1,0 nếu hoàn thành từ 80% việc trở lên; dưới đó là 0,7
         - Trừ BHXH,BHYT,BHTN = 12.000.000 x 10,5%          = -1.260.000 đ
         -------------------------------------------------------------------
         => Thực lĩnh                                       = 14.640.000 đ

       ⚠️ CHƯA SỬA (chờ anh quyết, vì đụng vào là ĐỔI SỐ TIỀN thật):
         1) Số công đang lấy bằng ĐÚNG công chuẩn, tức mặc định ai cũng đi đủ
            công. Muốn tính theo công thực tế thì phải đếm từ bảng bangCong —
            khi đó lương nhiều người sẽ GIẢM so với bảng đang chạy.
         2) Lương tăng ca đang là một số cố định cho tất cả mọi người, chưa
            nhân theo số giờ OT thực tế trong bảng chấm công.
       ========================================================================= */
    /* -------------------------------------------------------------------------
       BẬC PHỤ CẤP THÂM NIÊN — chép đúng quy tắc ghi trên bảng lương của công ty
       (cột "THÂM NIÊN" trong file bảng lương tháng).
       Đủ bao nhiêu năm làm việc thì được bấy nhiêu tiền mỗi tháng.
       Dưới 2 năm chưa được hưởng.
       ------------------------------------------------------------------------- */
    const BAC_THAM_NIEN = [
      { tuNam: 7, tien: 400000 },   // từ 7 năm trở lên
      { tuNam: 6, tien: 300000 },   // 6 - 7 năm
      { tuNam: 5, tien: 250000 },   // 5 - 6 năm
      { tuNam: 4, tien: 200000 },   // 4 - 5 năm
      { tuNam: 3, tien: 150000 },   // 3 - 4 năm
      { tuNam: 2, tien: 100000 }    // 2 - 3 năm
    ];

    /**
     * Tính phụ cấp thâm niên của một người theo ngày vào công ty.
     * Nhận vào : ngayVaoLam dạng "2020-01-01"
     * Trả ra   : số tiền mỗi tháng (đồng). Chưa đủ 2 năm thì trả 0.
     * Ví dụ    : vào làm 01/01/2020, tính tại 26/08/2026 -> 6,6 năm -> 300.000 đ
     */
    function tinhPhuCapThamNien(ngayVaoLam) {
      if (!ngayVaoLam) return 0;
      const d = new Date(ngayVaoLam);
      if (isNaN(d.getTime())) return 0;
      // 365,25 ngày/năm để tính cả năm nhuận
      const soNam = (new Date() - d) / (365.25 * 24 * 3600 * 1000);
      for (let i = 0; i < BAC_THAM_NIEN.length; i++) {
        if (soNam >= BAC_THAM_NIEN[i].tuNam) return BAC_THAM_NIEN[i].tien;
      }
      return 0;
    }

    /* =========================================================================
       [G] tinhLuongThang() — HÀM TÍNH LƯƠNG DUY NHẤT CỦA TOÀN APP
       -------------------------------------------------------------------------
       [SỬA 26/08/2026] Viết lại bám theo BẢNG LƯƠNG THẬT của công ty.

       CÔNG THỨC GỐC trên bảng lương (cột Z và cột AH):
         Tổng lương    = (Lương thoả thuận / Ngày công thoả thuận x Tổng ngày công)
                          x % lương + các phụ cấp + tiền làm thêm + cộng khác
         Tổng ngày công = Ngày làm việc thực tế + Nghỉ phép năm + Nghỉ lễ tết
         Tiền làm thêm  = Số giờ OT x Lương thoả thuận / Ngày công / 8 giờ x 150%
         Giảm trừ       = BHXH 10,5% + Công đoàn 0,5% + ăn ca + phạt + ứng lương + thuế
         Thực lĩnh      = LÀM TRÒN LÊN (Tổng lương - Tổng giảm trừ)

       BA THỨ ĐÃ SỬA CHO ĐÚNG THỰC TẾ:
         1. Số công: trước cứng bằng 22 (ai cũng đi đủ công). Nay ĐẾM THẬT từ
            bảng chấm công, cộng thêm ngày nghỉ phép năm đã được duyệt.
         2. Lương tăng ca: trước cứng 600.000 đ cho tất cả mọi người. Nay tính
            theo SỐ GIỜ OT THẬT nhân 150% đơn giá giờ.
         3. Thêm phụ cấp thâm niên và khoản trừ kinh phí công đoàn 0,5% —
            hai khoản này có trên bảng lương thật nhưng app còn thiếu.

       CHƯA LÀM ĐƯỢC (app chưa có chỗ nhập những dữ liệu này):
         - % lương (người thử việc hưởng 85%...) — tạm coi mọi người là 100%
         - Tách phụ cấp trách nhiệm / chuyên cần (hai khoản này trên bảng thật
           bị trừ theo tỷ lệ ngày công nếu đi thiếu công) — app đang gộp chung
           vào một ô "phụ cấp" và KHÔNG trừ theo ngày công
         - Ngày nghỉ lễ tết, hỗ trợ ăn ca, tiền ăn ca bị trừ, phạt vi phạm,
           ứng lương, thuế TNCN — đều tạm tính bằng 0

       LƯU Ý: khoản "Thưởng KPI" là của riêng app này, bảng lương thật của công
       ty KHÔNG có khoản đó. Muốn khớp tuyệt đối thì phải bỏ — nhưng bỏ là đổi
       số tiền của mọi người nên chờ chủ app quyết.

       Nhận vào : nv (một nhân viên), data (toàn bộ dữ liệu), settings (cài đặt)
       Trả ra   : một đối tượng chứa đủ các thành phần lương
       ========================================================================= */
    function tinhLuongThang(nv, data, settings) {
      const st = settings || getCompanySettings();
      const kho = data || {};

      // ---- 1. NGÀY CÔNG ----
      // Công chuẩn = số ngày công thoả thuận trong tháng, lấy từ Cài đặt (mặc định 22)
      const congChuan = Number(st.congChuan) || 22;

      // Kỳ lương = tháng đang xét. Mặc định là tháng hiện tại của máy.
      // [SỬA 26/08/2026] Trước đây đếm TẤT CẢ ngày chấm công từ trước tới nay,
      // sang tháng sau sẽ cộng dồn cả tháng cũ -> lương sai. Nay lọc theo tháng.
      const kyLuong = (st && st.kyLuong) || (new Date().toISOString().slice(0, 7)); // dạng "2026-08"

      // Đếm số ngày THẬT SỰ có chấm công của người này TRONG THÁNG đó
      const banGhiCong = (kho.bangCong || [])
        .filter(b => b.maNV === nv.id && String(b.ngay || "").slice(0, 7) === kyLuong);
      let congDiLam = banGhiCong.length;

      // Chưa có dòng chấm công nào trong tháng (máy mới cài / chưa nhập bảng công)
      // -> tạm coi như đi đủ công chuẩn, để bảng lương không tụt về 0 một cách vô lý.
      const uocTinhCong = (congDiLam === 0);
      if (uocTinhCong) congDiLam = congChuan;

      // Có dữ liệu nhưng còn quá ít so với công chuẩn -> nhiều khả năng bảng chấm
      // công chưa nhập xong. VẪN TÍNH THEO SỐ THẬT (không tự ý cộng thêm cho ai),
      // nhưng bật cờ này để màn hình hiện lời cảnh báo cho người làm lương biết.
      const thieuDuLieuCong = !uocTinhCong && (congDiLam < congChuan * 0.5);

      // Ngày nghỉ phép năm ĐÃ ĐƯỢC DUYỆT cũng được tính là ngày công có lương
      const congPhep = (kho.donTu || [])
        .filter(d => d.maNV === nv.id && d.trangThai === "da_duyet" && /phep/i.test(d.loaiDon || ""))
        .reduce((tong, d) => tong + (Number(d.soNgay) || 0), 0);

      // Nghỉ lễ tết: app chưa có chỗ khai báo -> tạm để 0
      const congLe = 0;

      const congThucTe = congDiLam + congPhep + congLe;

      // ---- 2. LƯƠNG THEO NGÀY CÔNG ----
      // % lương: người thử việc có thể hưởng dưới 100%. App chưa có ô nhập nên mặc định 100%.
      const phanTramLuong = Number(nv.phanTramLuong) || 100;
      const luongNgay = nv.luongCoBan / congChuan;
      const luongCong = Math.round(luongNgay * congThucTe * (phanTramLuong / 100));

      // ---- 3. LƯƠNG LÀM THÊM GIỜ (OT) ----
      // Đơn giá 1 giờ = lương tháng / số ngày công chuẩn / 8 giờ. Làm thêm hưởng 150%.
      // Ví dụ: lương 12.000.000, công chuẩn 22, làm thêm 4 giờ
      //        -> 12.000.000 / 22 / 8 x 150% x 4 giờ = 409.091 đ
      const gioOT = banGhiCong.reduce((tong, b) => tong + (Number(b.gioOT) || 0), 0);
      const donGiaGio = nv.luongCoBan / congChuan / 8;
      const luongOT = Math.round(gioOT * donGiaGio * 1.5);

      // ---- 4. PHỤ CẤP THÂM NIÊN ----
      const thamNien = tinhPhuCapThamNien(nv.ngayVaoLam);

      // ---- 5. THƯỞNG KPI (khoản riêng của app, bảng lương thật không có) ----
      const nvTasks = (kho.congViec || []).filter(t => t.nguoiNhan === nv.id);
      const completedCount = nvTasks.filter(t => t.trangThai === "hoan_thanh" || t.tienDo >= 100).length;
      const kpiRate = nvTasks.length > 0 ? (completedCount / nvTasks.length) : 0.8;
      const thuongKpi = Math.round(nv.luongCoBan * 0.15 * (kpiRate >= 0.8 ? 1.0 : 0.7));

      // ---- 6. CÁC KHOẢN TRỪ ----
      // Bảo hiểm phần người lao động đóng, tỷ lệ lấy từ Cài đặt (mặc định 10,5%)
      const bhxhRateRaw = Number(st.bhxhRate);
      const bhxhRate = isNaN(bhxhRateRaw) ? 10.5 : bhxhRateRaw;
      const bhxh = Math.round(nv.luongCoBan * (bhxhRate / 100));

      // Kinh phí công đoàn phần người lao động đóng (bảng lương thật ghi 0,5%)
      const congDoanRateRaw = Number(st.congDoanRate);
      const congDoanRate = isNaN(congDoanRateRaw) ? 0.5 : congDoanRateRaw;
      const congDoan = Math.round(nv.luongCoBan * (congDoanRate / 100));

      // ---- 7. CỘNG TRỪ RA THỰC LĨNH ----
      const tongLuong = luongCong + (Number(nv.phuCap) || 0) + thamNien + luongOT + thuongKpi;
      const tongGiamTru = bhxh + congDoan;
      // Bảng lương thật dùng LÀM TRÒN LÊN tới đồng (hàm ROUNDUP)
      const tongThucLinh = Math.ceil(tongLuong - tongGiamTru);

      return {
        congChuan, congDiLam, congPhep, congLe, congThucTe, uocTinhCong, thieuDuLieuCong, kyLuong,
        phanTramLuong, luongNgay, luongCong,
        gioOT, donGiaGio, luongOT, thamNien,
        nvTasks, completedCount, kpiRate, thuongKpi,
        bhxhRate, bhxh, congDoanRate, congDoan,
        tongLuong, tongGiamTru, tongThucLinh
      };
    }

    /* =========================================================================
       [H] tinhDiemKhoiLuong() — ĐO MỘT NGƯỜI LÀM ĐƯỢC NHIỀU HAY ÍT
       -------------------------------------------------------------------------
       [THÊM MỚI 26/08/2026] Chữa điểm yếu lớn nhất của cách chấm KPI cũ:
       cách cũ chỉ đo việc ĐƯỢC GIAO làm tốt tới đâu, nên người được giao 2 việc
       làm hoàn hảo BẰNG ĐIỂM người làm 20 việc. Nay đo thêm khối lượng.

       CÁCH ĐO: cộng "giờ dự kiến" của những việc người đó ĐÃ LÀM XONG, rồi so
       với quỹ giờ chuẩn của cả tháng.

           Quỹ giờ tháng   = Số ngày công chuẩn × 8 giờ
           Điểm khối lượng = Giờ đã làm xong ÷ Quỹ giờ tháng × 100

       VÍ DỤ SỐ THẬT: tháng có 22 ngày công chuẩn -> quỹ giờ = 22 × 8 = 176 giờ.
       Anh A làm xong các việc cộng lại 158 giờ dự kiến
       -> 158 ÷ 176 × 100 = 89,8 -> làm tròn 90 điểm khối lượng.

       ⚠️ CHẶN TRẦN 120 ĐIỂM: nếu không chặn, sẽ có người chạy đua nhận thật
       nhiều việc dễ để đẩy điểm lên vô hạn, trong khi chất lượng đi xuống.
       120 nghĩa là "làm vượt 20% quỹ giờ" — vượt nữa cũng chỉ tính tới đó.

       LƯU Ý: chỉ tính việc ĐÃ XONG (trạng thái hoàn thành, hoặc tiến độ 100%).
       Việc đang làm dở KHÔNG được tính giờ — tránh nhận việc rồi bỏ đó lấy điểm.

       Nhận vào : nv (một nhân viên), data (toàn bộ dữ liệu), settings (cài đặt)
       Trả ra   : { gioDaLam, quyGioThang, soViecXong, diem }
       ========================================================================= */
    function tinhDiemKhoiLuong(nv, data, settings) {
      const st = settings || getCompanySettings();
      const kho = data || {};

      // Quỹ giờ của tháng: số ngày công chuẩn nhân 8 giờ một ngày
      const congChuan = Number(st.congChuan) || 22;
      const quyGioThang = congChuan * 8;

      // Chỉ lấy việc của người này VÀ đã làm xong. [SỬA 27/08/2026] Bỏ việc ĐÌNH CHỈ
      // (không tính khối lượng cho việc đã dừng, dù trước đó lỡ để tiến độ 100%).
      const viecDaXong = (kho.congViec || []).filter(t =>
        t.nguoiNhan === nv.id && t.trangThai !== "dinh_chi" && (t.trangThai === "hoan_thanh" || t.tienDo >= 100)
      );

      // Cộng giờ dự kiến của từng việc. Việc nào chưa khai giờ thì tạm tính 8 giờ
      // (bằng một ngày công) để không bị mất điểm oan.
      const gioDaLam = viecDaXong.reduce((tong, t) => tong + (Number(t.gioDuKien) || 8), 0);

      let diem = quyGioThang > 0 ? Math.round((gioDaLam / quyGioThang) * 100) : 0;
      if (diem > 120) diem = 120;   // chặn trần, xem lý do ở phần ghi chú trên

      return { gioDaLam, quyGioThang, soViecXong: viecDaXong.length, diem };
    }

      getData() {
        this.initDefaultData();
        try {
          let data = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY_DATA)) || {};
          // [SỬA 28/08/2026] Trước: "< 5 nhân viên → xóa + nạp lại mẫu" → làm MẤT dữ liệu công ty nhỏ
          //   (<5 người) và dữ liệu ĐỒNG BỘ kéo về (thường ít hơn 5). Nay chỉ nạp mẫu khi RỖNG HẲN.
          if (!data.nhanVien || data.nhanVien.length === 0) {
            localStorage.removeItem(CONFIG.STORAGE_KEY_DATA);
            this.initDefaultData();
            data = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY_DATA));
          }
          if (!data.tinTuc) data.tinTuc = [];
          if (!data.kpiData) data.kpiData = [];
          if (!data.baoHiem) data.baoHiem = [];
          if (!data.thueTNCN) data.thueTNCN = [];
          if (!data.bienBanHop) data.bienBanHop = [];
          if (!data.kaizen) data.kaizen = [];
          if (!data.gopY) data.gopY = [];
          // [THÊM MỚI 27/08/2026] Danh mục vật tư VPP: nếu dữ liệu cũ chưa có thì nạp từ danh sách mẫu
          // DANH_MUC_VPP (10 món cứng trong code) để không vỡ. HCNS sửa danh mục → saveData ghi đè, giữ luôn.
          if (!data.danhMucVPP) data.danhMucVPP = JSON.parse(JSON.stringify(DANH_MUC_VPP));
          // [THÊM MỚI 27/08/2026] Bộ vai trò + ma trận phân quyền (sửa được). Seed vai trò từ
          // danh sách mặc định; ma trận để rỗng — khi rỗng app tự dùng quyền mặc định theo cấp bậc.
          if (!data.vaiTro) data.vaiTro = JSON.parse(JSON.stringify(VAI_TRO_MAC_DINH));
          if (!data.maTranQuyen) data.maTranQuyen = {};
          return data;
        } catch (e) {
          return {};
        }
      },
      saveData(data) {
        localStorage.setItem(CONFIG.STORAGE_KEY_DATA, JSON.stringify(data));
        // [THÊM MỚI 28/08/2026] Nếu BẬT đồng bộ Sheet → đẩy lên server (gộp trễ). TẮT = y hệt như cũ.
        try { this.dayLenServer(data); } catch (e) {}
      },

      /* ===== [THÊM MỚI 28/08/2026] ĐỒNG BỘ GOOGLE SHEET (Giai đoạn 2 — dùng chung qua LINK) =====
         Nguyên tắc AN TOÀN: getData()/saveData() vẫn CHẠY ĐỒNG BỘ trên localStorage như cũ để
         KHÔNG phải sửa hàng trăm chỗ gọi. Việc nói chuyện với Google Sheet làm Ở NỀN (async):
           - keoTuServer(): lúc mở app, kéo dữ liệu chung về ghi đè localStorage (mô hình "vẽ đè").
           - dayLenServer(): sau khi lưu, đẩy khối dữ liệu lên server (gộp trễ 2s cho đỡ dồn).
         TẮT (sheetSyncBat=false) → hai hàm này KHÔNG làm gì → app y hệt bản cũ.
         ⚠️ HẠN CHẾ (nói thật): bản này đẩy CẢ khối dữ liệu 1 lần → nhiều người lưu cùng lúc thì
            người sau đè người trước. Hợp giai đoạn đầu; đông người ghi dồn cần nâng "ghi từng bản ghi". */
      syncBat() {
        const s = getCompanySettings();
        return !!(s.sheetSyncBat && s.gasUrl);
      },
      /* ---- VÉ PHIÊN (session) — server cấp lúc đăng nhập; lưu localStorage để giữ qua tải lại trang.
         Nhân viên trên web dùng VÉ PHIÊN để đọc/ghi (không mang token). Admin cục bộ có thể dùng token. */
      layVePhien() { try { return localStorage.getItem("hcns_session") || ""; } catch (e) { return ""; } },
      luuVePhien(v) { try { localStorage.setItem("hcns_session", v || ""); } catch (e) {} },
      xoaVePhien() { try { localStorage.removeItem("hcns_session"); } catch (e) {} },
      // Chuỗi xác thực gắn vào GET (ưu tiên token của admin, rồi vé phiên của nhân viên).
      _authQS() {
        const s = getCompanySettings(); let qs = "";
        if (s.sheetToken) qs += "&token=" + encodeURIComponent(s.sheetToken);
        const v = this.layVePhien(); if (v) qs += "&session=" + encodeURIComponent(v);
        return qs;
      },
      _authPayload() {
        const s = getCompanySettings();
        return { token: s.sheetToken || "", session: this.layVePhien() || "" };
      },

      // Kéo dữ liệu chung từ server → ghi đè localStorage. Cần url + (token HOẶC vé phiên). Fail-open.
      async keoTuServer() {
        const s = getCompanySettings();
        if (!s.gasUrl || (!s.sheetToken && !this.layVePhien())) return { ok: false, err: "chưa đăng nhập / chưa cấu hình" };
        try {
          const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 10000);
          const r = await fetch(s.gasUrl + "?api=getData" + this._authQS(), { signal: ctrl.signal });
          clearTimeout(to);
          const j = await r.json();
          if (j && j.status === "success" && j.data && Array.isArray(j.data.nhanVien) && j.data.nhanVien.length) {
            localStorage.setItem(CONFIG.STORAGE_KEY_DATA, JSON.stringify(j.data));
            return { ok: true };
          }
          // Vé phiên hết hạn → cờ hetPhien để nơi gọi bắt đăng nhập lại.
          if (j && /phiên|đăng nhập/i.test(j.error || "")) return { ok: false, err: j.error, hetPhien: true };
          return { ok: false, err: (j && j.error) || "server chưa có dữ liệu" };
        } catch (e) { return { ok: false, err: e.message }; }
      },
      // ĐẨY NGAY toàn bộ dữ liệu lên server (không gộp trễ) — admin bơm lần đầu / nút "Đẩy dữ liệu lên".
      async dayNgayLen() {
        const s = getCompanySettings();
        if (!s.gasUrl || (!s.sheetToken && !this.layVePhien())) return { ok: false, err: "chưa đăng nhập / chưa cấu hình" };
        try {
          const pl = Object.assign(this._authPayload(), { data: this.getData() });
          const r = await fetch(s.gasUrl, { method: "POST", body: JSON.stringify({ action: "saveData", payload: pl }) });
          const j = await r.json();
          return { ok: j && j.status === "success", err: (j && j.error) || "" };
        } catch (e) { return { ok: false, err: e.message }; }
      },
      _dayTimer: null,
      // Đẩy dữ liệu lên server — GỘP TRỄ 2 giây (nhiều lần lưu liên tiếp chỉ đẩy 1 lần cuối).
      dayLenServer(data) {
        const s = getCompanySettings();
        if (!s.sheetSyncBat || !s.gasUrl || (!s.sheetToken && !this.layVePhien())) return; // TẮT/thiếu điều kiện → bỏ qua
        const pl = Object.assign(this._authPayload(), { data: data });
        clearTimeout(this._dayTimer);
        this._dayTimer = setTimeout(function () {
          try {
            fetch(s.gasUrl, { method: "POST", body: JSON.stringify({ action: "saveData", payload: pl }) })
              .then(function (r) { return r.json(); }).then(function () {}).catch(function () {});
          } catch (e) {}
        }, 2000);
      }
    };

    /* CORE SERVICE */
    /* =========================================================================
       [E] CoreService — BỘ KHUNG ĐIỀU HÀNH APP
       -------------------------------------------------------------------------
       Lo phần chung của cả app, không thuộc riêng nghiệp vụ nào:
         - Đăng nhập / đăng xuất / nhớ phiên (init, handleLoginSubmit, quickLogin, logout)
         - Dựng thanh menu theo vai trò người đăng nhập (renderNavigationForRole)
         - Chuyển tab và đặt tiêu đề trang (switchTab)
         - Hộp thoại, thông báo nổi, đổi sáng/tối (openModal, showToast, toggleTheme)
         - Nhập / xuất Excel dùng chung (triggerImportExcel, exportToExcel)
       
       CẢNH BÁO: switchTab() hiện chỉ đổi tiêu đề theo vai trò, KHÔNG chặn quyền vào tab.
       Menu ẩn tab đi, nhưng gọi thẳng lệnh vẫn mở được — xem mục RỦI RO trong báo cáo.
       ========================================================================= */
    const CoreService = {
      currentUser: null,
      activeTab: "home",
      importActionType: null,

      init() {
        // [THÊM MỚI 28/08/2026] Áp CẤU HÌNH BẢN PHÁT HÀNH (bản GitHub cho nhân viên) NGAY ĐẦU TIÊN,
        //   trước khi mọi thứ đọc cài đặt → app biết đang ở chế độ dùng chung.
        this._apDungCauHinhPhatHanh();
        DataService.initDefaultData();
        this.apDungThemeDaLuu();   // [THÊM MỚI 27/08/2026] Nhớ chế độ sáng/tối lần trước
        // [THÊM MỚI 28/08/2026] Kiểm bản quyền & bung CỔNG KHÓA nếu hết 7 ngày / hết key / bị khóa từ xa.
        //   Async, chạy song song — cổng khóa là lớp phủ toàn màn hình (z-index cao) nên đè lên mọi màn.
        LicenseService.enforce();
        NotificationService.initTimer();
        const settings = getCompanySettings();
        const compEl = document.getElementById("loginCompanyName");
        if (compEl) compEl.textContent = settings.companyName;

        // [THÊM MỚI 28/08/2026] Nếu BẬT đồng bộ Google Sheet → KÉO dữ liệu chung về TRƯỚC khi cho
        //   đăng nhập (để mọi máy thấy đúng danh sách nhân viên thật, không phải dữ liệu mẫu/cũ).
        //   TẮT → chạy tiếp ngay như cũ. Lỗi mạng → vẫn chạy bằng dữ liệu đang có (fail-open).
        // Chỉ kéo TRƯỚC khi đăng nhập nếu ĐÃ có cách xác thực (token admin HOẶC vé phiên còn lưu từ
        //   lần trước). Nhân viên chưa đăng nhập (chưa có vé) → bỏ qua, để BƯỚC ĐĂNG NHẬP tự kéo.
        if (DataService.syncBat() && (getCompanySettings().sheetToken || DataService.layVePhien())) {
          const bao = this._baoTaiDuLieu(true);
          DataService.keoTuServer().then((kq) => {
            this._baoTaiDuLieu(false, bao);
            // Vé phiên hết hạn → xóa vé + phiên, bắt đăng nhập lại (không tự vào bằng dữ liệu cũ).
            if (kq.hetPhien) { DataService.xoaVePhien(); try { localStorage.removeItem(CONFIG.STORAGE_KEY_SESSION); } catch (e) {} this.showLoginScreen(); return; }
            if (!kq.ok) this.showToast("⚠️ Chưa tải được dữ liệu chung — đang dùng dữ liệu trên máy.", "warning");
            this._tiepTucKhoiDong();
          });
        } else {
          this._tiepTucKhoiDong();
        }
      },

      // [THÊM MỚI 28/08/2026] Phần khởi động SAU khi (nếu cần) đã kéo dữ liệu chung: khôi phục
      //   phiên đăng nhập cũ hoặc hiện màn đăng nhập. Tách ra để dùng chung cho 2 nhánh (bật/tắt đồng bộ).
      _tiepTucKhoiDong() {
        const savedUserId = localStorage.getItem(CONFIG.STORAGE_KEY_SESSION);
        if (savedUserId) {
          const data = DataService.getData();
          const u = (data.nhanVien || []).find(n => n.id === savedUserId);
          if (u && u.trangThai !== "dinh_chi") { this.loginAs(u); return; }
        }
        this.showLoginScreen();
      },

      // [THÊM MỚI 28/08/2026] Lớp phủ "Đang tải dữ liệu chung..." lúc khởi động (bật=true tạo, false=gỡ).
      _baoTaiDuLieu(bat, el) {
        if (bat) {
          const d = document.createElement("div");
          d.id = "boot-sync-overlay";
          d.setAttribute("style", "position:fixed;inset:0;z-index:99998;background:rgba(15,23,42,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;font-size:14px;");
          d.innerHTML = '<div style="width:40px;height:40px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite"></div><div>Đang tải dữ liệu chung từ Google Sheet...</div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
          document.body.appendChild(d);
          return d;
        } else {
          const x = el || document.getElementById("boot-sync-overlay");
          if (x) x.remove();
        }
      },

      showLoginScreen() {
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("appScreen").style.display = "none";
      },

      // [THÊM MỚI 28/08/2026] Áp CẤU HÌNH BẢN PHÁT HÀNH (bản GitHub) vào Cài đặt: bật đồng bộ + gasUrl.
      //   Bản web KHÔNG mang token → nhân viên đăng nhập qua server lấy VÉ PHIÊN. Bản cục bộ (config trống) → bỏ qua.
      _apDungCauHinhPhatHanh() {
        try {
          const c = (typeof CAU_HINH_PHAT_HANH !== "undefined") ? CAU_HINH_PHAT_HANH : null;
          if (c && c.batDongBo && c.gasUrl) {
            const st = getCompanySettings();
            st.gasUrl = c.gasUrl; st.sheetSyncBat = true; st.sheetToken = "";  // web: KHÔNG token
            localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(st));
            try { localStorage.setItem(CONFIG.GAS_ENDPOINT_KEY, c.gasUrl); } catch (e) {}
          }
        } catch (e) {}
      },

      // [THÊM MỚI 28/08/2026] Đăng nhập QUA SERVER (chế độ dùng chung, không token): gửi mã NV+PIN,
      //   nhận VÉ PHIÊN + hồ sơ, lưu vé, kéo dữ liệu chung về rồi vào app.
      async _dangNhapQuaServer(userInp, pinInp) {
        const st = getCompanySettings();
        this.showToast("Đang đăng nhập...", "info");
        let j = null;
        try {
          const r = await fetch(st.gasUrl, { method: "POST", body: JSON.stringify({ action: "login", payload: { maNV: userInp, pin: pinInp } }) });
          j = await r.json();
        } catch (e) { this.showToast("Lỗi mạng khi đăng nhập. Kiểm tra Internet.", "danger"); return; }
        if (!j || j.status !== "success" || !j.user) { this.showToast((j && j.error) || "Sai mã nhân viên hoặc mã PIN!", "danger"); return; }
        DataService.luuVePhien(j.session || "");
        // Có vé phiên → kéo toàn bộ dữ liệu chung về (để mọi module đọc như thường).
        const kq = await DataService.keoTuServer();
        if (!kq.ok) this.showToast("Đăng nhập OK nhưng chưa tải được dữ liệu chung (" + (kq.err || "") + ").", "warning");
        this.loginAs(j.user);
        this.showToast("Chào mừng " + (j.user.hoTen || "") + " đã đăng nhập!", "success");
      },

      resetDefaultData() {
        if (confirm("Khôi phục toàn bộ 5 tài khoản mẫu (Mã PIN: 123456) và xóa sạch cache cũ?")) {
          localStorage.removeItem(CONFIG.STORAGE_KEY_DATA);
          localStorage.removeItem(CONFIG.STORAGE_KEY_SESSION);
          DataService.initDefaultData();
          this.showToast("✅ Đã khôi phục dữ liệu mẫu thành công!", "success");
          setTimeout(() => location.reload(), 300);
        }
      },

      handleLoginSubmit(e) {
        e.preventDefault();
        const userInp = document.getElementById("loginUserInp").value.trim();
        const pinInp = document.getElementById("loginPinInp").value.trim();

        // [THÊM MỚI 28/08/2026] CHẾ ĐỘ DÙNG CHUNG (bản web nhân viên): có bật đồng bộ + gasUrl nhưng
        //   KHÔNG có token → đăng nhập QUA SERVER để lấy vé phiên. Admin (có token) / bản cục bộ → đăng nhập tại chỗ như cũ.
        const _st = getCompanySettings();
        if (_st.sheetSyncBat && _st.gasUrl && !_st.sheetToken) {
          this._dangNhapQuaServer(userInp, pinInp);
          return;
        }

        const data = DataService.getData();
        const user = data.nhanVien.find(n => (n.id.toLowerCase() === userInp.toLowerCase() || n.email.toLowerCase() === userInp.toLowerCase()));
        if (!user) {
          this.showToast("Mã nhân viên hoặc Email không tồn tại!", "danger");
          return;
        }
        if (user.trangThai === "dinh_chi") {
          this.showToast("Tài khoản này đã bị ĐÌNH CHỈ / THÔI VIỆC!", "danger");
          return;
        }
        if (user.pin !== pinInp) {
          this.showToast("Mã PIN không chính xác! Vui lòng thử lại.", "danger");
          return;
        }

        this.loginAs(user);
        this.showToast(`Chào mừng ${user.hoTen} đã đăng nhập!`, "success");
      },

         Giữ lại hàm để người phát triển thử nhanh qua công cụ F12, ví dụ:
             CoreService.quickLogin("NV004")
         Nếu thêm nút gọi hàm này vào giao diện là mở lại đúng lỗ bảo mật đã vá. */
      quickLogin(maNV) {
        const data = DataService.getData();
        const user = (data.nhanVien || []).find(n => n.id === maNV);
        if (user) {
          const userInp = document.getElementById("loginUserInp");
          const pinInp = document.getElementById("loginPinInp");
          if (userInp) userInp.value = user.id;
          if (pinInp) pinInp.value = user.pin || "123456";
          this.loginAs(user);
          this.showToast(`Đã đăng nhập: ${user.hoTen} (${user.chucVu})`, "info");
        } else {
          this.showToast(`Không tìm thấy tài khoản ${maNV}`, "danger");
        }
      },

      loginAs(user) {
        this.currentUser = user;
        localStorage.setItem(CONFIG.STORAGE_KEY_SESSION, user.id);
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appScreen").style.display = "flex";

        this.renderNavigationForRole();
        this.renderUserInfo();
        this.switchTab("home");
      },

      /* [THÊM MỚI 25/08/2026] ĐỔI MÃ PIN ĐĂNG NHẬP.
         Form "Đổi Mã PIN" ở tab Cài Đặt vẫn gọi hàm này từ trước, nhưng hàm
         CHƯA BAO GIỜ ĐƯỢC VIẾT -> bấm Lưu thì im lặng, người dùng tưởng đã
         đổi PIN nhưng PIN cũ vẫn dùng được. Nay viết bổ sung.

         Đọc 3 ô: PIN cũ, PIN mới, nhập lại PIN mới. Kiểm tra xong thì ghi
         PIN mới vào hồ sơ nhân viên và lưu xuống bộ nhớ máy. */
      handleChangePin() {
        const oldPin = (document.getElementById("cfgOldPinInp") || {}).value || "";
        const newPin = (document.getElementById("cfgNewPinInp") || {}).value || "";
        const confirmPin = (document.getElementById("cfgConfirmPinInp") || {}).value || "";
        const u = this.currentUser;
        if (!u) { this.showToast("Bạn chưa đăng nhập.", "danger"); return; }

        const data = DataService.getData();
        const idx = (data.nhanVien || []).findIndex(n => n.id === u.id);
        if (idx < 0) { this.showToast("Không tìm thấy hồ sơ nhân viên của bạn.", "danger"); return; }

        // 1. PIN cũ phải đúng
        if (String(data.nhanVien[idx].pin) !== String(oldPin).trim()) {
          this.showToast("Mã PIN hiện tại không đúng. Vui lòng nhập lại.", "danger");
          return;
        }
        // 2. PIN mới phải đúng 6 chữ số
        if (!/^\d{6}$/.test(String(newPin).trim())) {
          this.showToast("Mã PIN mới phải gồm đúng 6 chữ số (ví dụ: 246810).", "warning");
          return;
        }
        // 3. Hai lần nhập PIN mới phải giống nhau
        if (String(newPin).trim() !== String(confirmPin).trim()) {
          this.showToast("Hai lần nhập mã PIN mới chưa giống nhau.", "warning");
          return;
        }
        // 4. PIN mới không được trùng PIN cũ
        if (String(newPin).trim() === String(oldPin).trim()) {
          this.showToast("Mã PIN mới phải khác mã PIN hiện tại.", "warning");
          return;
        }

        data.nhanVien[idx].pin = String(newPin).trim();
        DataService.saveData(data);
        this.currentUser = data.nhanVien[idx];

        ["cfgOldPinInp", "cfgNewPinInp", "cfgConfirmPinInp"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        this.showToast("Đã đổi mã PIN thành công! Lần đăng nhập sau hãy dùng mã PIN mới.", "success");
      },

      logout() {
        localStorage.removeItem(CONFIG.STORAGE_KEY_SESSION);
        DataService.xoaVePhien();   // [THÊM MỚI 28/08/2026] Bỏ vé phiên server (chế độ dùng chung) khi đăng xuất.
        this.currentUser = null;
        this.showLoginScreen();
        this.showToast("Đã đăng xuất an toàn!", "info");
      },

        this.toggleMobileSidebar(false);

        document.querySelectorAll(".menu-item").forEach(item => {
          if (item.getAttribute("data-tab") === tabId) {
            item.classList.add("active");
            // Tự động mở nhóm chứa tab đang chọn nếu nhóm đó đang bị thu gọn
            const parentGroup = item.closest(".menu-group");
            if (parentGroup) parentGroup.classList.remove("collapsed");
          } else {
            item.classList.remove("active");
          }
        });

        document.querySelectorAll(".bottom-nav-item").forEach(item => {
          if (item.getAttribute("data-tab") === tabId) item.classList.add("active");
          else item.classList.remove("active");
        });

        document.querySelectorAll(".tab-content").forEach(content => {
          content.style.display = "none";
        });

      showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        if (!container) return;
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        const iconClass = type === "success" ? "fa-circle-check" : type === "danger" ? "fa-triangle-exclamation" : "fa-circle-info";
        toast.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      },

      openModal(title, bodyHtml, footerButtons = []) {
        const backdrop = document.getElementById("modalBackdrop");
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;
        const footerEl = document.getElementById("modalFooter");
        footerEl.innerHTML = "";

        footerButtons.forEach(btn => {
          const button = document.createElement("button");
          button.className = `btn ${btn.class || "btn-secondary"}`;
          button.innerHTML = btn.text;
          button.onclick = () => {
            if (btn.onClick) btn.onClick();
            if (btn.close !== false) CoreService.closeModal();
          };
          footerEl.appendChild(button);
        });

        backdrop.classList.add("show");
      },

      closeModal() {
        document.getElementById("modalBackdrop").classList.remove("show");
      },

      triggerImportExcel(actionType) {
        this.importActionType = actionType;
        const fileInp = document.getElementById("hiddenExcelInput");
        fileInp.value = "";
        fileInp.click();
      },

      handleExcelFileSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet);

            if (this.importActionType === "employees") {
              AppModules.employees.processImportEmployees(jsonRows);
            } else if (this.importActionType === "attendance") {
              AppModules.attendance.processImportAttendance(jsonRows);
            }
          } catch (err) {
            CoreService.showToast("Lỗi đọc file Excel: " + err.message, "danger");
          }
        };
        reader.readAsArrayBuffer(file);
      },

      exportToExcel(dataArray, filename, sheetName = "Sheet1") {
        if (!dataArray || dataArray.length === 0) {
          this.showToast("Không có dữ liệu để xuất Excel!", "warning");
          return;
        }
        const ws = XLSX.utils.json_to_sheet(dataArray);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        XLSX.writeFile(wb, `${filename}_${new Date().toISOString().split("T")[0]}.xlsx`);
        this.showToast(`Đã xuất file Excel thành công!`, "success");
      },

      copyToClipboard(text, successMessage = "Đã sao chép vào bộ nhớ tạm!") {
        navigator.clipboard.writeText(text).then(() => {
          CoreService.showToast(successMessage, "success");
        }).catch(() => {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          document.body.removeChild(area);
          CoreService.showToast(successMessage, "success");
        });
      }
    };

      employees: {

        render() {
          const container = document.getElementById("tab-employees");

          const u = CoreService.currentUser;

          // [SỬA 27/08/2026] Xét theo CẤP BẬC NỀN (capBac) để vai trò TÙY BIẾN (SX, Kho, QA, Bảo trì...)
          // — vốn có mã ≠ "employee" — KHÔNG lọt vào giao diện quản lý nhân sự (nơi có nút Sửa mở form
          // chứa LƯƠNG). Đây là chống lộ thu nhập.
          const capBac = (typeof PhanQuyenService !== "undefined") ? PhanQuyenService.capBacCua(role) : role;
          const isManager = role === "manager";
          const isHR = role === "hr";
          const isDirector = role === "director";
          const isITAdmin = role === "it_admin";

          // [SỬA 27/08/2026] CHẶN theo capBac: mọi vai trò cấp "nhân viên" (kể cả tùy biến) đều bị chặn
          // khỏi màn Quản Lý Nhân Sự. Trước đây chỉ chặn đúng chữ "employee" nên vai trò tùy biến lọt vào.
          if (capBac === "employee") {
            container.innerHTML = `<div class="card"><p class="text-muted">Bạn không có quyền truy cập tab Quản Lý Nhân Sự.</p></div>`;
            return;
          }

          let list = data.nhanVien || [];
          if (isManager) {
            // Trưởng phòng chỉ xem nhân sự thuộc phòng mình
            list = list.filter(n => n.phongBan === u.phongBan);
          }

          if (this.currentFilter === "dang_lam") {
            list = list.filter(n => n.trangThai !== "dinh_chi");
          } else if (this.currentFilter === "dinh_chi") {
            list = list.filter(n => n.trangThai === "dinh_chi");
          } else if (this.currentFilter === "sinh_nhat") {
            // [THÊM MỚI 27/08/2026] Tab Sinh Nhật: chỉ người ĐANG LÀM VIỆC + CÓ khai ngày sinh,
            // sắp xếp theo sinh nhật GẦN NHẤT sắp tới (còn ít ngày nhất lên đầu).
            list = list.filter(n => n.trangThai !== "dinh_chi" && n.ngaySinh)
                       .sort((a, b) => this._soNgayToiSinhNhat(a.ngaySinh) - this._soNgayToiSinhNhat(b.ngaySinh));
          }

          // [THÊM MỚI 27/08/2026] Cờ đang xem tab Sinh Nhật → hiện thêm 2 cột Ngày sinh + Sắp tới.
          const laSinhNhat = this.currentFilter === "sinh_nhat";
          // [SỬA 27/08/2026] CHỐNG LỘ LƯƠNG: cột lương + nút xem phiếu lương CHỈ HR + Giám đốc (theo
          // capBac). Trước đây có cả IT Admin (kỹ thuật) → thấy lương mọi người = lộ thông tin.
          const canViewSalary = capBac === "hr" || capBac === "director";

          container.innerHTML = `
            <!-- [SỬA 27/08/2026] ĐÃ BỎ khung hướng dẫn "Hướng Dẫn Quản Lý Hồ Sơ Nhân Sự" ở đây
                 theo yêu cầu chủ app (không cần). Chỉ bỏ ở tab Nhân Sự này, các tab khác giữ nguyên. -->
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-users"></i> ${isManager ? `Danh Sách Nhân Sự Bộ Phận (${u.phongBan})` : "Danh Sách Hồ Sơ Nhân Sự Toàn Công Ty"}</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  ${canViewSalary ? `
                    <button class="btn btn-sm btn-secondary" onclick="CoreService.triggerImportExcel('employees')">
                      <i class="fa-solid fa-file-import"></i> 📥 Nhập Excel
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="AppModules.employees.exportEmployeesExcel()">
                      <i class="fa-solid fa-file-export"></i> 📤 Xuất Excel
                    </button>
                  ` : ``}
                  <button class="btn btn-primary" onclick="AppModules.employees.openAddModal()">
                    <i class="fa-solid fa-user-plus"></i> + Thêm Nhân Viên Mới
                  </button>
                </div>
              </div>

              <div class="filter-bar">
                <button class="filter-btn ${this.currentFilter === "all" ? "active" : ""}" onclick="AppModules.employees.setFilter('all')">Tất Cả (${list.length})</button>
                <button class="filter-btn ${this.currentFilter === "dang_lam" ? "active" : ""}" onclick="AppModules.employees.setFilter('dang_lam')">🟢 Đang Làm Việc (${list.filter(n => n.trangThai !== "dinh_chi").length})</button>
                <button class="filter-btn ${this.currentFilter === "dinh_chi" ? "active" : ""}" onclick="AppModules.employees.setFilter('dinh_chi')">🔴 Đã Nghỉ / Đình Chỉ (${list.filter(n => n.trangThai === "dinh_chi").length})</button>
                <button class="filter-btn ${this.currentFilter === "sinh_nhat" ? "active" : ""}" onclick="AppModules.employees.setFilter('sinh_nhat')">🎂 Sinh Nhật</button>
              </div>

              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:44px">STT</th>
                      <th class="col-ma">Mã NV</th>
                      <th>Họ Và Tên</th>
                      <th>Phòng Ban</th>
                      <th>Chức Vụ</th>
                      <th style="text-align:center">Trạng Thái</th>
                      <th class="col-ngay">Ngày Vào</th>
                      ${laSinhNhat ? `<th class="col-ngay">🎂 Ngày Sinh</th><th>Sắp Tới</th>` : ``}
                      <th>Số Điện Thoại</th>
                      <th>Email</th>
                      <th class="col-action">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${list.map((nv, idx) => `
                      <tr style="${nv.trangThai === "dinh_chi" ? "opacity:0.6;background:#fef2f2" : ""}">

                        <td>${nv.chucVu}</td>
                        <td style="text-align:center">

                        </td>
                        <td class="col-ngay">${formatDateDisplay(nv.ngayVaoLam || "2023-01-01")}</td>
                        ${laSinhNhat ? this._oSinhNhat(nv) : ``}

                        <td><small class="text-muted">${nv.email || "—"}</small></td>
                        <td class="col-action">

                              <i class="fa-solid fa-receipt"></i>
                            </button>
                          ` : ``}
                          <button class="btn btn-sm btn-secondary" onclick="AppModules.employees.openEditModal('${nv.id}')" title="Sửa thông tin">
                            <i class="fa-solid fa-pen-to-square"></i>
                          </button>
                          <button class="btn btn-sm ${nv.trangThai === "dinh_chi" ? "btn-success" : "btn-danger"}" onclick="AppModules.employees.toggleStatus('${nv.id}')" title="${nv.trangThai === "dinh_chi" ? "Kích hoạt lại" : "Đình chỉ / Nghỉ việc"}">
                            <i class="fa-solid ${nv.trangThai === "dinh_chi" ? "fa-lock-open" : "fa-ban"}"></i>

        setFilter(f) {
          this.currentFilter = f;
          this.render();
        },
        // [THÊM MỚI 27/08/2026] Tính số NGÀY còn tới sinh nhật KẾ TIẾP (0 = sinh nhật hôm nay).
        //   Nhận: ngaySinh dạng "YYYY-MM-DD". Trả: số nguyên 0..366. Dùng để xếp tab Sinh Nhật.
        _soNgayToiSinhNhat(ngaySinh) {
          if (!ngaySinh) return 999;                       // không có ngày sinh -> đẩy xuống cuối
          const d = new Date(ngaySinh);
          if (isNaN(d)) return 999;
          const homNay = new Date(); homNay.setHours(0, 0, 0, 0);
          // Sinh nhật TRONG NĂM NAY (giữ nguyên ngày/tháng, đổi năm thành năm nay)
          let sn = new Date(homNay.getFullYear(), d.getMonth(), d.getDate()); sn.setHours(0, 0, 0, 0);
          // Nếu sinh nhật năm nay ĐÃ QUA -> tính sang năm sau
          if (sn < homNay) sn = new Date(homNay.getFullYear() + 1, d.getMonth(), d.getDate());
          // 1 ngày = 86.400.000 mili-giây; lấy khoảng cách chia ra rồi làm tròn
          return Math.round((sn - homNay) / 86400000);
        },
        // [THÊM MỚI 27/08/2026] Trả 2 ô <td> cho tab Sinh Nhật: ngày sinh + còn mấy ngày (có badge nếu gần).
        _oSinhNhat(nv) {
          const sn = this._soNgayToiSinhNhat(nv.ngaySinh);
          const ngay = nv.ngaySinh ? formatDateDisplay(nv.ngaySinh) : "—";
          let sapToi;
          if (sn === 0) sapToi = `<span class="badge badge-success">🎉 Hôm nay!</span>`;
          else if (sn <= 7) sapToi = `<span class="badge badge-info">Còn ${sn} ngày</span>`;
          else sapToi = `Còn ${sn} ngày`;
          return `<td class="col-ngay">${ngay}</td><td>${sapToi}</td>`;
        },
        openAddModal() {
          const bodyHtml = `

                    <option value="Kỹ Thuật Công Nghệ">Kỹ Thuật Công Nghệ</option>
                    <option value="Tài Chính Kế Toán">Tài Chính Kế Toán</option>
                    <option value="Kinh Doanh & Marketing">Kinh Doanh & Marketing</option>
                    <option value="Khối Sản Xuất - Vận Hành">Khối Sản Xuất - Vận Hành</option>
                  </select>

                  <input type="text" id="inpChucVuNV" class="form-control" placeholder="VD: Kỹ sư / Nhân viên">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Lương Cơ Bản (VNĐ)</label>
                  <input type="number" id="inpLuongCBNV" class="form-control" value="10000000" step="500000">
                </div>
                <div class="form-group">
                  <label class="form-label">Phụ Cấp (VNĐ)</label>
                  <input type="number" id="inpPhuCapNV" class="form-control" value="1500000" step="100000">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Email Đăng Nhập</label>
                  <input type="email" id="inpEmailNV" class="form-control" placeholder="email@company.com">
                </div>
                <div class="form-group">
                  <label class="form-label">Mã PIN Đăng Nhập</label>
                  <input type="text" id="inpPinNV" class="form-control" value="123456">
                </div>
              </div>
              <!-- [THÊM MỚI 27/08/2026] 3 trường hồ sơ mới: SĐT, Bằng cấp, Địa chỉ -->
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Số Điện Thoại</label>
                  <input type="text" id="inpSdtNV" class="form-control" placeholder="VD: 0901 234 567">
                </div>
                <div class="form-group">
                  <label class="form-label">Bằng Cấp / Trình Độ</label>
                  <input type="text" id="inpBangCapNV" class="form-control" list="dsBangCapAdd" placeholder="Chọn sẵn hoặc gõ, VD: Đại học CNTT">
                  ${bangCapDatalist("dsBangCapAdd")}
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Ngày Sinh</label>
                <input type="date" id="inpNgaySinhNV" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">Địa Chỉ</label>
                <input type="text" id="inpDiaChiNV" class="form-control" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh...">
              </div>
            </form>
          `;
          CoreService.openModal("Thêm Hồ Sơ Nhân Viên Mới", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            {
              text: "<i class='fa-solid fa-user-plus'></i> Lưu Hồ Sơ",
              class: "btn-primary",
              close: false,
              onClick: () => {
                const hoTen = document.getElementById("inpHoTenNV").value.trim();
                const maNV = document.getElementById("inpMaNV").value.trim();
                if (!hoTen || !maNV) { CoreService.showToast("Vui lòng điền đủ Mã NV và Họ tên!", "warning"); return; }
                const data = DataService.getData();
                data.nhanVien.push({
                  id: maNV,
                  hoTen,
                  phongBan: document.getElementById("inpPhongBanNV").value,
                  chucVu: document.getElementById("inpChucVuNV").value.trim() || "Nhân viên",
                  luongCoBan: parseFloat(document.getElementById("inpLuongCBNV").value) || 0,
                  phuCap: parseFloat(document.getElementById("inpPhuCapNV").value) || 0,
                  email: document.getElementById("inpEmailNV").value.trim() || `${maNV.toLowerCase()}@company.com`,
                  pin: document.getElementById("inpPinNV").value.trim() || "123456",
                  role: "employee",
                  phepNamCon: 12,
                  ngayVaoLam: new Date().toISOString().split("T")[0],
                  ngayTaoTK: new Date().toISOString(),   // [THÊM 28/08/2026] mốc tạo tài khoản (để hiện cột Ngày tạo)

            "Phòng Ban": n.phongBan,
            "Chức Vụ": n.chucVu,
            "Lương Cơ Bản": n.luongCoBan,
            "Phụ Cấp": n.phuCap,
            "Phép Năm Còn": n.phepNamCon,
            "Hợp Đồng": n.hopDong || "Chính thức",
            "Ngày Vào Làm": n.ngayVaoLam || "",
            "Trạng Thái": n.trangThai === "dinh_chi" ? "Đình chỉ / Đã nghỉ" : "Đang làm việc"
          }));
          CoreService.exportToExcel(exportRows, "Danh_Sach_Nhan_Su_HCNS", "NhanSu");

        processImportEmployees(rows) {
          if (!rows || rows.length === 0) { CoreService.showToast("File không có dữ liệu!", "warning"); return; }
          const data = DataService.getData();
          let count = 0;
          rows.forEach(r => {
            const maNV = r["Mã NV"] || r["MaNV"] || r["id"] || `NV${Date.now()}`;
            const hoTen = r["Họ và Tên"] || r["HoTen"] || r["hoTen"] || r["Tên"];
            if (hoTen) {
              const existIdx = data.nhanVien.findIndex(n => n.id === maNV);
              const obj = {
                id: String(maNV),
                hoTen: String(hoTen),
                phongBan: r["Phòng Ban"] || r["PhongBan"] || "Văn Phòng",
                chucVu: r["Chức Vụ"] || r["ChucVu"] || "Nhân viên",
                luongCoBan: parseFloat(r["Lương Cơ Bản"] || r["LuongCoBan"]) || 10000000,
                phuCap: parseFloat(r["Phụ Cấp"] || r["PhuCap"]) || 1500000,
                phepNamCon: parseFloat(r["Phép Năm Còn"] || r["PhepNam"]) || 12,
                email: `${String(maNV).toLowerCase()}@company.com`,
                pin: "123456",
                role: "employee",
                hopDong: "Chính thức",
                ngayVaoLam: new Date().toISOString().split("T")[0],
                trangThai: "dang_lam"
              };
              if (existIdx >= 0) data.nhanVien[existIdx] = obj;
              else data.nhanVien.push(obj);
              count++;
            }
          });
          DataService.saveData(data);
          CoreService.showToast(`Đã import thành công ${count} nhân sự từ Excel!`, "success");
          AppModules.employees.render();
        }
      },

      hoso: {

      self_attendance: {

        // [THÊM MỚI 27/08/2026] kiemTraMangCongTy(): hỏi IP công cộng hiện tại rồi so với
        // danh sách IP công ty admin đã khai; cập nhật badge #netStatusBadge và ghi kết quả
        // vào this.netTrangThai / this.netIP để lúc bấm Check-in dùng lại (khỏi hỏi IP 2 lần).
        //   Không nhận/không trả gì (cập nhật trực tiếp lên màn).
        // [SỬA 28/08/2026] Nay xác thực chấm công theo CÀI ĐẶT (chamCongCheDo): IP và/hoặc GPS.
        //   Cập nhật this.netTrangThai + this.netIP + this.netKhoangCach để lúc Check-in dùng lại.
        //   Trạng thái: matched (đạt) · unmatched (ngoài) · error (mất mạng khi cần IP) ·
        //               need_gps (cần bấm "Lấy vị trí GPS" mới xác thực được) · off (tắt/chưa cấu hình).
        async kiemTraMangCongTy() {
          const st = getCompanySettings();
          const cheDo = st.chamCongCheDo || "ip";
          // Có đủ dữ liệu để kiểm theo IP / theo GPS không?
          const coIP = !!(st.chamCongIPCty && String(st.chamCongIPCty).trim());
          // [SỬA 28/08/2026] Gộp mọi địa điểm (trụ sở + chi nhánh) — đạt bán kính BẤT KỲ nơi nào là được.
          const dsDD = dsDiaDiemChamCong(st);
          const coGPSCty = dsDD.length > 0;
          // Chế độ này CÓ dùng IP / CÓ dùng GPS không (và admin đã khai dữ liệu tương ứng chưa).
          const dungIP  = (cheDo === "ip"  || cheDo === "ip_hoac_gps" || cheDo === "ip_va_gps") && coIP;
          const dungGPS = (cheDo === "gps" || cheDo === "ip_hoac_gps" || cheDo === "ip_va_gps") && coGPSCty;

          // Tắt, hoặc chưa khai dữ liệu nào → không ràng buộc.
          if (cheDo === "off" || (!dungIP && !dungGPS)) {
            this.netTrangThai = "off"; this.netIP = ""; this.netKhoangCach = null;
            this._veBadgeMang("off"); return;
          }

          this._veBadgeMang("checking");

          // --- Kiểm phần IP (nếu chế độ cần) ---
          let ipOK = null;                    // null = không xét ; true/false = kết quả ; "error" = mất mạng
          if (dungIP) {
            try { const ip = await layIPCongCong(); this.netIP = ip; ipOK = ipCoTrongDanhSachCty(ip, st.chamCongIPCty); }
            catch (e) { this.netIP = ""; ipOK = "error"; }
          }

          // --- Kiểm phần GPS (nếu chế độ cần) ---
          let gpsOK = null;                   // null = không xét ; true/false ; "need" = chưa bắt tọa độ thiết bị
          let khoangCach = null;
          if (dungGPS) {
            if (this.currentGps) {
              // Tìm địa điểm GẦN nhất trong danh sách; đạt nếu đứng trong bán kính của địa điểm đó.
              const gLat = this.currentGps.latitude, gLng = this.currentGps.longitude;
              let gan = null;
              dsDD.forEach(function (d) {
                const kc = khoangCachMet(gLat, gLng, d.lat, d.lng);
                if (gan === null || kc < gan.kc) gan = { kc: kc, d: d };
              });
              khoangCach = gan ? gan.kc : null;
              gpsOK = gan ? (gan.kc <= gan.d.banKinh) : false;
              this.netTenDiaDiem = gan ? gan.d.ten : "";   // tên nơi gần nhất (để hiện badge)
            } else { gpsOK = "need"; }
          }
          this.netKhoangCach = khoangCach;

          // --- Kết hợp kết quả theo chế độ ---
          let tt;
          if (cheDo === "ip") {
            tt = (ipOK === "error") ? "error" : (ipOK === true ? "matched" : "unmatched");
          } else if (cheDo === "gps") {
            tt = (gpsOK === "need") ? "need_gps" : (gpsOK === true ? "matched" : "unmatched");
          } else if (cheDo === "ip_hoac_gps") {
            // Đạt 1 trong 2 là được. Nếu chưa đạt mà GPS chưa bắt → gợi ý bật GPS.
            if (ipOK === true || gpsOK === true) tt = "matched";
            else if (gpsOK === "need") tt = "need_gps";
            else if (ipOK === "error") tt = "error";
            else tt = "unmatched";
          } else { // ip_va_gps: phải đạt CẢ hai
            if (gpsOK === "need") tt = "need_gps";
            else if (ipOK === "error") tt = "error";
            else tt = (ipOK === true && gpsOK === true) ? "matched" : "unmatched";
          }
          this.netTrangThai = tt;
          this._veBadgeMang(tt);
        },

        // [SỬA 28/08/2026] Vẽ badge xác thực theo trạng thái + có kèm khoảng cách GPS nếu có.
        _veBadgeMang(trangThai) {
          const el = document.getElementById("netStatusBadge");
          if (!el) return;
          const st = getCompanySettings();
          const batBuoc = !!st.chamCongBatBuocMang;
          // Mô tả ngắn phần vị trí (IP + khoảng cách) để hiện kèm cho rõ.
          const moTaIP = this.netIP ? ("IP " + this.netIP) : "";
          const moTaKC = (this.netKhoangCach != null) ? ("cách " + (this.netTenDiaDiem || "công ty") + " ~" + this.netKhoangCach + "m") : "";
          const chiTiet = [moTaIP, moTaKC].filter(Boolean).join(" · ");
          let bg, border, color, icon, text;
          if (trangThai === "matched") {
            bg = "#ecfdf5"; border = "#a7f3d0"; color = "#047857";
            icon = "fa-circle-check"; text = "Đã xác thực đang ở công ty" + (chiTiet ? " (" + chiTiet + ")" : "");
          } else if (trangThai === "unmatched") {
            bg = "#fef2f2"; border = "#fecaca"; color = "#b91c1c"; icon = "fa-triangle-exclamation";
            text = "Không ở đúng vị trí công ty" + (chiTiet ? " (" + chiTiet + ")" : "")
                 + (batBuoc ? " — chưa thể chấm công Nhà Máy" : " — vẫn chấm được nhưng đánh dấu chưa xác thực");
          } else if (trangThai === "need_gps") {
            bg = "#eff6ff"; border = "#bfdbfe"; color = "#1d4ed8"; icon = "fa-location-crosshairs";
            text = "Bấm \"Lấy vị trí GPS\" ở dưới để xác thực đang ở công ty";
          } else if (trangThai === "error") {
            bg = "#fffbeb"; border = "#fde68a"; color = "#b45309"; icon = "fa-wifi";
            text = "Chưa kiểm được mạng (mất internet)" + (batBuoc ? " — cần có mạng để chấm công Nhà Máy" : "");
          } else if (trangThai === "off") {
            bg = "var(--bg-hover)"; border = "var(--border-light)"; color = "var(--text-muted)";
            icon = "fa-circle-info"; text = "Chưa bật xác thực vị trí chấm công (cấu hình trong Cài Đặt)";
          } else { // 'checking'
            bg = "var(--bg-hover)"; border = "var(--border-light)"; color = "var(--text-secondary)";
            icon = "fa-spinner fa-spin"; text = "Đang kiểm tra vị trí chấm công...";
          }
          el.style.background = bg; el.style.borderColor = border; el.style.color = color;
          el.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + text;
        },

        startLiveClock() {
          if (this.clockTimer) clearInterval(this.clockTimer);
          const update = () => {
            const now = new Date();
            const timeEl = document.getElementById("liveClockDisplay");
            const dateEl = document.getElementById("liveDateDisplay");
            if (timeEl) {
              timeEl.textContent = now.toLocaleTimeString("vi-VN", { hour12: false });
            }
            if (dateEl) {
              const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
              const dayName = days[now.getDay()];
              const day = String(now.getDate()).padStart(2, "0");
              const month = String(now.getMonth() + 1).padStart(2, "0");
              const year = now.getFullYear();
              dateEl.textContent = `${dayName}, ngày ${day}/${month}/${year}`;
            }
          };
          update();
          this.clockTimer = setInterval(update, 1000);
        },
