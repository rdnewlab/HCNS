      /* =========================================================================
         [NHÓM 2] MODULE "kpi" — ĐÁNH GIÁ & THEO DÕI KPI
         -------------------------------------------------------------------------
         Vẽ vào tab  : tab-kpi
         Bảng dữ liệu: kpiData, nhanVien
         Ai xem được : Nhân viên: KPI của mình. Quản lý / HCNS / GĐ: KPI cấp dưới
         Việc chính  :
           - Nhập mục tiêu, tỷ lệ đạt, điểm KPI, xếp loại A/B/C
           - Luồng duyệt: chờ duyệt -> đã duyệt (người duyệt được ghi lại)
         ========================================================================= */
      kpi: {
        render() {
          const container = document.getElementById("tab-kpi");
          const data = DataService.getData();
          const u = CoreService.currentUser;
          const isManagerOrAdmin = u.role === "manager" || u.role === "hr" || u.role === "director" || u.role === "it_admin";

          // [THÊM MỚI 28/08/2026] Tab KPI nay có 3 SUB-TAB: Bảng KRA (cũ, giữ nguyên) · Thống Kê Công Việc · Báo Cáo.
          if (!this.currentSub) this.currentSub = "kra";
          const _tabs = [["kra", "fa-chart-pie", "Bảng KPI (KRA)"], ["thong_ke", "fa-list-check", "Thống Kê Công Việc"], ["bao_cao", "fa-file-lines", "Báo Cáo Hoạt Động"]];
          const _nav = `<div style="display:inline-flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;background:var(--bg-surface);padding:4px;border-radius:10px;border:1px solid var(--border-color);box-shadow:var(--shadow-sm);">${_tabs.map(t => `<button class="btn btn-sm ${this.currentSub === t[0] ? "btn-primary" : "btn-secondary"}" style="${this.currentSub === t[0] ? "" : "background:transparent;border-color:transparent;color:var(--text-secondary);"}" onclick="AppModules.kpi.switchSub('${t[0]}')"><i class="fa-solid ${t[1]}"></i> ${t[2]}</button>`).join("")}</div>`;
          if (this.currentSub === "thong_ke") { container.innerHTML = _nav + this.renderThongKe(isManagerOrAdmin); return; }
          if (this.currentSub === "bao_cao") { container.innerHTML = _nav + this.renderBaoCao(isManagerOrAdmin); return; }

          const allKpi = data.kpiData || [];
          const displayKpi = isManagerOrAdmin ? allKpi : allKpi.filter(k => k.maNV === u.id);

          const avgScore = displayKpi.length ? (displayKpi.reduce((acc, cur) => acc + (cur.diemKPI || 0), 0) / displayKpi.length).toFixed(1) : "—";
          const avgRate = displayKpi.length ? (displayKpi.reduce((acc, cur) => acc + (cur.tyLeDat || 0), 0) / displayKpi.length).toFixed(0) : "—";

          container.innerHTML = _nav + `
            <div class="stats-grid">
              <div class="stat-card" style="border-left: 4px solid var(--primary-main);">
                <div class="stat-icon primary"><i class="fa-solid fa-chart-line"></i></div>
                <div class="stat-info">
                  <span class="stat-value">${avgScore} / 10</span>
                  <span class="stat-label">Điểm KPI Trung Bình</span>
                </div>
              </div>
              <div class="stat-card" style="border-left: 4px solid #16a34a;">
                <div class="stat-icon success"><i class="fa-solid fa-bullseye"></i></div>
                <div class="stat-info">
                  <span class="stat-value">${avgRate}%</span>
                  <span class="stat-label">Tỷ Lệ Đạt Mục Tiêu</span>
                </div>
              </div>
              <div class="stat-card" style="border-left: 4px solid #d97706;">
                <div class="stat-icon warning"><i class="fa-solid fa-medal"></i></div>
                <div class="stat-info">
                  <span class="stat-value">${displayKpi.filter(k => k.xepLoai === 'A').length}</span>
                  <span class="stat-label">Xếp Loại Xuất Sắc (Loại A)</span>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Bảng Đánh Giá KPI & Hiệu Suất Công Việc (Kỳ 08/2026)</div>
                <div style="display:flex; gap:8px;">
                  ${isManagerOrAdmin ? `
                    <button class="btn btn-sm btn-primary" onclick="AppModules.kpi.openCreateModal()">
                      <i class="fa-solid fa-plus"></i> Giao Chỉ Tiêu KPI
                    </button>
                  ` : ``}
                  <button class="btn btn-sm btn-secondary" onclick="CoreService.exportToExcel(DataService.getData().kpiData || [], 'Bang_Theo_Doi_KPI')">
                    <i class="fa-solid fa-file-excel"></i> Xuất Excel
                  </button>
                </div>
              </div>

              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th class="col-ma">Mã NV</th>
                      <th>Họ và Tên</th>
                      <th>Phòng Ban</th>
                      <th>Mục Tiêu Trọng Tâm (KRA)</th>
                      <th class="col-so">Tỷ Lệ Đạt</th>
                      <th class="col-so">Điểm KPI</th>
                      <th style="text-align:center">Xếp Loại</th>
                      <th style="text-align:center">Trạng Thái</th>
                      ${isManagerOrAdmin ? `<th class="col-action">Thao Tác</th>` : ``}
                    </tr>
                  </thead>
                  <tbody>
                    ${displayKpi.length === 0 ? `
                      <tr><td colspan="9" class="text-center text-muted" style="padding:20px;">Chưa có dữ liệu KPI kỳ này.</td></tr>
                    ` : displayKpi.map(k => `
                      <tr>
                        <td class="col-ma">${k.maNV}</td>
                        <td><strong>${k.hoTen}</strong></td>
                        <td>${k.phongBan}</td>
                        <td>${k.mucTieu}</td>
                        <td class="col-so">
                          <span style="font-weight:600; color:${k.tyLeDat >= 90 ? '#16a34a' : '#d97706'}">${k.tyLeDat}%</span>
                        </td>
                        <td class="col-so" style="font-weight:700; color:var(--primary-main);">${formatNumber(k.diemKPI, 1)}</td>
                        <td style="text-align:center">
                          <span class="badge ${k.xepLoai === 'A' ? 'badge-success' : k.xepLoai === 'B' ? 'badge-info' : 'badge-warning'}">
                            Loại ${k.xepLoai}
                          </span>
                        </td>
                        <td style="text-align:center">
                          <span class="badge ${k.trangThai === 'da_duyet' ? 'badge-success' : 'badge-warning'}">
                            ${k.trangThai === 'da_duyet' ? 'Đã Duyệt' : 'Chờ Duyệt'}
                          </span>
                        </td>
                        ${isManagerOrAdmin ? `
                          <td class="col-action">
                            <button class="btn btn-sm btn-secondary" onclick="AppModules.kpi.openEvaluateModal('${k.id}')" title="Chấm điểm & Duyệt KPI">
                              <i class="fa-solid fa-pen-to-square"></i> Đánh giá
                            </button>
                          </td>
                        ` : ``}
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        },

        // [THÊM MỚI 28/08/2026] Đổi sub-tab trong khu KPI.
        currentSub: "kra",
        switchSub(s) { this.currentSub = s; this.render(); },

        // [THÊM MỚI 28/08/2026] Tính thống kê công việc THEO NHÂN VIÊN từ dữ liệu việc thật (congViec).
        //   Trả về mảng {nv, tong, dangLam, choDuyet, traLai, hoanThanh, dinhChi, tyLeHoanThanh, diemTienDo, chatLuong}.
        //   diemTienDo = mức hoàn thành TB theo 5 GIAI ĐOẠN (có trọng số KPI) — việc đang làm cũng tính đúng %.
        _thongKeTheoNV(isManagerOrAdmin) {
          const data = DataService.getData();
          const u = CoreService.currentUser;
          const nvList = (data.nhanVien || []).filter(n => n.trangThai !== "dinh_chi");
          const dsNV = isManagerOrAdmin ? nvList : nvList.filter(n => n.id === u.id);
          const cong = data.congViec || [];
          return dsNV.map(nv => {
            const ts = cong.filter(c => c.nguoiNhan === nv.id);
            const active = ts.filter(c => c.trangThai !== "dinh_chi");     // việc còn hiệu lực (bỏ đình chỉ)
            const dinhChi = ts.length - active.length;
            const traLai = active.filter(c => c.trangThai === "tra_lai").length;
            const hoanThanh = active.filter(c => c.trangThai === "hoan_thanh").length;
            const choDuyet = active.filter(c => c.trangThai === "cho_nghiem_thu").length;
            const dangLam = Math.max(0, active.length - hoanThanh - choDuyet - traLai);
            const tyLeHoanThanh = active.length ? Math.round(hoanThanh / active.length * 100) : 0;
            // Điểm tiến độ: trung bình có trọng số của % giai đoạn từng việc (kể cả đang làm).
            let tuso = 0, tong = 0;
            active.forEach(c => { const w = c.trongSoKPI || 3; const pt = (timGiaiDoan(giaiDoanTuTask(c)) || {}).pt || (c.tienDo || 0); tuso += pt * w; tong += w; });
            const diemTienDo = tong ? Math.round(tuso / tong) : 0;
            // Điểm chất lượng TB: chỉ tính việc đã có điểm nghiệm thu.
            const daCham = active.filter(c => (c.diemDanhGia || 0) > 0);
            const chatLuong = daCham.length ? Math.round(daCham.reduce((a, c) => a + c.diemDanhGia, 0) / daCham.length) : null;
            return { nv, tong: active.length, dangLam, choDuyet, traLai, hoanThanh, dinhChi, tyLeHoanThanh, diemTienDo, chatLuong };
          });
        },

        // [THÊM MỚI 28/08/2026] SUB-TAB "Thống Kê Công Việc" — bảng theo nhân viên.
        renderThongKe(isManagerOrAdmin) {
          const rows = this._thongKeTheoNV(isManagerOrAdmin);
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-list-check"></i> Thống Kê Công Việc Theo Nhân Viên (tính từ việc thực tế)</div>
                <button class="btn btn-sm btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> In</button>
              </div>
              <div class="table-responsive">
                <table style="min-width:900px">
                  <thead><tr>
                    <th class="col-ma">Mã NV</th><th style="min-width:150px">Họ và tên</th>
                    <th style="text-align:center">Tổng việc</th>
                    <th style="text-align:center">Đang làm</th>
                    <th style="text-align:center">Chờ duyệt</th>
                    <th style="text-align:center">Trả lại</th>
                    <th style="text-align:center">Hoàn thành</th>
                    <th style="text-align:center">% hoàn thành</th>
                    <th style="text-align:center" title="Mức hoàn thành TB theo 5 giai đoạn, kể cả việc đang làm">Điểm tiến độ</th>
                    <th style="text-align:center">Chất lượng TB</th>
                  </tr></thead>
                  <tbody>
                    ${rows.length === 0 ? `<tr><td colspan="10" class="o-rong" style="text-align:center;padding:18px">Chưa có dữ liệu</td></tr>` : rows.map(r => `
                      <tr>
                        <td class="col-ma">${r.nv.id}</td>
                        <td><strong>${r.nv.hoTen}</strong><br><small class="text-muted">${r.nv.phongBan}</small></td>
                        <td class="col-so" style="text-align:center">${r.tong}</td>
                        <td class="col-so" style="text-align:center">${r.dangLam}</td>

        openCreateModal() {

                  <label class="form-label">Tỷ Lệ Đạt Mục Tiêu (%)</label>
                  <input type="number" id="kpiRateInp" class="form-control" value="90" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Điểm Đánh Giá (Thang 10)</label>
                  <input type="number" id="kpiScoreInp" class="form-control" value="9.0" step="0.1" min="0" max="10">
                </div>
              </div>
            </form>
          `;

          CoreService.openModal("Giao Chỉ Tiêu KPI Mới", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            {
              text: "<i class='fa-solid fa-check'></i> Lưu Chỉ Tiêu",
              class: "btn-primary",
              close: false,
              onClick: () => {
                const empId = document.getElementById("kpiEmpSelect").value;
                const emp = employees.find(e => e.id === empId);
                const mucTieu = document.getElementById("kpiTargetInp").value.trim();
                const tyLeDat = parseFloat(document.getElementById("kpiRateInp").value) || 0;
                const diemKPI = parseFloat(document.getElementById("kpiScoreInp").value) || 0;
                const xepLoai = diemKPI >= 9.0 ? "A" : diemKPI >= 7.5 ? "B" : diemKPI >= 6.0 ? "C" : "D";

                if (!mucTieu) { CoreService.showToast("Vui lòng nhập mục tiêu KPI!", "warning"); return; }

                data.kpiData = data.kpiData || [];
                const newId = "KPI" + String(data.kpiData.length + 1).padStart(2, "0");
                data.kpiData.push({
                  id: newId,
                  maNV: emp.id,
                  hoTen: emp.hoTen,
                  phongBan: emp.phongBan,
                  thang: "08/2026",
                  mucTieu,
                  tyLeDat,
                  diemKPI,
                  xepLoai,
                  trangThai: "cho_duyet",
                  nguoiDuyet: CoreService.currentUser.hoTen
                });

                DataService.saveData(data);
                CoreService.closeModal();
                CoreService.showToast("Đã giao chỉ tiêu KPI thành công!", "success");
                AppModules.kpi.render();
              }
            }
          ]);
        },
        openEvaluateModal(kpiId) {
          const data = DataService.getData();
          const item = (data.kpiData || []).find(k => k.id === kpiId);
          if (!item) return;

          const bodyHtml = `
            <form id="formEvalKPI" onsubmit="return false;">
              <div style="background:var(--bg-hover); padding:12px; border-radius:6px; margin-bottom:15px; font-size:13px;">
                <strong>Nhân sự:</strong> ${item.maNV} - ${item.hoTen} (${item.phongBan})<br>
                <strong>Mục tiêu:</strong> ${item.mucTieu}
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Tỷ Lệ Đạt Mục Tiêu (%)</label>
                  <input type="number" id="evalRateInp" class="form-control" value="${item.tyLeDat || 90}" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Điểm Đánh Giá (0 - 10)</label>
                  <input type="number" id="evalScoreInp" class="form-control" value="${item.diemKPI || 9.0}" step="0.1" min="0" max="10">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Xếp Loại Đánh Giá</label>
                <select id="evalGradeInp" class="form-control">
                  <option value="A" ${item.xepLoai === 'A' ? 'selected' : ''}>Loại A - Xuất sắc</option>
                  <option value="B" ${item.xepLoai === 'B' ? 'selected' : ''}>Loại B - Tốt</option>
                  <option value="C" ${item.xepLoai === 'C' ? 'selected' : ''}>Loại C - Đạt</option>
                  <option value="D" ${item.xepLoai === 'D' ? 'selected' : ''}>Loại D - Chưa đạt</option>
                </select>
              </div>
            </form>
          `;

          CoreService.openModal("Chấm Điểm & Phê Duyệt KPI", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            {
              text: "<i class='fa-solid fa-check'></i> Phê Duyệt KPI",
              class: "btn-primary",
              close: false,
              onClick: () => {
                item.tyLeDat = parseFloat(document.getElementById("evalRateInp").value) || 0;
                item.diemKPI = parseFloat(document.getElementById("evalScoreInp").value) || 0;
                item.xepLoai = document.getElementById("evalGradeInp").value;
                item.trangThai = "da_duyet";
                item.nguoiDuyet = CoreService.currentUser.hoTen;

                DataService.saveData(data);
                CoreService.closeModal();
                CoreService.showToast(`Đã duyệt KPI cho ${item.hoTen}!`, "success");
                AppModules.kpi.render();
              }
            }
          ]);
        }
      },

      meetings: {

          data.quyTrinhThongNhat = data.quyTrinhThongNhat || [];

                      <span id="setChamCongIPHint" style="font-size:11px;color:var(--text-muted);"></span>

                        <label class="form-label" style="font-size:11px;">Vĩ độ công ty (lat)</label>

                      </div>

                    </div>

                  <div style="margin-top:auto;text-align:right;">

                      <i class="fa-solid fa-floppy-disk"></i> 💾 Lưu Cấu Hình Doanh Nghiệp & Định Mức
                    </button>

        handleLogoUpload(e) {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 2 * 1024 * 1024) {
            CoreService.showToast("Kích thước file ảnh logo không được vượt quá 2MB!", "warning");
            return;
          }
          const reader = new FileReader();
          reader.onload = (evt) => {
            const base64 = evt.target.result;
            const settings = getCompanySettings();
            settings.logo = base64;
            localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(settings));
            CoreService.showToast("✅ Đã tải lên logo doanh nghiệp thành công!", "success");
            AppModules.settings.render();
          };
          reader.readAsDataURL(file);
        },

        clearLogo() {
          const settings = getCompanySettings();
          settings.logo = "";
          localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(settings));
          CoreService.showToast("Đã xóa logo công ty!", "info");
          AppModules.settings.render();
        },

        /* =========================================================================
           SUBTAB 6.3: CÀI ĐẶT THÔNG BÁO & NHẮC GIỜ (DESKTOP PUSH & CHIME)
           ========================================================================= */
        renderNotificationsTab() {
          const s = NotificationService.getSettings();
          const isPermitted = ("Notification" in window) && Notification.permission === "granted";

          return `
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: stretch;">

                      <div>
                        <div style="font-size:12px; font-weight:700; color:${isPermitted ? '#059669' : '#d97706'};">
                          ${isPermitted ? '✅ Đã Bật Quyền Thông Báo Trình Duyệt' : '⚠️ Chưa Cấp Quyền Thông Báo Trình Duyệt'}
                        </div>
                        <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">
                          ${isPermitted ? 'Ứng dụng có thể gửi popup ngay cả khi ẩn tab hoặc thu nhỏ' : 'Bấm nút bên dưới để trình duyệt cho phép hiện pop-up'}

                      ${!isPermitted ? `

          const chamCongBanKinh = document.getElementById("setChamCongBanKinh") ? (parseInt(document.getElementById("setChamCongBanKinh").value) || 200) : (oldSet.chamCongBanKinh || 200);
          const chamCongDiaDiem = document.getElementById("setChamCongDiaDiem") ? document.getElementById("setChamCongDiaDiem").value.trim() : oldSet.chamCongDiaDiem;
          // [THÊM MỚI 28/08/2026] Giờ làm việc chuẩn (ô type=time trả "HH:MM"); ô trống thì giữ giá trị cũ.
          const gioVaoChuan = (document.getElementById("setGioVaoChuan") && document.getElementById("setGioVaoChuan").value) ? document.getElementById("setGioVaoChuan").value : (oldSet.gioVaoChuan || "08:00");
          const gioRaChuan = (document.getElementById("setGioRaChuan") && document.getElementById("setGioRaChuan").value) ? document.getElementById("setGioRaChuan").value : (oldSet.gioRaChuan || "17:30");

          // [THÊM MỚI 27/08/2026] Đọc % 5 GIAI ĐOẠN KPI (nếu các ô đang có trên màn Cài đặt).
          // Chặn trong 0–100. Ô không hiện thì giữ giá trị cũ.
          let giaiDoanKPI = oldSet.giaiDoanKPI;
          if (document.getElementById("setGiaiDoan0")) {
            giaiDoanKPI = [0, 1, 2, 3, 4].map(i => {
              const v = parseInt(document.getElementById("setGiaiDoan" + i).value);
              return isNaN(v) ? [0, 10, 50, 80, 100][i] : Math.max(0, Math.min(100, v));
            });
          }
          // [SỬA 27/08/2026] GỘP lên cài đặt cũ thay vì ghi đè trắng. Trước đây ghi đè làm MẤT
          // mật khẩu quản trị (rbacMasterKeyHash) + tỷ trọng KPI mỗi lần lưu Cài đặt. Nay giữ hết.
          const newSettings = { ...oldSet, companyName, address, diaDanh, congChuan, bhxhRate, phone, email, directorName, hrManagerName, logo, gasUrl, chamCongIPCty, chamCongBatBuocMang, chamCongCheDo, chamCongLat, chamCongLng, chamCongBanKinh, chamCongDiaDiem, gioVaoChuan, gioRaChuan, giaiDoanKPI };

          if (gasUrl) localStorage.setItem(CONFIG.GAS_ENDPOINT_KEY, gasUrl);

        },

        // [THÊM MỚI 27/08/2026] Nút "Lấy IP hiện tại" ở Cài Đặt. Admin đứng tại công ty,
        // nối đúng wifi công ty rồi bấm → app hỏi IP công cộng và điền sẵn vào ô IP.
        // Vẫn phải bấm "Lưu" mới ghi lại. Lỗi mạng thì báo rõ, không làm gì hại.
        async layIPHienTai() {
          const hint = document.getElementById("setChamCongIPHint");
          const inp = document.getElementById("setChamCongIP");
          if (hint) hint.textContent = "⏳ Đang lấy IP...";
          try {
            const ip = await layIPCongCong();
            if (inp) {
              // Nếu ô đang trống thì điền IP; nếu đã có IP khác thì thêm vào sau dấu phẩy
              const cur = inp.value.trim();
              if (!cur) inp.value = ip;
              else if (!ipCoTrongDanhSachCty(ip, cur)) inp.value = cur + ", " + ip;
            }
            if (hint) hint.textContent = "✅ IP hiện tại: " + ip + " (nhớ bấm Lưu)";
          } catch (e) {
            if (hint) hint.textContent = "⚠️ Không lấy được IP — kiểm tra kết nối internet.";
          }
        },

        // [THÊM MỚI 28/08/2026] Nút "Lấy vị trí công ty hiện tại". Admin ĐỨNG TẠI công ty bấm →
        // app hỏi GPS thiết bị rồi điền sẵn Vĩ độ/Kinh độ vào 2 ô cài đặt. Vẫn phải bấm Lưu mới ghi.
        //   Không nhận/không trả gì; báo lỗi rõ nếu bị từ chối quyền hoặc quá thời gian.
        layViTriCongTy() {
          const hint = document.getElementById("setChamCongGpsHint");
          if (!navigator.geolocation) { if (hint) hint.textContent = "⚠️ Trình duyệt không hỗ trợ định vị."; return; }
          if (hint) hint.textContent = "⏳ Đang lấy vị trí...";
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              const iLat = document.getElementById("setChamCongLat"), iLng = document.getElementById("setChamCongLng");
              if (iLat) iLat.value = lat.toFixed(6);
              if (iLng) iLng.value = lng.toFixed(6);
              if (hint) hint.textContent = "✅ Đã lấy: " + lat.toFixed(6) + ", " + lng.toFixed(6) + " (sai số ±" + Math.round(pos.coords.accuracy) + "m — nhớ bấm Lưu)";
            },
            function (err) {
              let msg = "⚠️ Không lấy được vị trí.";
              if (err.code === 1) msg = "⚠️ Bạn đã từ chối quyền vị trí. Hãy bật lại trong cài đặt trình duyệt.";
              else if (err.code === 3) msg = "⚠️ Quá thời gian lấy vị trí — thử lại.";
              if (hint) hint.textContent = msg;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        },

        // [THÊM MỚI 28/08/2026] "Thêm vị trí hiện tại vào danh sách": lấy GPS thiết bị rồi CHÈN 1 DÒNG
        //   chi nhánh mới vào ô "Địa điểm khác" theo dạng "Tên | lat | lng | bán kính". Admin sửa lại
        //   tên/bán kính rồi bấm Lưu. Không nhận/không trả gì.
        themDiaDiemHienTai() {
          const hint = document.getElementById("setChamCongDiaDiemHint");
          if (!navigator.geolocation) { if (hint) hint.textContent = "⚠️ Trình duyệt không hỗ trợ định vị."; return; }
          if (hint) hint.textContent = "⏳ Đang lấy vị trí...";
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              const ta = document.getElementById("setChamCongDiaDiem");
              if (!ta) return;
              // Dòng mới: tên tạm "Chi nhánh mới" + tọa độ + bán kính mặc định 200m (admin sửa lại).
              const dong = "Chi nhánh mới | " + pos.coords.latitude.toFixed(6) + " | " + pos.coords.longitude.toFixed(6) + " | 200";
              ta.value = ta.value.trim() ? (ta.value.trim() + "\n" + dong) : dong;
              if (hint) hint.textContent = "✅ Đã thêm 1 dòng — sửa lại TÊN & bán kính rồi bấm Lưu.";
            },
            function (err) {
              let msg = "⚠️ Không lấy được vị trí.";
              if (err.code === 1) msg = "⚠️ Bạn đã từ chối quyền vị trí.";
              if (hint) hint.textContent = msg;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        },

        // [THÊM MỚI 28/08/2026] Đẩy TOÀN BỘ dữ liệu máy này lên server (admin làm 1 lần đầu để bơm dữ liệu thật).
        async dayDuLieuLen() {

        testSheetConnection() {
          const url = document.getElementById("guideGasUrlInp").value.trim();
          if (!url) { CoreService.showToast("Vui lòng nhập Link Web App Apps Script!", "warning"); return; }

          CoreService.showToast("Đang kiểm tra kết nối tới Google Sheet...", "info");
          fetch(url, {
            method: "POST",
            body: JSON.stringify({ action: "ping" })
          })
          .then(r => r.json())
          .then(res => {
            if (res.status === "success") {
              CoreService.showToast("✅ Kết nối tuyệt vời! " + res.message, "success");
              const settings = getCompanySettings();
              settings.gasUrl = url;
              localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(settings));
              localStorage.setItem(CONFIG.GAS_ENDPOINT_KEY, url);
            } else {
              CoreService.showToast("Lỗi: " + (res.error || "Không thể kết nối"), "danger");
            }
          })
          .catch(err => {
            CoreService.showToast("Không thể gửi request: Kiểm tra lại quyền Anyone trên Web App!", "danger");
          });
        },

        syncAllToSheet() {
          const url = (document.getElementById("guideGasUrlInp") ? document.getElementById("guideGasUrlInp").value.trim() : "") || getCompanySettings().gasUrl;
          if (!url) { CoreService.showToast("Vui lòng nhập Link Web App Apps Script trước khi đồng bộ!", "warning"); return; }

          const data = DataService.getData();
          CoreService.showToast("Đang đồng bộ dữ liệu lên Google Sheet...", "info");

          fetch(url, {
            method: "POST",
            body: JSON.stringify({ action: "syncData", payload: data })
          })
          .then(r => r.json())
          .then(res => {
            if (res.status === "success") {
              CoreService.showToast("✅ " + res.message, "success");
            } else {
              CoreService.showToast("Lỗi đồng bộ: " + (res.error || "Không rõ"), "danger");
            }
          })
          .catch(err => {
            CoreService.showToast("Lỗi kết nối khi đồng bộ: " + err.message, "danger");
          });
        },

          <form onsubmit="AppModules.rbac.xacThucMoKhoa(event)">
            <div class="form-group" style="text-align:left;">
              <label class="form-label"><i class="fa-solid fa-key"></i> ${daDatKhoa ? 'Nhập Mật Khẩu Quản Trị' : 'Đặt Mật Khẩu Quản Trị Mới'}</label>
              <input type="password" id="inpMasterKey" class="form-control" placeholder="${daDatKhoa ? 'Nhập mật khẩu quản trị' : 'Đặt mật khẩu, tối thiểu 6 ký tự'}" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; margin-top:15px; font-weight:bold;">
              <i class="fa-solid fa-unlock-keyhole"></i> Xác Thực & Mở Khóa Phân Quyền
            </button>
          </form>
          ${daDatKhoa ? `
            <!-- [THÊM MỚI 28/08/2026] Lối "Quên mật khẩu": chỉ hiện khi ĐÃ có mật khẩu (đang khoá).
                 Bấm → xác nhận → xoá mật khẩu cũ để đặt lại mật khẩu mới (xem hàm datLaiMatKhau). -->
            <div style="margin-top:14px;">
              <button type="button" style="background:transparent;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;cursor:pointer;" onclick="AppModules.rbac.datLaiMatKhau()">
                <i class="fa-solid fa-rotate-left"></i> Quên mật khẩu? Đặt lại
              </button>
            </div>` : ``}
        </div>`;
    };

    // Xử lý mở khóa; xong thì vẽ lại ĐÚNG tab đang mở (taikhoan hoặc matran).
    AppModules.rbac.xacThucMoKhoa = async function (event) {
      if (event) event.preventDefault();
      const o = document.getElementById("inpMasterKey");
      const matKhau = (o ? o.value : "").trim();
      const cauHinh = getCompanySettings();
      const daDatKhoa = !!cauHinh.rbacMasterKeyHash;
      // Trộn muối app trước khi băm (giống hệt cơ chế cũ để không lệch với mật khẩu đã đặt).
      const bam = await LicenseService.sha256(LicenseService.SALT + "|rbac|" + matKhau);
      if (!daDatKhoa) {
        if (matKhau.length < 6) { CoreService.showToast("Mật khẩu quản trị phải dài tối thiểu 6 ký tự.", "warning"); return; }
        cauHinh.rbacMasterKeyHash = bam;
        localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(cauHinh));
        AppModules.rbac.unlockedMasterPass = true;
        CoreService.showToast("Đã đặt mật khẩu quản trị. Hãy ghi nhớ, app không tra lại được!", "success");
      } else if (bam === cauHinh.rbacMasterKeyHash) {
        AppModules.rbac.unlockedMasterPass = true;
        CoreService.showToast("Xác thực thành công! Đã mở khóa khu vực Phân Quyền.", "success");
      } else { CoreService.showToast("Mật khẩu quản trị không đúng.", "danger"); return; }
      AppModules.rbac.veLai();
    };

    // [THÊM MỚI 28/08/2026] "Quên mật khẩu → Đặt lại": xoá mã băm mật khẩu quản trị khỏi Cài đặt
    // để màn khoá quay về chế độ "ĐẶT mật khẩu mới". Có hộp xác nhận vì đây là thao tác bảo mật.
    //   Nhận vào : không có. Trả ra : không; xoá xong vẽ lại màn khoá.
    // LƯU Ý: app chạy cục bộ (chưa có máy chủ) nên chỉ xoá được trên THIẾT BỊ NÀY; xoá xong ai mở
    //   khu Phân Quyền cũng bị hỏi ĐẶT mật khẩu mới → hãy đặt lại NGAY để bảo vệ.
    AppModules.rbac.datLaiMatKhau = function () {
      if (!getCompanySettings().rbacMasterKeyHash) { CoreService.showToast("Chưa có mật khẩu để đặt lại.", "info"); return; }
      if (!confirm("ĐẶT LẠI mật khẩu quản trị Phân Quyền?\n\nMật khẩu cũ sẽ bị xoá trên thiết bị NÀY. Lần mở khu Phân Quyền kế tiếp sẽ yêu cầu ĐẶT mật khẩu mới.\n\nChỉ làm khi bạn là người quản trị và đã quên mật khẩu.")) return;
      const cauHinh = getCompanySettings();
      delete cauHinh.rbacMasterKeyHash;                         // bỏ mã băm → coi như chưa đặt mật khẩu
      localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(cauHinh));
      AppModules.rbac.unlockedMasterPass = false;
      CoreService.showToast("Đã đặt lại. Hãy ĐẶT MẬT KHẨU MỚI để bảo vệ khu Phân Quyền.", "success");
      AppModules.rbac.veLai();
    };

    // [THÊM MỚI 28/08/2026] ĐỔI MẬT KHẨU QUẢN TRỊ (nhập mật khẩu cũ → đặt mật khẩu mới) — làm BÊN TRONG
    //   khu Phân Quyền (đã mở khóa). Khác với "Quên mật khẩu → Đặt lại" ở màn khóa (không cần mật khẩu cũ).
    AppModules.rbac.doiMatKhau = function () {
      if (!getCompanySettings().rbacMasterKeyHash) { CoreService.showToast("Chưa đặt mật khẩu — hãy đặt ở màn khóa trước.", "info"); return; }
      const bodyHtml = `
        <form onsubmit="return false;">
          <div class="form-group"><label class="form-label">Mật khẩu quản trị HIỆN TẠI</label>
            <input type="password" id="mkCu" class="form-control" placeholder="Nhập mật khẩu đang dùng"></div>
          <div class="form-group"><label class="form-label">Mật khẩu MỚI (tối thiểu 6 ký tự)</label>
            <input type="password" id="mkMoi" class="form-control" placeholder="Đặt mật khẩu mới"></div>
          <div class="form-group"><label class="form-label">Nhập lại mật khẩu MỚI</label>
            <input type="password" id="mkMoi2" class="form-control" placeholder="Gõ lại mật khẩu mới"></div>
        </form>`;
      CoreService.openModal("Đổi Mật Khẩu Quản Trị", bodyHtml, [
        { text: "Hủy", class: "btn-secondary" },
        { text: "<i class='fa-solid fa-floppy-disk'></i> Đổi mật khẩu", class: "btn-primary", close: false, onClick: () => AppModules.rbac._luuDoiMatKhau() }
      ]);
    };
    // Lưu đổi mật khẩu: kiểm mật khẩu cũ đúng → băm mật khẩu mới → ghi vào Cài đặt. (băm SHA-256 async)
    AppModules.rbac._luuDoiMatKhau = async function () {
      const cu = (document.getElementById("mkCu").value || "").trim();
      const moi = (document.getElementById("mkMoi").value || "").trim();
      const moi2 = (document.getElementById("mkMoi2").value || "").trim();
      if (moi.length < 6) { CoreService.showToast("Mật khẩu mới phải dài tối thiểu 6 ký tự.", "warning"); return; }
      if (moi !== moi2) { CoreService.showToast("Hai ô mật khẩu mới không khớp.", "warning"); return; }
      const cauHinh = getCompanySettings();
      const bamCu = await LicenseService.sha256(LicenseService.SALT + "|rbac|" + cu);
      if (bamCu !== cauHinh.rbacMasterKeyHash) { CoreService.showToast("Mật khẩu hiện tại không đúng.", "danger"); return; }
      cauHinh.rbacMasterKeyHash = await LicenseService.sha256(LicenseService.SALT + "|rbac|" + moi);
      localStorage.setItem(CONFIG.STORAGE_KEY_SETTINGS, JSON.stringify(cauHinh));
      CoreService.closeModal();
      CoreService.showToast("Đã đổi mật khẩu quản trị. Hãy ghi nhớ mật khẩu mới!", "success");
    };

    // Khóa lại + vẽ lại tab đang mở.
    AppModules.rbac.khoaLai = function () {
      AppModules.rbac.unlockedMasterPass = false;
      CoreService.showToast("Đã khóa lại khu vực Quản trị Phân Quyền!", "info");
      AppModules.rbac.veLai();
    };

    // Vẽ lại tab đang mở (taikhoan/matran); dùng sau khi lưu tài khoản/quyền.
    AppModules.rbac.veLai = function () {
      const m = AppModules[CoreService.activeTab];
      if (m && m.render) m.render(); else AppModules.rbac.render();
    };

    /* ---------- TAB 1: DANH SÁCH TÀI KHOẢN ---------- */
    /* ---------- TAB BỌC "phanquyen": 1 mục menu → cổng mật khẩu → 2 tab con ---------- */
    // [THÊM MỚI 27/08/2026 lần 2] Trước đây "Danh Sách Tài Khoản" và "Ma Trận Phân Quyền" là
    // 2 mục menu riêng. Nay gộp: 1 mục menu mở tab bọc này, nhập mật khẩu quản trị 1 lần rồi
    // hiện 2 TAB CON bên trong. Cổng mật khẩu đặt ở đây (dùng chung cho cả 2 tab con).
    /* =========================================================================
       [THÊM MỚI 28/08/2026] MÔ-ĐUN "ĐỀ XUẤT NHÂN SỰ" + QUY TRÌNH DUYỆT NHIỀU CẤP
       -------------------------------------------------------------------------
       VÌ SAO có mô-đun này: khi một phòng ban THIẾU NGƯỜI, họ cần một kênh CHÍNH
       THỨC để đề xuất tuyển/bổ sung nhân sự; và đề xuất đó phải được DUYỆT THEO
       CẤP (tuyển người = tăng biên chế + tốn chi phí, không để ai tự quyết).

       MÔ HÌNH "THANG DUYỆT" (ladder) — CHỦ APP TÙY BIẾN được (yêu cầu của chủ app):
         - "thang" là danh sách CẤP BẬC xếp từ thấp → cao, vd ["manager","hr","director"].
         - Đơn do người ở cấp X tạo phải đi qua duyệt của MỌI cấp trong thang mà
           CAO HƠN X, theo thứ tự. Cấp cuối cùng áp dụng = người CHỐT.
         - Ví dụ thang ["manager","hr","director"]:
             * Nhân viên tạo   → Trưởng phòng → HC → Giám đốc (chốt)
             * Trưởng phòng tạo → HC → Giám đốc (chốt)   (bỏ bước "Trưởng phòng" vì tự mình đã là cấp đó)
             * HC tạo           → Giám đốc (chốt)
         - Sửa mảng "thang" ở tab "Quy trình duyệt" = đổi CẢ số bước lẫn người chốt
           cuối (đúng ý "tùy biến"). Bám theo CẤP BẬC (capBac), KHÔNG hardcode vai
           trò cứng → khớp quy ước phân quyền của app, vai trò đặt tên gì cũng chạy.
       ========================================================================= */
    AppModules.denxuat = {
      currentFilter: "all",

      // Bậc số của một cấp bậc (theo thứ tự nền CAP_BAC_NEN): employee=0 … it_admin=5.
      // Dùng để so "cao hơn / thấp hơn" giữa các cấp khi dựng thang duyệt.
      bacSo(cb) { const i = CAP_BAC_NEN.indexOf(cb); return i < 0 ? 0 : i; },

      // Tên tiếng Việt dễ đọc của một cấp bậc (hiện trên giao diện).
      tenCapBac(cb) {
        return ({ employee: "Nhân viên", manager: "Trưởng phòng", hr: "HC (Hành chính – Nhân sự)",
                  accountant: "Kế toán", director: "Giám đốc", it_admin: "Quản trị IT" })[cb] || cb;
      },

      // Lấy thang duyệt đề xuất nhân sự từ Cài đặt (chủ app sửa được). Thiếu → mặc định 3 cấp.
      // Luôn sắp lại theo bậc tăng dần để chắc chắn thứ tự thấp → cao.
      layThang() {
        const st = getCompanySettings();
        const qt = st.quyTrinhDuyet && st.quyTrinhDuyet.de_xuat_nhan_su;
        const thang = qt && Array.isArray(qt.thang) && qt.thang.length ? qt.thang.slice() : ["manager", "hr", "director"];
        return thang.sort((a, b) => this.bacSo(a) - this.bacSo(b));
      },

      // Thang HIỆU LỰC cho một người tạo: chỉ giữ các cấp CAO HƠN cấp của người tạo.
      // (Người tạo đã là cấp đó thì không phải tự duyệt lại chính mình.)
      thangHieuLuc(capBacNguoiTao) {
        const bacTao = this.bacSo(capBacNguoiTao);
        return this.layThang().filter(c => this.bacSo(c) > bacTao);
      },

      // Danh sách phòng ban có thật trong công ty (rút từ hồ sơ nhân viên) — cho ô gợi ý.
      dsPhongBan() {
        const data = DataService.getData();
        const s = new Set();
        (data.nhanVien || []).forEach(n => { if (n.phongBan) s.add(n.phongBan); });
        return Array.from(s);
      },

      setFilter(f) { this.currentFilter = f; this.render(); },

      // Người dùng hiện tại có được DUYỆT bước đang chờ của đơn này không.
      canApprove(u, item) {
        if (!u || item.trangThai !== "cho_duyet") return false;
        const eff = this.thangHieuLuc(item.capBacNguoiTao);
        if (!eff.length) return false;
        const capBuoc = eff[item.buoc];                 // cấp bậc đang chờ duyệt ở bước hiện tại
        const myCap = PhanQuyenService.capBacCua(u.role);
        if (myCap === "it_admin") return true;           // IT quản trị hệ thống — được thao tác để hệ không kẹt
        if (myCap !== capBuoc) return false;
        // Bước "Trưởng phòng" chỉ dành cho trưởng phòng CÙNG PHÒNG với người tạo.
        if (capBuoc === "manager") return u.phongBan === item.phongBanNguoiTao;
        return true; // HC / Giám đốc duyệt ở phạm vi toàn công ty
      },

      // Vẽ dải "tiến trình duyệt" (các bước + trạng thái từng bước) cho một đơn.
      veTienTrinh(item) {
        const eff = this.thangHieuLuc(item.capBacNguoiTao);
        if (!eff.length) return `<span class="badge badge-success"><i class="fa-solid fa-check"></i> Tự động duyệt (người tạo là cấp cao nhất)</span>`;
        if (item.trangThai === "tu_choi") {
          const ls = (item.lichSu || []).slice(-1)[0] || {};
          return `<span class="badge badge-danger"><i class="fa-solid fa-xmark"></i> Từ chối</span> <small class="text-muted">bởi ${ls.tenNguoiDuyet || ""}${ls.yKien ? " — " + ls.yKien : ""}</small>`;
        }
        const chips = eff.map((cap, i) => {
          let mau, ic, ghi = "";
          if (item.trangThai === "da_duyet" || i < item.buoc) {
            const ls = (item.lichSu || []).find(x => x.capBac === cap);
            mau = "background:#dcfce7;color:#166534;border:1px solid #16a34a";
            ic = "✔"; ghi = ls ? `<br><small style="color:#166534">${ls.tenNguoiDuyet}</small>` : "";
          } else if (i === item.buoc) {
            mau = "background:#fef9c3;color:#b45309;border:1px solid #f59e0b;font-weight:600";
            ic = "⏳";
          } else {
            mau = "background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1";
            ic = "•";
          }
          return `<span style="display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;margin:2px;${mau}">${ic} ${this.tenCapBac(cap)}${ghi}</span>`;
        }).join('<span style="color:#94a3b8">→</span>');
        return chips + (item.trangThai === "da_duyet" ? ` <span class="badge badge-success">Hoàn tất</span>` : "");
      },

      render() {
        const c = document.getElementById("tab-denxuat");
        if (!c) return;
        const data = DataService.getData();
        const u = CoreService.currentUser || {};
        const myCap = PhanQuyenService.capBacCua(u.role);
        const list0 = data.deXuatNhanSu || [];

        // Phạm vi XEM: HC/Giám đốc/IT xem tất cả; Trưởng phòng xem đơn phòng mình + đơn mình tạo;
        // còn lại (nhân viên) chỉ xem đơn mình tạo.
        let base;
        if (myCap === "hr" || myCap === "director" || myCap === "it_admin") base = list0;
        else if (myCap === "manager") base = list0.filter(d => d.phongBanNguoiTao === u.phongBan || d.nguoiTaoId === u.id);
        else base = list0.filter(d => d.nguoiTaoId === u.id);

        const canToiDuyet = base.filter(d => this.canApprove(u, d)).length;

        let list = base;
        if (this.currentFilter === "can_duyet") list = base.filter(d => this.canApprove(u, d));
        else if (this.currentFilter !== "all") list = base.filter(d => d.trangThai === this.currentFilter);

        c.innerHTML = `
          <div class="guide-box">
            <i class="fa-solid fa-lightbulb guide-icon"></i>
            <div class="guide-content">
              <div class="guide-title">💡 Đề Xuất Nhân Sự — Duyệt Theo Cấp (tự động chuyển bước)</div>
              <div class="guide-steps">
                - <strong>Ai cũng đề xuất được</strong>: phòng ban thiếu người → tạo đề xuất tuyển/bổ sung.<br>
                - <strong>Duyệt theo cấp</strong>: đơn tự leo qua các cấp cao hơn người tạo (Trưởng phòng → HC → Giám đốc). Mỗi cấp duyệt xong tự chuyển cấp trên.<br>
                - <strong>Tùy biến</strong>: số bước & người chốt cuối do Giám đốc/IT chỉnh trong <em>Phân Quyền → Quy Trình Duyệt</em>.
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="fa-solid fa-user-plus"></i> Đề Xuất Nhân Sự ${canToiDuyet > 0 ? `<span class="badge badge-warning">🚨 ${canToiDuyet} đơn chờ tôi duyệt</span>` : ""}</div>
              <button class="btn btn-primary" onclick="AppModules.denxuat.openCreateModal()"><i class="fa-solid fa-plus"></i> Tạo Đề Xuất Mới</button>
            </div>

            <div class="filter-bar">
              <button class="filter-btn ${this.currentFilter === "all" ? "active" : ""}" onclick="AppModules.denxuat.setFilter('all')">Tất Cả</button>
              <button class="filter-btn ${this.currentFilter === "can_duyet" ? "active" : ""}" onclick="AppModules.denxuat.setFilter('can_duyet')" style="${canToiDuyet > 0 ? 'background:#fef3c7;border-color:#f59e0b;color:#b45309;font-weight:bold' : ''}">🚨 Cần Tôi Duyệt (${canToiDuyet})</button>
              <button class="filter-btn ${this.currentFilter === "cho_duyet" ? "active" : ""}" onclick="AppModules.denxuat.setFilter('cho_duyet')">⏳ Đang Duyệt</button>
              <button class="filter-btn ${this.currentFilter === "da_duyet" ? "active" : ""}" onclick="AppModules.denxuat.setFilter('da_duyet')">✅ Đã Duyệt</button>
              <button class="filter-btn ${this.currentFilter === "tu_choi" ? "active" : ""}" onclick="AppModules.denxuat.setFilter('tu_choi')">❌ Từ Chối</button>
            </div>

            <div class="table-responsive">
              <table class="bang-the">
                <thead>
                  <tr>
                    <th class="col-stt" style="width:44px">STT</th>
                    <th class="col-ma">Mã</th>
                    <th>Người Tạo / Phòng Ban</th>
                    <th>Vị Trí Cần Tuyển</th>
                    <th class="col-so">SL</th>
                    <th class="col-ngay">Cần Trước</th>
                    <th style="min-width:220px">Tiến Trình Duyệt</th>
                    <th class="col-action">Thao Tác</th>
                  </tr>
                </thead>
                <tbody>
                  ${list.length === 0 ? `<tr><td colspan="8" class="col-action o-rong">Chưa có đề xuất nào trong danh mục này</td></tr>` : list.map((item, idx) => `
                    <tr>
                      <td class="col-stt">${idx + 1}</td>
                      <td class="col-ma" data-label="Mã">${item.id}</td>
                      <td data-label="Người tạo"><strong>${item.tenNguoiTao}</strong><br><small class="badge badge-info" style="font-size:10px">${item.phongBanNguoiTao || "—"}</small></td>
                      <td data-label="Vị trí"><strong>${item.viTri || "—"}</strong>${item.phongBanCanTuyen && item.phongBanCanTuyen !== item.phongBanNguoiTao ? `<br><small class="text-muted">Cho phòng: ${item.phongBanCanTuyen}</small>` : ""}</td>
                      <td class="col-so" data-label="SL" style="font-weight:bold;color:var(--primary-main)">${formatNumber(item.soLuong || 1, 0)}</td>
                      <td class="col-ngay" data-label="Cần trước">${item.thoiDiemCan ? formatDateDisplay(item.thoiDiemCan) : "—"}</td>
                      <td data-label="Tiến trình">${this.veTienTrinh(item)}</td>
                      <td class="col-action">
                        ${this.canApprove(u, item)
                          ? `<button class="btn btn-sm btn-success" onclick="AppModules.denxuat.openDuyet('${item.id}','duyet')"><i class="fa-solid fa-check"></i> Duyệt</button>
                             <button class="btn btn-sm btn-danger" onclick="AppModules.denxuat.openDuyet('${item.id}','tu_choi')"><i class="fa-solid fa-xmark"></i> Từ chối</button>`
                          : `<button class="btn btn-sm btn-secondary" onclick="AppModules.denxuat.openChiTiet('${item.id}')"><i class="fa-solid fa-eye"></i> Xem</button>`}
                      </td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      // Modal TẠO đề xuất mới.
      openCreateModal() {
        const u = CoreService.currentUser || {};
        const today = new Date().toISOString().split("T")[0];
        const myCap = PhanQuyenService.capBacCua(u.role);
        const eff = this.thangHieuLuc(myCap);
        // Xem trước đơn của mình sẽ đi qua những ai (để người tạo biết trước).
        const chuoiDuyet = eff.length ? eff.map((cc, i) => `${this.tenCapBac(cc)}${i === eff.length - 1 ? " <strong>(chốt)</strong>" : ""}`).join(" → ") : "<em>Tự động duyệt (bạn là cấp cao nhất)</em>";
        const dsPB = this.dsPhongBan();
        const body = `
          <form id="formDeXuat" onsubmit="return false;">
            <div style="background:var(--primary-lighter);padding:8px 12px;border-radius:6px;font-size:12.5px;color:var(--primary-dark);margin-bottom:12px">
              <i class="fa-solid fa-route"></i> Đơn của bạn sẽ đi qua: ${chuoiDuyet}
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-building"></i> Phòng Ban Cần Người</label>
                <input type="text" id="dxPhongBan" class="form-control" list="dxDsPB" value="${u.phongBan || ""}" placeholder="Nhập tên phòng ban">
                <datalist id="dxDsPB">${dsPB.map(p => `<option value="${p}">`).join("")}</datalist>
              </div>
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-id-badge"></i> Vị Trí / Chức Danh Cần Tuyển</label>
                <input type="text" id="dxViTri" class="form-control" placeholder="VD: Nhân viên kho, Kế toán tổng hợp…">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-hashtag"></i> Số Lượng</label>
                <input type="number" id="dxSoLuong" class="form-control" value="1" min="1" step="1">
              </div>
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-calendar-day"></i> Cần Trước Ngày</label>
                <input type="date" id="dxThoiDiem" class="form-control" value="${today}">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-briefcase"></i> Hình Thức <small class="text-muted">(không bắt buộc)</small></label>
                <select id="dxHinhThuc" class="form-control">
                  <option value="Tuyển mới">Tuyển mới (tăng biên chế)</option>
                  <option value="Thay thế">Thay thế người nghỉ</option>
                  <option value="Thời vụ">Thời vụ / ngắn hạn</option>
                  <option value="Điều chuyển nội bộ">Điều chuyển nội bộ</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-money-bill-wave"></i> Mức Lương Dự Kiến <small class="text-muted">(không bắt buộc)</small></label>
                <input type="text" id="dxLuong" class="form-control" placeholder="VD: 8–10 triệu / thỏa thuận">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-comment-dots"></i> Lý Do / Mô Tả Công Việc <span style="color:var(--danger-text)">*</span></label>
              <textarea id="dxLyDo" class="form-control" rows="3" placeholder="Vì sao cần thêm người, khối lượng công việc, yêu cầu chính…"></textarea>
            </div>
          </form>
        `;
        CoreService.openModal("Tạo Đề Xuất Nhân Sự", body, [
          { text: "Hủy", class: "btn-secondary" },
          { text: "<i class='fa-solid fa-paper-plane'></i> Gửi Đề Xuất", class: "btn-primary", close: false, onClick: () => this.submitCreate() }
        ]);
      },

      submitCreate() {
        const u = CoreService.currentUser || {};
        const viTri = document.getElementById("dxViTri").value.trim();
        const lyDo = document.getElementById("dxLyDo").value.trim();
        const soLuong = parseInt(document.getElementById("dxSoLuong").value, 10) || 1;
        if (!viTri) { CoreService.showToast("Vui lòng nhập vị trí / chức danh cần tuyển!", "warning"); return; }
        if (!lyDo) { CoreService.showToast("Vui lòng nhập lý do đề xuất!", "warning"); return; }
        if (soLuong < 1) { CoreService.showToast("Số lượng phải từ 1 trở lên!", "warning"); return; }

        const data = DataService.getData();
        data.deXuatNhanSu = data.deXuatNhanSu || [];
        const myCap = PhanQuyenService.capBacCua(u.role);
        const eff = this.thangHieuLuc(myCap);
        // Không có cấp nào cao hơn (vd Giám đốc tự tạo) → duyệt luôn, khỏi treo.
        const tuDuyet = eff.length === 0;

        const item = {
          id: "DXNS-" + new Date().getTime().toString().slice(-6),
          ngayTao: new Date().toLocaleString("vi-VN"),
          nguoiTaoId: u.id,
          tenNguoiTao: u.hoTen,
          capBacNguoiTao: myCap,
          phongBanNguoiTao: u.phongBan || "",
          phongBanCanTuyen: document.getElementById("dxPhongBan").value.trim() || u.phongBan || "",
          viTri: viTri,
          soLuong: soLuong,
          hinhThuc: document.getElementById("dxHinhThuc").value,
          mucLuongDuKien: document.getElementById("dxLuong").value.trim(),
          thoiDiemCan: document.getElementById("dxThoiDiem").value,
          lyDo: lyDo,
          trangThai: tuDuyet ? "da_duyet" : "cho_duyet",
          buoc: 0,                 // chỉ số bước hiện tại trong thang hiệu lực
          lichSu: []
        };
        data.deXuatNhanSu.unshift(item);
        DataService.saveData(data);
        CoreService.closeModal();

        NotificationService.addNotification(
          "🧑‍💼 Đề xuất nhân sự mới",
          `${u.hoTen} đề xuất tuyển ${soLuong} × ${viTri} (${item.phongBanCanTuyen}). ${tuDuyet ? "Đã tự duyệt." : "Đang chờ " + this.tenCapBac(eff[0]) + " duyệt."}`,
          "request"
        );
        CoreService.showToast(tuDuyet ? "Đã tạo & tự duyệt đề xuất!" : "Đã gửi đề xuất, đang chờ duyệt!", "success");
        this.render();
      },

      // Modal DUYỆT / TỪ CHỐI một bước.
      openDuyet(id, ketQua) {
        const data = DataService.getData();
        const item = (data.deXuatNhanSu || []).find(d => d.id === id);
        if (!item) return;
        const laDuyet = ketQua === "duyet";
        const body = `
          <div style="margin-bottom:10px">
            <p>Đề xuất <strong>${item.viTri}</strong> (SL: <strong>${item.soLuong}</strong> — Phòng: <strong>${item.phongBanCanTuyen}</strong>)</p>
            <p class="text-muted" style="font-size:13px">Người tạo: <strong>${item.tenNguoiTao}</strong> | Lý do: <em>${item.lyDo}</em></p>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-comment-medical"></i> Ý Kiến ${laDuyet ? "Duyệt" : "Từ Chối"}</label>
            <textarea id="dxYkien" class="form-control" rows="3">${laDuyet ? "Đồng ý, chuyển cấp trên xem xét." : "Chưa đủ điều kiện duyệt."}</textarea>
          </div>
        `;
        CoreService.openModal(laDuyet ? "Duyệt Đề Xuất" : "Từ Chối Đề Xuất", body, [
          { text: "Hủy", class: "btn-secondary" },
          {
            text: laDuyet ? "<i class='fa-solid fa-check'></i> Xác Nhận Duyệt" : "<i class='fa-solid fa-xmark'></i> Xác Nhận Từ Chối",
            class: laDuyet ? "btn-success" : "btn-danger", close: false,
            onClick: () => {
              const u = CoreService.currentUser || {};
              // Kiểm lại quyền ngay lúc bấm (chống lách): phải đúng người của bước hiện tại.
              if (!this.canApprove(u, item)) { CoreService.showToast("Bạn không có quyền duyệt bước này!", "danger"); return; }
              const yKien = document.getElementById("dxYkien").value.trim();
              const eff = this.thangHieuLuc(item.capBacNguoiTao);
              item.lichSu = item.lichSu || [];
              item.lichSu.push({
                capBac: eff[item.buoc], tenNguoiDuyet: u.hoTen, chucVu: u.chucVu || "",
                ngay: new Date().toLocaleString("vi-VN"), ketQua: laDuyet ? "duyet" : "tu_choi", yKien: yKien
              });
              if (!laDuyet) {
                item.trangThai = "tu_choi";
              } else if (item.buoc >= eff.length - 1) {
                item.trangThai = "da_duyet";   // đã qua bước cuối → hoàn tất
              } else {
                item.buoc += 1;                // chuyển sang cấp duyệt tiếp theo
              }
              DataService.saveData(data);
              CoreService.closeModal();
              const conCho = laDuyet && item.trangThai === "cho_duyet";
              NotificationService.addNotification(
                laDuyet ? (item.trangThai === "da_duyet" ? "✅ Đề xuất nhân sự đã DUYỆT xong" : "➡️ Đề xuất nhân sự chuyển cấp") : "❌ Đề xuất nhân sự bị từ chối",
                `${item.viTri} (${item.phongBanCanTuyen}) — ${u.hoTen} ${laDuyet ? "đã duyệt" : "từ chối"}.${conCho ? " Chờ " + this.tenCapBac(eff[item.buoc]) + " duyệt tiếp." : ""}`,
                "request"
              );
              CoreService.showToast(laDuyet ? (item.trangThai === "da_duyet" ? "Đã duyệt xong đề xuất!" : "Đã duyệt, chuyển cấp trên!") : "Đã từ chối đề xuất!", laDuyet ? "success" : "info");
              this.render();
            }
          }
        ]);
      },

      // Modal XEM chi tiết + lịch sử duyệt (chỉ đọc).
      openChiTiet(id) {
        const data = DataService.getData();
        const item = (data.deXuatNhanSu || []).find(d => d.id === id);
        if (!item) return;
        const ls = (item.lichSu || []).map(x => `
          <li style="margin:4px 0">
            <span class="badge ${x.ketQua === "duyet" ? "badge-success" : "badge-danger"}">${x.ketQua === "duyet" ? "Duyệt" : "Từ chối"}</span>
            <strong>${x.tenNguoiDuyet}</strong> <small class="text-muted">(${this.tenCapBac(x.capBac)} — ${x.ngay})</small>${x.yKien ? `<br><em style="font-size:12px">"${x.yKien}"</em>` : ""}
          </li>`).join("");
        const body = `
          <div style="line-height:1.8">
            <div><strong>Mã:</strong> ${item.id} &nbsp; <strong>Ngày tạo:</strong> ${item.ngayTao}</div>
            <div><strong>Người tạo:</strong> ${item.tenNguoiTao} (${this.tenCapBac(item.capBacNguoiTao)} — ${item.phongBanNguoiTao})</div>
            <div><strong>Vị trí cần tuyển:</strong> ${item.viTri} &nbsp; <strong>Số lượng:</strong> ${item.soLuong}</div>
            <div><strong>Phòng cần người:</strong> ${item.phongBanCanTuyen} &nbsp; <strong>Hình thức:</strong> ${item.hinhThuc || "—"}</div>
            <div><strong>Cần trước:</strong> ${item.thoiDiemCan ? formatDateDisplay(item.thoiDiemCan) : "—"} &nbsp; <strong>Lương dự kiến:</strong> ${item.mucLuongDuKien || "—"}</div>
            <div><strong>Lý do:</strong> ${item.lyDo}</div>
          </div>
          <hr style="margin:12px 0;border:none;border-top:1px solid var(--border-color)">
          <div><strong>Tiến trình:</strong><br>${this.veTienTrinh(item)}</div>
          ${ls ? `<div style="margin-top:10px"><strong>Lịch sử duyệt:</strong><ul style="padding-left:18px;margin:6px 0">${ls}</ul></div>` : ""}
        `;
        CoreService.openModal("Chi Tiết Đề Xuất Nhân Sự", body, [{ text: "Đóng", class: "btn-secondary" }]);
      }
    };

    /* [THÊM MỚI 28/08/2026 · MỞ RỘNG lần 2] TAB CON "QUY TRÌNH DUYỆT" = SỔ ĐĂNG KÝ chung.
       -------------------------------------------------------------------------
       Liệt kê MỌI chứng từ của app + thang duyệt của từng cái (ai duyệt, chốt ở đâu).
       Giám đốc/IT bấm "Sửa" để tùy biến thang (số bước + người chốt cuối). Vai trò khác chỉ xem.

       QUAN TRỌNG — 3 mức "trạng thái áp dụng" (khai TRUNG THỰC để chủ app không hiểu nhầm):
         - "da_ap"   : module ĐANG CHẠY ĐÚNG theo thang này (sửa thang = đổi hành vi thật).
                       Hiện chỉ Đề xuất nhân sự.
         - "co_dinh" : chứng từ đang có bước duyệt nhưng CỐ ĐỊNH 1 CẤP trong code (Đơn từ, VPP,
                       Kaizen). Thang ở đây là KHAI BÁO ý định — module CHƯA đọc, phải rewire sau.
         - "khai_bao": chứng từ CHƯA có bước duyệt nào trong module (Bảng chấm công tháng).
                       Khai trước để chuẩn bị; sẽ làm ở bước sau.
       ========================================================================= */
    AppModules.quytrinhduyet = {
      // Danh mục chứng từ. macDinh = thang mặc định; ungVien = các cấp được phép đưa vào thang.
      DS_CHUNG_TU: [
        { ma: "don_tu", ten: "Đơn từ (nghỉ phép / OT / ra ngoài / về sớm)", icon: "fa-file-signature",
          trangThai: "co_dinh", macDinh: ["manager"], ungVien: ["manager", "hr", "director"],
          moTa: "Nhân viên xin nghỉ/OT/ra ngoài. Hiện chạy 1 cấp: Trưởng phòng cùng bộ phận duyệt." },
        { ma: "cham_cong", ten: "Bảng chấm công tháng", icon: "fa-calendar-check",
          trangThai: "khai_bao", macDinh: ["manager", "hr"], ungVien: ["manager", "hr", "accountant", "director"],
          moTa: "Chốt bảng công cuối tháng để tính lương. Hiện CHƯA có bước duyệt — sẽ làm sau." },
        { ma: "du_tru_vpp", ten: "Dự trù / Order văn phòng phẩm", icon: "fa-boxes-stacked",
          trangThai: "co_dinh", macDinh: ["manager", "hr"], ungVien: ["manager", "hr", "director"],
          moTa: "Đề nghị mua VPP. Hiện chạy 1 cấp: Trưởng phòng duyệt → phát." },
        { ma: "kaizen", ten: "Sáng kiến Kaizen", icon: "fa-lightbulb",
          trangThai: "co_dinh", macDinh: ["manager", "hr"], ungVien: ["manager", "hr", "director"],
          moTa: "Đánh giá sáng kiến cải tiến. Hiện chạy đánh giá 1 cấp." },
        { ma: "de_xuat_nhan_su", ten: "Đề xuất nhân sự (tuyển / bổ sung người)", icon: "fa-user-plus",
          trangThai: "da_ap", macDinh: ["manager", "hr", "director"], ungVien: ["manager", "hr", "accountant", "director"],
          moTa: "Phòng ban thiếu người → đề xuất tuyển. ĐANG CHẠY đúng thang này." }
      ],

      // Tìm mô tả 1 chứng từ theo mã.
      timCT(ma) { return this.DS_CHUNG_TU.find(x => x.ma === ma) || null; },

      // Thang duyệt của một chứng từ: ưu tiên cấu hình đã lưu, thiếu thì lấy mặc định trong DS_CHUNG_TU.
      // Luôn sắp theo bậc tăng dần (thấp → cao) để đúng thứ tự leo cấp.
      thangCua(ma) {
        const dx = AppModules.denxuat;
        const st = getCompanySettings();
        const qt = st.quyTrinhDuyet && st.quyTrinhDuyet[ma];
        const ct = this.timCT(ma);
        const thang = (qt && Array.isArray(qt.thang) && qt.thang.length) ? qt.thang.slice()
                     : (ct ? ct.macDinh.slice() : ["manager", "hr", "director"]);
        return thang.sort((a, b) => dx.bacSo(a) - dx.bacSo(b));
      },

      // Thang HIỆU LỰC cho 1 người tạo cấp X: chỉ giữ cấp cao hơn X (giống Đề xuất nhân sự).
      thangHieuLucCua(ma, capBacNguoiTao) {
        const dx = AppModules.denxuat;
        const bacTao = dx.bacSo(capBacNguoiTao);
        return this.thangCua(ma).filter(c => dx.bacSo(c) > bacTao);
      },

      // Huy hiệu trạng thái áp dụng (màu + chữ) — nói thật module đã chạy theo thang chưa.
      _badgeTrangThai(tt) {
        if (tt === "da_ap") return `<span class="badge badge-success"><i class="fa-solid fa-circle-check"></i> Đang áp dụng</span>`;
        if (tt === "co_dinh") return `<span class="badge badge-info"><i class="fa-solid fa-lock"></i> Đang chạy 1 cấp (cố định) — thang là khai báo</span>`;
        return `<span class="badge badge-warning"><i class="fa-solid fa-hourglass-half"></i> Chưa có bước duyệt — mới khai báo</span>`;
      },

      render() {
        const c = document.getElementById("tab-quytrinh");
        if (!c) return;
        const myCap = PhanQuyenService.capBacCua((CoreService.currentUser || {}).role);
        const laAdmin = myCap === "director" || myCap === "it_admin";
        const dx = AppModules.denxuat;
        const tenCap = (cb) => dx.tenCapBac(cb);

        // Vẽ 1 thẻ chứng từ.
        const veThe = (ct) => {
          const thang = this.thangCua(ct.ma);
          const chotCuoi = thang.length ? tenCap(thang[thang.length - 1]) : "—";
          // Ví dụ đường đi theo cấp người tạo (chỉ hiện với chứng từ có leo cấp > 1 bước).
          const viDu = (capTao) => {
            const eff = this.thangHieuLucCua(ct.ma, capTao);
            const chuoi = eff.length ? eff.map((cc, i) => `${tenCap(cc)}${i === eff.length - 1 ? " <strong>(chốt)</strong>" : ""}`).join(" → ") : "<em>Tự động duyệt</em>";
            return `<div style="margin:4px 0"><span class="badge badge-info">${tenCap(capTao)} tạo</span> <span style="color:#94a3b8">→</span> ${chuoi}</div>`;
          };
          const nhieuCap = thang.length > 1;
          return `
            <div class="card" style="margin-bottom:12px">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid ${ct.icon}"></i> ${ct.ten}</div>
                ${laAdmin ? `<button class="btn btn-sm btn-secondary" onclick="AppModules.quytrinhduyet.suaThang('${ct.ma}')"><i class="fa-solid fa-pen"></i> Sửa</button>` : ""}
              </div>
              <div style="margin:4px 0 8px">${this._badgeTrangThai(ct.trangThai)}</div>
              <p style="margin:6px 0">Thang duyệt: ${thang.map(cc => `<span class="badge badge-purple">${tenCap(cc)}</span>`).join(' <span style="color:#94a3b8">→</span> ')} &nbsp;|&nbsp; Chốt cuối: <strong>${chotCuoi}</strong></p>
              <p class="text-muted" style="font-size:12.5px;margin:4px 0">${ct.moTa}</p>
              ${nhieuCap ? `<div style="background:var(--bg-hover);padding:8px 12px;border-radius:8px;margin-top:6px">
                <div class="text-muted" style="font-size:12px;margin-bottom:2px">Ví dụ theo cấp người tạo:</div>
                ${["employee", "manager", "hr"].map(viDu).join("")}
              </div>` : ""}
            </div>`;
        };

        c.innerHTML = `
          <div class="guide-box">
            <i class="fa-solid fa-lightbulb guide-icon"></i>
            <div class="guide-content">
              <div class="guide-title">💡 Sổ Đăng Ký Quy Trình Duyệt — Ai Duyệt, Chốt Ở Đâu</div>
              <div class="guide-steps">
                Nơi <strong>thiết lập</strong> quy trình duyệt cho từng chứng từ. Mỗi chứng từ đi theo "thang" cấp bậc: đơn leo qua các cấp <strong>cao hơn người tạo</strong>, cấp cuối cùng là người <strong>chốt</strong>.<br>
                Xem kỹ <strong>huy hiệu trạng thái</strong>: chỉ chứng từ ghi <em>"Đang áp dụng"</em> mới chạy thật theo thang; loại <em>"cố định"</em> / <em>"mới khai báo"</em> là chuẩn bị, module sẽ được nối theo ở bước sau.
              </div>
            </div>
          </div>
