        fetchGPS() {
          if (!navigator.geolocation) {
            CoreService.showToast("Trình duyệt không hỗ trợ định vị GPS!", "danger");
            return;
          }
          this.isGpsLoading = true;
          this.render();

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              this.isGpsLoading = false;
              this.currentGps = {
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: pos.coords.accuracy
              };
              this.gpsAddress = `Tọa độ GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (Sai số &plusmn;${Math.round(pos.coords.accuracy)}m)`;
              CoreService.showToast("Đã bắt tọa độ GPS thành công!", "success");
              this.render();
            },
            (err) => {
              this.isGpsLoading = false;
              let msg = "Không thể lấy vị trí GPS.";
              if (err.code === 1) msg = "Bạn đã từ chối quyền truy cập vị trí (GPS). Vui lòng bật lại trong cài đặt trình duyệt.";
              else if (err.code === 2) msg = "Không xác định được vị trí thiết bị.";
              else if (err.code === 3) msg = "Quá thời gian lấy vị trí GPS.";
              CoreService.showToast(msg, "warning");
              this.render();
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        },

        async toggleCamera() {
          if (this.cameraStream) {
            this.stopCamera();
            this.render();
          } else {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
              });
              this.cameraStream = stream;
              this.currentPhoto = null;
              this.render();
              setTimeout(() => {
                const vid = document.getElementById("selfieVideoEl");
                if (vid) vid.srcObject = stream;
              }, 100);
            } catch (err) {
              CoreService.showToast("Không thể mở Camera: " + (err.message || "Vui lòng cấp quyền truy cập Camera."), "danger");
            }
          }
        },

        stopCamera() {
          if (this.cameraStream) {
            this.cameraStream.getTracks().forEach(track => track.stop());
            this.cameraStream = null;
          }
        },

        snapPhoto() {
          const video = document.getElementById("selfieVideoEl");
          if (!video) return;
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext("2d");
          // Mirror horizontal like selfie
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          this.currentPhoto = canvas.toDataURL("image/jpeg", 0.7);
          this.stopCamera();
          CoreService.showToast("Đã chụp ảnh khuôn mặt thành công!", "success");
          this.render();
        },

        handlePhotoUpload(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            // Nén ảnh gọn gàng trước khi lưu
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const maxDim = 800;
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                else { w = Math.round((w * maxDim) / h); h = maxDim; }
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              this.currentPhoto = canvas.toDataURL("image/jpeg", 0.75);
              CoreService.showToast("Đã chọn ảnh thành công!", "success");
              this.render();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        removePhoto() {
          this.currentPhoto = null;
          this.render();
        },

            : this.currentMode === "thi_truong" 
            ? "Đi Thị Trường / Công Tác" 
            : "Tại Nhà Máy / Văn Phòng";

        submitCheckOut() {
          const user = CoreService.currentUser;

          const todayStr = new Date().toISOString().split("T")[0];
          const nowTime = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });

          data.bangCong = data.bangCong || [];
          let existIdx = data.bangCong.findIndex(b => b.maNV === user.id && b.ngay === todayStr);

          if (existIdx < 0) {
            CoreService.showToast("Bạn chưa Check-in vào ca hôm nay! Vui lòng bấm Check-in trước.", "warning");
            return;
          }

          // [SỬA 28/08/2026] Tính giờ OT nếu ra SAU giờ ra chuẩn (lấy từ Cài đặt, mặc định 17:30).
          //   Trước đây cố định 17:30 trong code; nay đọc gioRaChuan để mỗi công ty tự đặt.
          const [nowH, nowM] = nowTime.split(":").map(Number);
          const phutRaChuan = phutTuGio(getCompanySettings().gioRaChuan) != null ? phutTuGio(getCompanySettings().gioRaChuan) : (17 * 60 + 30);
          const phutRaThucTe = nowH * 60 + nowM;
          let otHours = 0;
          if (phutRaThucTe > phutRaChuan) {
            const diffMin = phutRaThucTe - phutRaChuan;
            otHours = Math.round((diffMin / 60) * 10) / 10;   // làm tròn 0,1 giờ
          }

          data.bangCong[existIdx].gioRa = nowTime;
          data.bangCong[existIdx].hasCheckedOut = true;
          if (otHours > 0) data.bangCong[existIdx].gioOT = otHours;
          if (this.currentPhoto) data.bangCong[existIdx].anhCheckOut = this.currentPhoto;

          DataService.saveData(data);
          this.stopCamera();
          CoreService.showToast(`🔴 Chấm công Ra Ca thành công lúc ${nowTime}! ${otHours > 0 ? `(Ghi nhận ${otHours}h OT)` : ''}`, "success");
          this.render();
        },

                ` : ``}
                <button class="filter-btn ${this.currentFilter === "cho_duyet" ? "active" : ""}" onclick="AppModules.requests.setFilter('cho_duyet')">⏳ Chờ Duyệt</button>
                <button class="filter-btn ${this.currentFilter === "da_duyet" ? "active" : ""}" onclick="AppModules.requests.setFilter('da_duyet')">✅ Đã Duyệt</button>
                <button class="filter-btn ${this.currentFilter === "tu_choi" ? "active" : ""}" onclick="AppModules.requests.setFilter('tu_choi')">❌ Từ Chối</button>
              </div>

              <div class="table-responsive">
                <!-- [THÊM MỚI 27/08/2026] class "bang-the" → trên điện thoại bảng này tự thành THẺ (dễ đọc, hết vuốt ngang). -->
                <table class="bang-the">
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:44px">STT</th>
                      <th class="col-ma">Mã Đơn</th>
                      <th>Người Tạo / Phòng Ban</th>
                      <th>Loại Đề Xuất</th>
                      <th>Thời Gian Chi Tiết</th>
                      <th class="col-so">Thời Lượng</th>
                      <th>Người Bàn Giao</th>
                      <th style="text-align:center">Trạng Thái & Người Duyệt</th>
                      <th class="col-action">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${donTuList.length === 0 ? `<tr><td colspan="9" class="col-action o-rong">Không có đơn nào trong danh mục này</td></tr>` : donTuList.map((item, idx) => {
                      let thoiGianStr = formatDateDisplay(item.tuNgay);
                      if (item.hinhThuc === "gio") {
                        thoiGianStr = `${formatDateDisplay(item.ngayApDung || item.tuNgay)} (${item.tuGio || "08:00"} - ${item.denGio || "17:30"})`;
                      } else if (item.tuNgay !== item.denNgay) {
                        thoiGianStr = `${formatDateDisplay(item.tuNgay)} ➔ ${formatDateDisplay(item.denNgay)}`;
                      }

                      const thoiLuongStr = item.hinhThuc === "gio" ? `${formatNumber(item.soGio || item.soNgay || 1, 1)} giờ` : `${formatNumber(item.soNgay, 1)} ngày`;

                      // Kiểm tra xem user hiện tại có quyền duyệt đơn này không (Admin hoặc đúng Trưởng phòng của nhân viên)
                      const canApprove = (currentUser.role === "admin") || (currentUser.role === "manager" && (item.phongBan === userDept || !item.phongBan));

                      return `
                        <tr>
                          <td class="col-stt">${idx + 1}</td>
                          <td class="col-ma" data-label="Mã đơn">${item.id}</td>
                          <td data-label="Người tạo">
                            <strong>${item.tenNV}</strong><br>
                            <small class="badge badge-info" style="font-size:10px;">${item.phongBan || "Văn Phòng"}</small>
                          </td>
                          <td data-label="Loại"><span class="badge badge-purple">${item.tenLoaiDon}</span></td>
                          <td data-label="Thời gian">${thoiGianStr}</td>
                          <td class="col-so" data-label="Thời lượng" style="font-weight:bold;color:var(--primary-main)">${thoiLuongStr}</td>
                          <td data-label="Bàn giao">${item.tenNguoiBanGiao ? `<strong>${item.tenNguoiBanGiao}</strong>` : "—"}</td>
                          <td data-label="Trạng thái" style="text-align:center">
                            ${this.renderBadgeStatus(item.trangThai)}
                            ${item.nguoiDuyet ? `<br><small class="text-muted" style="font-size:11px;">Duyệt bởi: <strong>${item.nguoiDuyet}</strong><br>(${item.ngayDuyet ? item.ngayDuyet.split(" ")[0] : ""})</small>` : ``}
                          </td>
                          <td class="col-action">
                            ${canApprove && item.trangThai === "cho_duyet"
                              ? `<button class="btn btn-sm btn-success" onclick="AppModules.requests.openApproveDialog('${item.id}', 'da_duyet')"><i class="fa-solid fa-check"></i> Duyệt</button>
                                 <button class="btn btn-sm btn-danger" onclick="AppModules.requests.openApproveDialog('${item.id}', 'tu_choi')"><i class="fa-solid fa-xmark"></i> Từ chối</button>`
                              : `<button class="btn btn-sm btn-secondary" onclick="AppModules.requests.printDonModal('${item.id}')"><i class="fa-solid fa-print"></i> In Đơn</button>`
                            }
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        },
        setFilter(filter) {
          this.currentFilter = filter;
          this.render();
        },
        renderBadgeStatus(status) {
          if (status === "da_duyet") return `<span class="badge badge-success"><i class="fa-solid fa-check"></i> Đã duyệt</span>`;
          if (status === "tu_choi") return `<span class="badge badge-danger"><i class="fa-solid fa-xmark"></i> Từ chối</span>`;
          return `<span class="badge badge-warning"><i class="fa-solid fa-spinner"></i> Chờ duyệt</span>`;
        },
        openCreateModal() {
          const data = DataService.getData();
          const currentUser = CoreService.currentUser;
          const otherEmployees = (data.nhanVien || []).filter(n => n.id !== currentUser.id && n.trangThai !== "dinh_chi");
          const managers = (data.nhanVien || []).filter(n => n.role === "manager" || n.role === "admin");
          const defaultManager = managers.find(m => m.phongBan === currentUser.phongBan) || managers[0];
          const today = new Date().toISOString().split("T")[0];

          const bodyHtml = `
            <form id="formDonTu" onsubmit="return false;">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label"><i class="fa-solid fa-building"></i> Phòng Ban Của Bạn</label>
                  <input type="text" class="form-control" value="${currentUser.phongBan}" disabled>
                </div>
                <div class="form-group">
                  <label class="form-label"><i class="fa-solid fa-user-tie"></i> Trưởng Phòng Phụ Trách Phê Duyệt</label>
                  <select id="inpTruongPhongEmail" class="form-control">
                    ${managers.map(m => `<option value="${m.email}" ${defaultManager && defaultManager.id === m.id ? "selected" : ""}>${m.hoTen} (${m.chucVu} - ${m.phongBan})</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-layer-group"></i> Loại Đề Xuất / Đơn Từ</label>
                <select id="inpLoaiDon" class="form-control" onchange="AppModules.requests.onLoaiDonChanged()">
                  ${DANH_MUC_NGHI.map(m => `<option value="${m.id}">${m.name}</option>`).join("")}
                  <option value="ra_ngoai_cong_tac">Ra ngoài công tác / Gặp khách hàng</option>
                  <option value="quen_van_tay">Báo quên vân tay / Chấm công bổ sung</option>
                  <option value="ot">Đăng ký làm thêm giờ (OT)</option>
                </select>
              </div>

              <div class="form-group" style="background:var(--primary-lighter); padding:10px; border-radius:6px;">
                <label class="form-label" style="font-weight:bold; color:var(--primary-dark);"><i class="fa-solid fa-clock"></i> Hình Thức Tính Thời Gian:</label>
                <div style="display:flex; gap:20px; align-items:center;">
                  <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="radio" name="radHinhThuc" value="ngay" checked onchange="AppModules.requests.toggleHinhThucTime('ngay')"> 
                    <span>Theo Ngày (Cả ngày / Nhiều ngày / Nửa ngày)</span>
                  </label>
                  <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="radio" name="radHinhThuc" value="gio" onchange="AppModules.requests.toggleHinhThucTime('gio')"> 
                    <span>Theo Giờ (Ra ngoài / Đi muộn / Về sớm / OT)</span>
                  </label>
                </div>
              </div>

              <!-- KHỐI THEO NGÀY -->
              <div id="blockTheoNgay">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Từ Ngày</label>
                    <input type="date" id="inpTuNgay" class="form-control" value="${today}" onchange="AppModules.requests.calcDaysAuto()">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Đến Ngày</label>
                    <input type="date" id="inpDenNgay" class="form-control" value="${today}" onchange="AppModules.requests.calcDaysAuto()">
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Khoảng Buổi Nghỉ</label>
                    <select id="inpKhoangBuoi" class="form-control" onchange="AppModules.requests.calcDaysAuto()">
                      <option value="ca_ngay">Cả ngày (1.0 công / ngày)</option>
                      <option value="sang">Nửa ngày ca sáng (0.5 công)</option>
                      <option value="chieu">Nửa ngày ca chiều (0.5 công)</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Tổng Số Ngày Nghỉ</label>
                    <input type="number" id="inpSoNgay" class="form-control" value="1.0" step="0.5">
                  </div>
                </div>
              </div>

              <!-- KHỐI THEO GIỜ -->
              <div id="blockTheoGio" style="display:none;">
                <div class="form-group">
                  <label class="form-label">Ngày Áp Dụng</label>
                  <input type="date" id="inpNgayApDung" class="form-control" value="${today}">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Từ Giờ</label>
                    <input type="time" id="inpTuGio" class="form-control" value="08:30" onchange="AppModules.requests.calcHoursAuto()">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Đến Giờ</label>
                    <input type="time" id="inpDenGio" class="form-control" value="11:30" onchange="AppModules.requests.calcHoursAuto()">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Tổng Số Giờ</label>
                  <input type="number" id="inpSoGio" class="form-control" value="3.0" step="0.5">
                </div>
              </div>

              <!-- KHỐI BÀN GIAO CÔNG VIỆC -->
              <div style="border-top:1px dashed var(--border-color); margin-top:12px; padding-top:12px;">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-user-check"></i> Người Nhận Bàn Giao Công Việc</label>
                    <select id="inpNguoiBanGiao" class="form-control">
                      <option value="">-- Không có bàn giao --</option>
                      ${otherEmployees.map(n => `<option value="${n.id}">${n.hoTen} (${n.phongBan} - ${n.chucVu})</option>`).join("")}
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Số Điện Thoại Liên Hệ</label>
                    <input type="text" id="inpSdtLienHe" class="form-control" placeholder="SĐT khi khẩn cấp...">
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Nội Dung Bàn Giao / Tài Liệu Bàn Giao</label>
                  <input type="text" id="inpNoiDungBanGiao" class="form-control" placeholder="Tóm tắt công việc đã bàn giao cho người thay thế...">
                </div>

                <div class="form-group">
                  <label class="form-label"><i class="fa-solid fa-link"></i> Đính Kèm Link Email Xác Nhận / Minh Chứng (Google Drive/Gmail link nếu có)</label>
                  <input type="text" id="inpLinkDinhKem" class="form-control" placeholder="VD: https://mail.google.com/... hoặc link Google Drive ảnh xác nhận">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-comment-dots"></i> Lý Do Chi Tiết</label>
                <textarea id="inpLyDo" class="form-control" rows="2" placeholder="Nhập lý do xin nghỉ hoặc nội dung công tác..."></textarea>
              </div>

              <div style="margin-top:10px; background:#eff6ff; padding:8px 12px; border-radius:6px; font-size:12px; color:#1e3a8a;">
                <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
                  <input type="checkbox" id="chkSendEmailToManager" checked>
                  <span><strong>✉️ Tự động gửi Email thông báo tới Trưởng Phòng qua Gmail</strong></span>
                </label>
              </div>
            </form>
          `;

          CoreService.openModal("Tạo Đơn Đề Xuất / Xin Nghỉ / OT Mới", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            {
              text: "<i class='fa-solid fa-paper-plane'></i> Gửi Đơn Đề Xuất",
              class: "btn-primary",
              close: false,
              onClick: () => {
                const loaiDonEl = document.getElementById("inpLoaiDon");
                const lyDo = document.getElementById("inpLyDo").value.trim();
                if (!lyDo) { CoreService.showToast("Vui lòng nhập lý do cụ thể!", "warning"); return; }

                const radHinhThuc = document.querySelector("input[name='radHinhThuc']:checked").value;
                const nguoiBanGiaoId = document.getElementById("inpNguoiBanGiao").value;
                const nguoiBanGiaoObj = (data.nhanVien || []).find(n => n.id === nguoiBanGiaoId);
                const managerEmail = document.getElementById("inpTruongPhongEmail").value;
                const sendEmail = document.getElementById("chkSendEmailToManager").checked;

                let tuNgay = document.getElementById("inpTuNgay").value;
                let denNgay = document.getElementById("inpDenNgay").value;
                let soNgay = parseFloat(document.getElementById("inpSoNgay").value) || 1.0;
                let soGio = 0;
                let tuGio = "";
                let denGio = "";
                let ngayApDung = tuNgay;

                if (radHinhThuc === "gio") {
                  ngayApDung = document.getElementById("inpNgayApDung").value;
                  tuNgay = ngayApDung;
                  denNgay = ngayApDung;
                  tuGio = document.getElementById("inpTuGio").value;
                  denGio = document.getElementById("inpDenGio").value;
                  soGio = parseFloat(document.getElementById("inpSoGio").value) || 1.0;
                  soNgay = soGio / 8;
                }

                const donId = "DT" + Date.now();
                const newDon = {
                  id: donId,
                  maNV: currentUser.id,
                  tenNV: currentUser.hoTen,
                  phongBan: currentUser.phongBan,
                  chucVu: currentUser.chucVu,
                  emailNV: currentUser.email,
                  loaiDon: loaiDonEl.value,
                  tenLoaiDon: loaiDonEl.options[loaiDonEl.selectedIndex].text,
                  hinhThuc: radHinhThuc,
                  tuNgay,
                  denNgay,
                  ngayApDung,
                  tuGio,
                  denGio,
                  soNgay,
                  soGio,
                  maNguoiBanGiao: nguoiBanGiaoId,
                  tenNguoiBanGiao: nguoiBanGiaoObj ? nguoiBanGiaoObj.hoTen : "",
                  noiDungBanGiao: document.getElementById("inpNoiDungBanGiao").value.trim(),
                  linkDinhKem: document.getElementById("inpLinkDinhKem").value.trim(),
                  sdtLienHe: document.getElementById("inpSdtLienHe").value.trim(),
                  lyDo,
                  trangThai: "cho_duyet",
                  ngayTao: new Date().toLocaleString("vi-VN")
                };

                data.donTu = data.donTu || [];
                data.donTu.unshift(newDon);
                DataService.saveData(data);
                CoreService.closeModal();

                // Gửi Email tự động qua Google Apps Script nếu được chọn
                if (sendEmail && managerEmail) {
                  AppModules.requests.sendEmailNotification({
                    toEmail: managerEmail,
                    subject: `[Auto HCNS] Đơn đề xuất mới cần duyệt: ${currentUser.hoTen} (${newDon.tenLoaiDon})`,
                    bodyHtml: `
                      <div style="font-family:Arial,sans-serif;padding:20px;color:#333;line-height:1.6">
                        <h3 style="color:#1e3a8a">THÔNG BÁO ĐƠN ĐỀ XUẤT MỚI TỪ NHÂN VIÊN</h3>
                        <p>Kính gửi Trưởng bộ phận,</p>
                        <p>Nhân viên <strong>${currentUser.hoTen}</strong> (Mã NV: <strong>${currentUser.id}</strong> - Phòng: <strong>${currentUser.phongBan}</strong>) vừa gửi một đơn đề xuất mới:</p>
                        <ul>
                          <li><strong>Loại đề xuất:</strong> ${newDon.tenLoaiDon}</li>
                          <li><strong>Thời gian:</strong> ${radHinhThuc === 'gio' ? (newDon.ngayApDung + ' từ ' + newDon.tuGio + ' đến ' + newDon.denGio) : (newDon.tuNgay + ' đến ' + newDon.denNgay)}</li>
                          <li><strong>Thời lượng:</strong> ${radHinhThuc === 'gio' ? (newDon.soGio + ' giờ') : (newDon.soNgay + ' ngày')}</li>
                          <li><strong>Người nhận bàn giao:</strong> ${newDon.tenNguoiBanGiao || 'Không có'}</li>
                          <li><strong>Lý do:</strong> ${newDon.lyDo}</li>
                        </ul>
                        <p>Vui lòng đăng nhập vào ứng dụng Auto HCNS để xem xét và phê duyệt đơn này.</p>
                      </div>
                    `
                  });
                }

                CoreService.showToast("Đã gửi đơn đề xuất & thông báo cho Trưởng phòng!", "success");
                AppModules.requests.render();
              }
            }
          ]);
        },

        onLoaiDonChanged() {
          const loai = document.getElementById("inpLoaiDon").value;
          if (loai === "ra_ngoai_cong_tac" || loai === "quen_van_tay" || loai === "ot") {
            const radGio = document.querySelector("input[name='radHinhThuc'][value='gio']");
            if (radGio) {
              radGio.checked = true;
              this.toggleHinhThucTime("gio");
            }
          }
        },

        toggleHinhThucTime(mode) {
          const bNgay = document.getElementById("blockTheoNgay");
          const bGio = document.getElementById("blockTheoGio");
          if (mode === "gio") {
            bNgay.style.display = "none";
            bGio.style.display = "block";
            this.calcHoursAuto();
          } else {
            bNgay.style.display = "block";
            bGio.style.display = "none";
            this.calcDaysAuto();
          }
        },

        calcDaysAuto() {
          const tu = new Date(document.getElementById("inpTuNgay").value);
          const den = new Date(document.getElementById("inpDenNgay").value);
          const buoi = document.getElementById("inpKhoangBuoi").value;

          if (isNaN(tu.getTime()) || isNaN(den.getTime())) return;
          const diffDays = Math.max(0, Math.round((den - tu) / (1000 * 60 * 60 * 24))) + 1;
          let total = diffDays;
          if (buoi === "sang" || buoi === "chieu") {
            total = diffDays > 1 ? diffDays - 0.5 : 0.5;
          }
          document.getElementById("inpSoNgay").value = total.toFixed(1);
        },

        calcHoursAuto() {
          const t1 = document.getElementById("inpTuGio").value;
          const t2 = document.getElementById("inpDenGio").value;
          if (!t1 || !t2) return;
          const [h1, m1] = t1.split(":").map(Number);
          const [h2, m2] = t2.split(":").map(Number);
          let diffMinutes = (h2 * 60 + m2) - (h1 * 60 + m1);
          if (diffMinutes < 0) diffMinutes += 24 * 60;
          const hours = diffMinutes / 60;
          document.getElementById("inpSoGio").value = hours.toFixed(1);
        },

        openApproveDialog(id, status) {
          const data = DataService.getData();
          const item = (data.donTu || []).find(d => d.id === id);
          if (!item) return;

          const currentUser = CoreService.currentUser;
          const actionText = status === "da_duyet" ? "Phê Duyệt Đơn" : "Từ Chối Đơn";
          const actionColor = status === "da_duyet" ? "var(--success-text)" : "var(--danger-text)";

          const bodyHtml = `
            <div style="margin-bottom:12px;">
              <p>Bạn đang thực hiện <strong style="color:${actionColor}">${actionText}</strong> cho nhân viên <strong>${item.tenNV}</strong> (Phòng: <strong>${item.phongBan}</strong>).</p>
              <p class="text-muted" style="font-size:13px;">Loại đề xuất: <strong>${item.tenLoaiDon}</strong> | Lý do: <em>${item.lyDo}</em></p>
            </div>
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-comment-medical"></i> Ý Kiến / Ghi Chú Phê Duyệt Của Trưởng Phòng</label>
              <textarea id="inpYkienDuyet" class="form-control" rows="3" placeholder="Nhập ý kiến chỉ đạo hoặc lý do từ chối (nếu có)...">${status === "da_duyet" ? "Đồng ý phê duyệt đơn." : "Chưa đủ điều kiện phê duyệt."}</textarea>
            </div>
            <div style="margin-top:10px; background:#eff6ff; padding:8px 12px; border-radius:6px; font-size:12px; color:#1e3a8a;">
              <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="chkSendEmailToEmployee" checked>
                <span><strong>✉️ Tự động gửi Email thông báo kết quả cho Nhân viên qua Gmail</strong></span>
              </label>
            </div>
          `;

          CoreService.openModal(actionText, bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            {
              text: status === "da_duyet" ? "<i class='fa-solid fa-check'></i> Xác Nhận Duyệt" : "<i class='fa-solid fa-xmark'></i> Xác Nhận Từ Chối",
              class: status === "da_duyet" ? "btn-success" : "btn-danger",
              close: false,
              onClick: () => {
                const yKien = document.getElementById("inpYkienDuyet").value.trim();
                const sendEmail = document.getElementById("chkSendEmailToEmployee").checked;

                item.trangThai = status;
                item.nguoiDuyet = currentUser.hoTen;
                item.chucVuNguoiDuyet = currentUser.chucVu;
                item.ngayDuyet = new Date().toLocaleString("vi-VN");
                item.yKienDuyet = yKien;

                DataService.saveData(data);
                CoreService.closeModal();

                // Gửi email phản hồi cho nhân viên nếu có email
                if (sendEmail && item.emailNV) {
                  AppModules.requests.sendEmailNotification({
                    toEmail: item.emailNV,
                    subject: `[Auto HCNS] Kết quả phê duyệt đơn: ${item.tenLoaiDon} (${status === 'da_duyet' ? 'ĐÃ DUYỆT' : 'TỪ CHỐI'})`,
                    bodyHtml: `
                      <div style="font-family:Arial,sans-serif;padding:20px;color:#333;line-height:1.6">
                        <h3 style="color:${status === 'da_duyet' ? '#16a34a' : '#dc2626'}">KẾT QUẢ PHÊ DUYỆT ĐƠN ĐỀ XUẤT</h3>
                        <p>Chào bạn <strong>${item.tenNV}</strong>,</p>
                        <p>Đơn đề xuất của bạn (Mã đơn: <strong>${item.id}</strong> - <strong>${item.tenLoaiDon}</strong>) đã được xử lý bởi Trưởng phòng <strong>${currentUser.hoTen}</strong>:</p>
                        <ul>
                          <li><strong>Trạng thái:</strong> <span style="font-weight:bold;color:${status === 'da_duyet' ? '#16a34a' : '#dc2626'}">${status === 'da_duyet' ? 'ĐÃ PHÊ DUYỆT' : 'TỪ CHỐI'}</span></li>
                          <li><strong>Thời gian duyệt:</strong> ${item.ngayDuyet}</li>
                          <li><strong>Ý kiến chỉ đạo:</strong> ${yKien}</li>
                        </ul>
                      </div>
                    `
                  });
                }

                NotificationService.addNotification(
                  status === "da_duyet" ? `🎉 Đơn ${item.tenLoaiDon} Đã Được Duyệt` : `⚠️ Đơn ${item.tenLoaiDon} Bị Từ Chối`,
                  `Đơn của ${item.tenNV} đã được ${currentUser.hoTen} phê duyệt (${status === 'da_duyet' ? 'Đã duyệt' : 'Từ chối'}${yKien ? ': ' + yKien : ''})`,
                  "request"
                );

                CoreService.showToast(status === "da_duyet" ? "Đã phê duyệt đơn và gửi email phản hồi!" : "Đã từ chối đơn và gửi email phản hồi!", status === "da_duyet" ? "success" : "info");
                AppModules.requests.render();
              }
            }
          ]);
        },

        sendEmailNotification(emailPayload) {
          const settings = getCompanySettings();
          const gasUrl = settings.gasUrl;
          if (!gasUrl) return;

          fetch(gasUrl, {
            method: "POST",
            body: JSON.stringify({
              action: "sendEmailNotification",
              payload: emailPayload
            })
          })
          .then(r => r.json())
          .then(res => {
            if (res.status === "success") {
              CoreService.showToast("Đã gửi Gmail thông báo tự động!", "success");
            }
          })
          .catch(e => {
            console.log("Email error:", e);
          });
        },

        printDonModal(id) {
          const data = DataService.getData();
          const item = (data.donTu || []).find(d => d.id === id);
          if (!item) return;
          const companySettings = getCompanySettings();
          const ngayKyText = formatSignatureDate(new Date().toISOString().split("T")[0]);

          // [THÊM MỚI 27/08/2026] Chọn mã biểu mẫu theo loại đơn (bộ mẫu có DT.BM01..04):
          // đi trễ/về sớm→BM02, ra ngoài/công tác→BM03, tăng ca OT→BM04, còn lại (phép/nghỉ)→BM01.
          const ld = String(item.loaiDon || "");
          const maBM = /tre|som/.test(ld) ? "DT.BM02.HCNS.01"
            : /ngoai|cong_tac/.test(ld) ? "DT.BM03.HCNS.01"
            : /ot|tang|them/.test(ld) ? "DT.BM04.HCNS.01"
            : "DT.BM01.HCNS.01";

          let thoiGianChiTietHtml = "";
          if (item.hinhThuc === "gio") {
            thoiGianChiTietHtml = `
              <tr>
                <td style="padding:5px 0;border:none"><strong>Ngày áp dụng:</strong> ${formatDateDisplay(item.ngayApDung || item.tuNgay)}</td>
                <td style="padding:5px 0;border:none"><strong>Khoảng giờ:</strong> từ ${item.tuGio || "08:00"} đến ${item.denGio || "17:30"} (Tổng: <strong>${formatNumber(item.soGio || 1, 1)} giờ</strong>)</td>
              </tr>
            `;
          } else {
            thoiGianChiTietHtml = `
              <tr>
                <td style="padding:5px 0;border:none"><strong>Từ ngày:</strong> ${formatDateDisplay(item.tuNgay)}</td>
                <td style="padding:5px 0;border:none"><strong>Đến ngày:</strong> ${formatDateDisplay(item.denNgay)} (Tổng: <strong>${formatNumber(item.soNgay, 1)} ngày</strong>)</td>
              </tr>
            `;
          }

          const bodyHtml = `
            <div id="donPrintArea" style="padding:20px;background:#fff;color:#000;border:1px solid #cbd5e1;border-radius:6px;font-family:Cambria,'Source Serif 4',serif;">
              ${bmDauTrang(maBM)}
              <div style="text-align:center;margin-bottom:15px">
                <h4 style="margin:0;font-size:14px;text-transform:uppercase;font-family:Cambria,serif;">${companySettings.companyName}</h4>
                <p style="margin:2px 0;font-size:12px;font-family:Segoe UI,sans-serif;">${companySettings.address} | Hotline: ${companySettings.phone}</p>
                <hr style="margin:8px 0;border:none;border-top:1px solid #000">
                <h3 style="font-size:18px;margin:8px 0;text-transform:uppercase;letter-spacing:0.5px;">ĐƠN XIN NGHỈ PHÉP / ĐỀ XUẤT NHÂN SỰ</h3>
                <p style="margin:0;font-size:12px;font-family:Segoe UI,sans-serif;">Mã đơn: <strong>${item.id}</strong> — Ngày tạo: ${item.ngayTao || ""}</p>
              </div>

              <table style="width:100%;margin-bottom:15px;font-size:13px;border-collapse:collapse;font-family:Segoe UI,sans-serif;">
                <tr>
                  <td style="padding:5px 0;border:none;width:55%;"><strong>Họ và tên người làm đơn:</strong> ${item.tenNV}</td>
                  <td style="padding:5px 0;border:none;"><strong>Mã NV:</strong> ${item.maNV}</td>
                </tr>
                <tr>
                  <td style="padding:5px 0;border:none;"><strong>Phòng ban / Bộ phận:</strong> <span style="font-weight:bold;color:#1e3a8a;">${item.phongBan || "—"}</span></td>
                  <td style="padding:5px 0;border:none;"><strong>Chức vụ:</strong> ${item.chucVu || "—"}</td>
                </tr>
                <tr>
                  <td style="padding:5px 0;border:none;" colspan="2"><strong>Loại đề xuất:</strong> <span style="font-weight:bold;color:#1e3a8a;">${item.tenLoaiDon}</span></td>
                </tr>
                ${thoiGianChiTietHtml}
                <tr>
                  <td style="padding:5px 0;border:none;" colspan="2"><strong>Người nhận bàn giao công việc:</strong> ${item.tenNguoiBanGiao ? `<strong>${item.tenNguoiBanGiao}</strong> (Mã NV: ${item.maNguoiBanGiao || "—"})` : "Không có"}</td>
                </tr>
                ${item.noiDungBanGiao ? `
                  <tr>
                    <td style="padding:5px 0;border:none;" colspan="2"><strong>Nội dung bàn giao:</strong> <em>${item.noiDungBanGiao}</em></td>
                  </tr>
                ` : ""}
                ${item.linkDinhKem ? `
                  <tr>
                    <td style="padding:5px 0;border:none;" colspan="2"><strong>Minh chứng / Email đính kèm:</strong> <a href="${item.linkDinhKem}" target="_blank">${item.linkDinhKem}</a></td>
                  </tr>
                ` : ""}
                <tr>
                  <td style="padding:5px 0;border:none;" colspan="2"><strong>Lý do chi tiết:</strong> ${item.lyDo}</td>
                </tr>
                ${item.yKienDuyet ? `
                  <tr style="background:#f8fafc;">
                    <td style="padding:8px 6px;border:1px dashed #cbd5e1;" colspan="2"><strong>Ý kiến của Trưởng bộ phận duyệt:</strong> <em>${item.yKienDuyet}</em> (Duyệt ngày: ${item.ngayDuyet})</td>
                  </tr>
                ` : ""}
              </table>

              <div style="display:grid;grid-template-columns:repeat(3, 1fr);margin-top:30px;text-align:center;font-size:12px;font-family:Segoe UI,sans-serif;">
                <div>
                  <strong>Người Làm Đơn</strong><br>
                  <span style="font-style:italic;font-size:11px;">(Ký, ghi rõ họ tên)</span>
                  <div style="height:50px;"></div>
                  <strong>${item.tenNV}</strong>
                </div>

                <div>
                  <strong>Người Nhận Bàn Giao</strong><br>
                  <span style="font-style:italic;font-size:11px;">(Xác nhận nhận việc)</span>
                  <div style="height:50px;"></div>
                  <strong>${item.tenNguoiBanGiao || "—"}</strong>
                </div>

                <div>
                  <span style="font-style:italic;font-size:11px;">${ngayKyText}</span><br>
                  <strong>Trưởng Phòng Phụ Trách / Giám Đốc</strong><br>
                  <span style="font-style:italic;font-size:11px;">(Ký & ghi rõ họ tên)</span>
                  <div style="height:50px;"></div>
                  <strong>${item.trangThai === "da_duyet" ? (item.nguoiDuyet || "✅ ĐÃ PHÊ DUYỆT") : "......................."}</strong>
                </div>
              </div>
              ${bmChanTrang(maBM)}
            </div>
          `;

          CoreService.openModal(`In Đơn Đề Xuất - ${item.id}`, bodyHtml, [
            { text: "Đóng", class: "btn-secondary" },
            { text: "<i class='fa-solid fa-print'></i> In Đơn A4 (PDF)", class: "btn-primary", close: false, onClick: () => window.print() }
          ]);
        }
      },

      /* =========================================================================
         [NHÓM 4] MODULE "vpp" — VĂN PHÒNG PHẨM (ORDER & DỰ TRÙ)
         -------------------------------------------------------------------------
         Vẽ vào tab  : tab-vpp
         Bảng dữ liệu: ordersVPP
         Ai xem được : Nhân viên: order của mình. HCNS / GĐ: duyệt & tổng hợp toàn nhà máy
         Việc chính  :
           - Lập phiếu order nhiều dòng hàng, duyệt, in phiếu
           - In bảng tổng hợp nhu cầu VPP toàn nhà máy
         ========================================================================= */
      vpp: {
        tempOrderItems: [],
        // [SỬA 27/08/2026] Thay 2 chế độ xem cũ (list/summary) bằng 4 TAB CON rõ ràng theo luồng dự trù:
        //   ds      = Danh sách dự trù (phiếu CHỜ DUYỆT — phòng ban tạo ở đây)
        //   duyet   = Danh sách dự trù ĐÃ DUYỆT (quản lý duyệt xong nằm đây)
        //   tong    = Tổng hợp dự trù (HCNS gom phiếu ĐÃ DUYỆT theo THÁNG để đi mua sỉ)
        //   danhmuc = Danh mục vật tư VPP (kho danh mục chuẩn, sửa được, để chọn nhanh + tính giá mua)
        currentSubTab: "ds",
        // Tháng đang xem ở tab Tổng hợp, dạng "YYYY-MM". Rỗng = tự lấy tháng hiện tại khi vẽ.
        thangTongHop: "",

        // [SỬA 27/08/2026] render() nay chỉ dựng thanh 4 tab con + gọi nội dung tab đang mở.
        // Trước đây render() gộp toàn bộ 2 bảng (list/summary) vào một chỗ; nay tách ra các hàm renderSubTab...
        render() {
          const container = document.getElementById("tab-vpp");
          if (!container) return;
          const role = (CoreService.currentUser && CoreService.currentUser.role) || "employee";
          // isHCNS = HR/Giám đốc: mới được xem Tổng hợp toàn công ty + quản lý Danh mục vật tư.
          const isHCNS = ["hr", "director"].includes(role);
          // Người không phải HCNS không có 2 tab Tổng hợp / Danh mục → nếu lỡ đang đứng đó thì kéo về tab 1.
          if (!isHCNS && (this.currentSubTab === "tong" || this.currentSubTab === "danhmuc")) this.currentSubTab = "ds";

          // Một nút tab con (pill). Tô đậm tab đang mở — giống thanh điều hướng module Công Việc cho đồng nhất.
          const nut = (ma, icon, chu) => `
            <button class="btn btn-sm ${this.currentSubTab === ma ? "btn-primary" : "btn-secondary"}"
              style="${this.currentSubTab === ma ? "" : "background:transparent;border-color:transparent;color:var(--text-secondary);"}"
              onclick="AppModules.vpp.switchSubTab('${ma}')">${icon} ${chu}</button>`;

          container.innerHTML = `
            <div style="display:inline-flex;gap:4px;margin-bottom:14px;background:var(--bg-surface);padding:4px;border-radius:10px;border:1px solid var(--border-color);box-shadow:var(--shadow-sm);flex-wrap:wrap;">
              ${nut("ds", '<i class="fa-solid fa-file-lines"></i>', "1. Danh Sách Dự Trù")}
              ${nut("duyet", '<i class="fa-solid fa-clipboard-check"></i>', "2. Đã Duyệt")}
              ${isHCNS ? nut("tong", '<i class="fa-solid fa-chart-pie"></i>', "3. Tổng Hợp Dự Trù") : ""}
              ${isHCNS ? nut("danhmuc", '<i class="fa-solid fa-box-archive"></i>', "4. Danh Mục Vật Tư") : ""}
            </div>
            <div id="vppSubContainer">${this.renderSubTabContent()}</div>
          `;
        },

        // Chọn nội dung theo tab con đang mở.
        renderSubTabContent() {
          if (this.currentSubTab === "duyet") return this.renderSubTabDaDuyet();
          if (this.currentSubTab === "tong") return this.renderSubTabTongHop();
          if (this.currentSubTab === "danhmuc") return this.renderSubTabDanhMuc();
          return this.renderSubTabDanhSach();
        },

        switchSubTab(ma) { this.currentSubTab = ma; this.render(); },
        setThangTongHop(v) { this.thangTongHop = v; this.render(); },

        renderBadgeStatus(status) {
          if (status === "da_phat") return `<span class="badge badge-success"><i class="fa-solid fa-box-check"></i> Đã cấp phát VPP</span>`;
          if (status === "da_duyet") return `<span class="badge badge-info"><i class="fa-solid fa-check"></i> Đã duyệt mua/cấp</span>`;
          return `<span class="badge badge-warning"><i class="fa-solid fa-spinner"></i> Chờ duyệt</span>`;
        },

        /* =========================================================================
           [THÊM MỚI 27/08/2026] 4 TAB CON CỦA DỰ TRÙ VPP
           ========================================================================= */

        // ===== TAB 1: DANH SÁCH DỰ TRÙ (phiếu CHỜ DUYỆT — nơi phòng ban tạo phiếu) =====
        renderSubTabDanhSach() {
          const data = DataService.getData();
          const currentUser = CoreService.currentUser;
          // Quản lý/HCNS thấy mọi phiếu chờ duyệt; nhân viên chỉ thấy phiếu của mình.
          const isManager = ["manager", "director", "hr"].includes(currentUser.role);
          const all = (data.ordersVPP || []).filter(o => o.trangThai === "cho_duyet" || !o.trangThai);
          const list = isManager ? all : all.filter(o => o.maNV === currentUser.id);
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-file-lines"></i> Danh Sách Dự Trù VPP — Chờ Duyệt (${list.length} phiếu)</div>
                <button class="btn btn-primary" onclick="AppModules.vpp.openOrderModal()"><i class="fa-solid fa-cart-plus"></i> Tạo Phiếu Dự Trù Mới</button>
              </div>
              ${this._bangPhieu(list, "Chưa có phiếu dự trù nào đang chờ duyệt")}
            </div>`;
        },

        // ===== TAB 2: DỰ TRÙ ĐÃ DUYỆT =====
        renderSubTabDaDuyet() {
          const data = DataService.getData();
          const currentUser = CoreService.currentUser;
          const isManager = ["manager", "director", "hr"].includes(currentUser.role);
          const all = (data.ordersVPP || []).filter(o => o.trangThai === "da_duyet" || o.trangThai === "da_phat");
          const list = isManager ? all : all.filter(o => o.maNV === currentUser.id);
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-clipboard-check"></i> Dự Trù Đã Duyệt (${list.length} phiếu)</div>
              </div>
              ${this._bangPhieu(list, "Chưa có phiếu nào được duyệt")}
            </div>`;
        },

        // Bảng liệt kê phiếu dùng CHUNG cho tab 1 & tab 2. Nút thao tác tự đổi theo trạng thái:
        // chờ duyệt → nút Duyệt (người có quyền); đã duyệt → nút Đã phát (quản lý).
        _bangPhieu(orderList, emptyMsg) {
          const currentUser = CoreService.currentUser;
          const userDept = currentUser.phongBan || "";
          const isManager = ["manager", "director", "hr"].includes(currentUser.role);
          return `
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="col-stt" style="width:44px">STT</th>
                    <th class="col-ma">Mã Phiếu</th>
                    <th>Người Đề Xuất / Bộ Phận</th>
                    <th>Cấp Độ / Phạm Vi</th>
                    <th>Danh Sách VPP & Đơn Giá</th>
                    <th class="col-so">Tổng Tiền Dự Toán</th>
                    <th class="col-ngay">Ngày Tạo</th>
                    <th style="text-align:center">Trạng Thái & Người Duyệt</th>
                    <th class="col-action">Thao Tác</th>
                  </tr>
                </thead>
                <tbody>
                  ${orderList.length === 0 ? `<tr><td colspan="9" class="col-action o-rong">${emptyMsg}</td></tr>` : orderList.map((item, idx) => {
                    const totalCost = (item.items || []).reduce((acc, i) => acc + ((i.donGia || 0) * (i.soLuong || 1)), 0);
                    const phamViBadge = item.phamVi === "cong_ty"
                      ? `<span class="badge badge-danger">🏢 Toàn Công Ty (GĐ Duyệt)</span>`
                      : item.phamVi === "phong_ban"
                      ? `<span class="badge badge-info">🏬 Phòng Ban (TP Duyệt)</span>`
                      : `<span class="badge badge-success">👤 Cá Nhân (TP Duyệt)</span>`;
                    // Quyền duyệt: HR/Giám đốc duyệt MỌI phiếu; Trưởng phòng chỉ duyệt phiếu phòng mình.
                    const canApprove = ["director", "hr"].includes(currentUser.role) || (currentUser.role === "manager" && (item.phongBan === userDept || !item.phongBan));
                    return `
                      <tr>
                        <td class="col-stt">${idx + 1}</td>
                        <td class="col-ma">${item.id}</td>
                        <td><strong>${item.tenNV}</strong><br><small class="badge badge-info" style="font-size:10px;">${item.phongBan}</small></td>
                        <td>${phamViBadge}</td>
                        <td><div style="display:flex; flex-direction:column; gap:3px;">
                          ${(item.items || []).map(i => `<div style="font-size:12px;">• <strong>${i.tenVPP}</strong>: ${i.soLuong} ${i.donVi} x ${formatCurrency(i.donGia || 0)} = <span style="color:var(--primary-main);font-weight:bold">${formatCurrency((i.donGia || 0) * (i.soLuong || 1))}</span></div>`).join("")}
                        </div></td>
                        <td class="col-so" style="font-weight:bold;color:var(--success-text);font-size:14px;">${formatCurrency(totalCost)}</td>
                        <td class="col-ngay">${item.ngayTao ? item.ngayTao.split(" ")[0] : ""}</td>
                        <td style="text-align:center">
                          ${this.renderBadgeStatus(item.trangThai)}
                          ${item.nguoiDuyet ? `<br><small class="text-muted" style="font-size:11px;">Duyệt bởi: <strong>${item.nguoiDuyet}</strong><br>(${item.ngayDuyet ? item.ngayDuyet.split(" ")[0] : ""})</small>` : ``}
                        </td>
                        <td class="col-action">
                          <button class="btn btn-sm btn-secondary" onclick="AppModules.vpp.printOrderModal('${item.id}')" title="In phiếu đề xuất VPP A4"><i class="fa-solid fa-print"></i> In Phiếu</button>
                          ${canApprove && item.trangThai === "cho_duyet"
                            ? `<button class="btn btn-sm btn-success" onclick="AppModules.vpp.approveOrder('${item.id}', 'da_duyet')"><i class="fa-solid fa-check"></i> Duyệt</button>`
                            : isManager && item.trangThai === "da_duyet"
                            ? `<button class="btn btn-sm btn-primary" onclick="AppModules.vpp.approveOrder('${item.id}', 'da_phat')"><i class="fa-solid fa-truck"></i> Đã phát</button>`
                            : ``}
                        </td>
                      </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>`;
        },

        // ===== TAB 3: TỔNG HỢP DỰ TRÙ (chỉ phiếu ĐÃ DUYỆT, gom theo THÁNG) =====
        renderSubTabTongHop() {
          const data = DataService.getData();
          // Chỉ gom phiếu ĐÃ DUYỆT (đã duyệt hoặc đã phát) — đúng luồng: duyệt xong mới đưa vào dự trù mua.
          const approved = (data.ordersVPP || []).filter(o => o.trangThai === "da_duyet" || o.trangThai === "da_phat");
          const thangHienTai = this._thangHienTai();
          // Gom các tháng có phiếu + tháng hiện tại để đổ vào ô chọn kỳ tổng hợp.
          const thangSet = {};
          approved.forEach(o => { const t = this._thangCuaPhieu(o); if (t) thangSet[t] = true; });
          thangSet[thangHienTai] = true;
          const dsThang = Object.keys(thangSet).sort().reverse();
          const thangChon = this.thangTongHop || thangHienTai;
          const dsPhieuThang = approved.filter(o => this._thangCuaPhieu(o) === thangChon);

          // Gom theo mã VPP; tính giá theo ĐƠN GIÁ HIỆN TẠI trong danh mục (để dự toán mua sát giá hiện hành).
          const bangGia = this._mapGiaHienTai();
          const gom = {};
          let tongTien = 0;
          dsPhieuThang.forEach(ord => {
            (ord.items || []).forEach(it => {
              const gia = (bangGia[it.maVPP] != null) ? bangGia[it.maVPP] : (it.donGia || 0);
              if (!gom[it.maVPP]) gom[it.maVPP] = { maVPP: it.maVPP, tenVPP: it.tenVPP, donVi: it.donVi, donGia: gia, tongSoLuong: 0, cacPhongBan: {} };
              gom[it.maVPP].donGia = gia;
              gom[it.maVPP].tongSoLuong += (it.soLuong || 1);
              gom[it.maVPP].cacPhongBan[ord.phongBan] = (gom[it.maVPP].cacPhongBan[ord.phongBan] || 0) + (it.soLuong || 1);
              tongTien += gia * (it.soLuong || 1);
            });
          });

          const [nam, thang] = thangChon.split("-");
          return `

                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">

                  <select class="form-control" style="width:auto; font-size:13px; padding:5px 8px;" onchange="AppModules.vpp.setThangTongHop(this.value)">
                    ${dsThang.map(t => { const [y, m] = t.split("-"); return `<option value="${t}" ${t === thangChon ? "selected" : ""}>Tháng ${m}/${y}</option>`; }).join("")}

                <small class="text-muted">Gom ${dsGom.length} loại vật tư từ ${dsPhieuThang.length} phiếu đã duyệt trong Tháng ${thang}/${nam}</small>
                <div style="font-size:14px; font-weight:bold; color:var(--success-text);">Tổng dự toán: ${formatCurrency(tongTien)}</div>
              </div>
              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:44px">STT</th>

                      <th>Tên Văn Phòng Phẩm / Vật Tư</th>

                      <th class="col-so">Tổng SL</th>
                      <th class="col-so">Tổng Thành Tiền</th>
                      <th>Phân Bổ Theo Phòng Ban</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${dsGom.length === 0 ? `<tr><td colspan="8" class="col-action o-rong">Chưa có phiếu đã duyệt nào trong tháng này</td></tr>` : dsGom.map((it, idx) => `
                      <tr>
                        <td class="col-stt">${idx + 1}</td>
                        <td class="col-ma">${it.maVPP}</td>

                        <td style="font-size:12px;color:var(--text-secondary);">${Object.entries(it.cacPhongBan).map(([d, q]) => `${d}: <strong>${q} ${it.donVi}</strong>`).join(", ")}</td>
                      </tr>`).join("")}
                  </tbody>
                </table>
              </div>
            </div>`;

        // Tháng hiện tại dạng "YYYY-MM".
        _thangHienTai() {
          const d = new Date();
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        },
        // Lấy tháng "YYYY-MM" của phiếu từ ngày tạo, chấp nhận CẢ HAI kiểu ghi ngày trong dữ liệu:
        //  - Kiểu ISO "2026-08-24 ..." (dữ liệu mẫu)  → bắt trực tiếp YYYY-MM
        //  - Kiểu Việt "24/08/2026 ..." (phiếu mới)   → đảo lại thành YYYY-MM
        _thangCuaPhieu(order) {
          const s = String(order.ngayTao || "");
          let m = s.match(/(\d{4})-(\d{2})/);
          if (m) return m[1] + "-" + m[2];
          m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          if (m) return m[3] + "-" + String(m[2]).padStart(2, "0");
          return "";
        },
        // Bảng tra ĐƠN GIÁ HIỆN TẠI theo mã vật tư (lấy từ danh mục đã lưu). Trả về { maVPP: donGia }.
        _mapGiaHienTai() {
          const dm = DataService.getData().danhMucVPP || [];
          const map = {};
          dm.forEach(v => { map[v.id] = v.donGia; });
          return map;
        },

        // ===== TAB 4: DANH MỤC VẬT TƯ VPP (thêm/sửa/xóa được, lưu trong máy) =====

              </div>

                <table>
                  <thead>
                    <tr>
                      <th class="col-stt" style="width:44px">STT</th>
                      <th class="col-ma">Mã VT</th>

        // Mở hộp Thêm mới (không truyền id) hoặc Sửa (truyền id) một vật tư trong danh mục.
        openCatalogModal(id) {
          const dm = DataService.getData().danhMucVPP || [];
          const v = id ? dm.find(x => x.id === id) : null;
          const bodyHtml = `
            <form onsubmit="return false;">
              <div class="form-group">

              </div>

                <label class="form-label">Tên Vật Tư / Văn Phòng Phẩm</label>
                <input type="text" id="catTen" class="form-control" value="${v ? String(v.ten).replace(/"/g, "&quot;") : ""}" placeholder="VD: Giấy in A4 Double A ĐL70">
              </div>
              <div class="form-row">
                <div class="form-group">

                  <label class="form-label">Đơn Giá (VNĐ)</label>
                  <input type="number" id="catDonGia" class="form-control" value="${v ? v.donGia : ""}" min="0" placeholder="VD: 68000">
                </div>
                <div class="form-group">
                  <label class="form-label">Tồn Kho (tùy chọn)</label>
                  <input type="number" id="catTonKho" class="form-control" value="${v && v.tonKho != null ? v.tonKho : ""}" min="0" placeholder="VD: 50">
                </div>
              </div>
            </form>`;
          CoreService.openModal(v ? "Sửa Vật Tư VPP" : "Thêm Vật Tư VPP", bodyHtml, [
            { text: "Hủy", class: "btn-secondary" },
            { text: "<i class='fa-solid fa-save'></i> Lưu", class: "btn-primary", close: false, onClick: () => AppModules.vpp.saveCatalogItem(id) }
          ]);
        },

        // Lưu vật tư (thêm mới hoặc sửa). Kiểm tra tên/đơn vị/đơn giá hợp lệ trước khi ghi.
        saveCatalogItem(id) {
          const ten = (document.getElementById("catTen").value || "").trim();
          const donVi = (document.getElementById("catDonVi").value || "").trim();
          const donGia = parseInt(document.getElementById("catDonGia").value) || 0;
          const tonKhoRaw = (document.getElementById("catTonKho").value || "").trim();
          const tonKho = tonKhoRaw === "" ? null : (parseInt(tonKhoRaw) || 0);
          if (!ten) { CoreService.showToast("Vui lòng nhập tên vật tư!", "warning"); return; }
          if (!donVi) { CoreService.showToast("Vui lòng nhập đơn vị tính!", "warning"); return; }
          if (donGia <= 0) { CoreService.showToast("Đơn giá phải lớn hơn 0!", "warning"); return; }

          const data = DataService.getData();
          data.danhMucVPP = data.danhMucVPP || [];
          if (id) {
            // Sửa: giữ nguyên mã, cập nhật các trường còn lại.
            const v = data.danhMucVPP.find(x => x.id === id);
            if (v) { v.ten = ten; v.donVi = donVi; v.donGia = donGia; v.tonKho = tonKho; }
          } else {
            // Thêm mới: lấy mã người dùng gõ; nếu bỏ trống hoặc trùng → tự sinh mã VPPxx kế tiếp.
            let ma = (document.getElementById("catMa").value || "").trim().toUpperCase();
            const daCo = new Set(data.danhMucVPP.map(x => x.id));
            if (!ma || daCo.has(ma)) {
              let n = data.danhMucVPP.length + 1;
              do { ma = "VPP" + String(n).padStart(2, "0"); n++; } while (daCo.has(ma));
            }
            data.danhMucVPP.push({ id: ma, ten, donVi, donGia, tonKho });
          }
          DataService.saveData(data);
          CoreService.closeModal();
          CoreService.showToast("Đã lưu danh mục vật tư!", "success");
          AppModules.vpp.render();
        },

        // Xóa một vật tư khỏi danh mục (hỏi xác nhận). Phiếu dự trù đã tạo trước đó KHÔNG bị ảnh hưởng.
        deleteCatalogItem(id) {
          const data = DataService.getData();
          const v = (data.danhMucVPP || []).find(x => x.id === id);
          if (!v) return;
          CoreService.openModal("Xác nhận xóa", `<p>Xóa vật tư <strong>${v.ten}</strong> (${v.id}) khỏi danh mục?</p><p style="font-size:12px;color:var(--text-secondary);">Các phiếu dự trù đã tạo trước đó không bị ảnh hưởng.</p>`, [
            { text: "Hủy", class: "btn-secondary" },
            { text: "<i class='fa-solid fa-trash'></i> Xóa", class: "btn-danger", close: false, onClick: () => {
              const d = DataService.getData();
              d.danhMucVPP = (d.danhMucVPP || []).filter(x => x.id !== id);
              DataService.saveData(d);
              CoreService.closeModal();
              CoreService.showToast("Đã xóa vật tư khỏi danh mục!", "success");
              AppModules.vpp.render();
            } }
          ]);
        },

        addOrderItemRow() {
          // [SỬA 27/08/2026] Lấy món đầu từ danh mục ĐÃ LƯU. Nếu danh mục trống thì báo, không để lỗi.
          const danhMuc = DataService.getData().danhMucVPP || [];

            maVPP: first.id,
            tenVPP: first.ten,

            donGia: first.donGia,
            soLuong: 1,
            thanhTien: first.donGia
          });
          this.renderOrderTableRows();

        removeOrderItemRow(index) {
          if (this.tempOrderItems.length <= 1) {
            CoreService.showToast("Phiếu đề xuất phải có ít nhất 1 món!", "warning");
            return;
          }
          this.tempOrderItems.splice(index, 1);
          this.renderOrderTableRows();
        },

        onItemSelectChanged(index, vppId) {
          const found = (DataService.getData().danhMucVPP || []).find(v => v.id === vppId);
          if (found && this.tempOrderItems[index]) {
            this.tempOrderItems[index].maVPP = found.id;
            this.tempOrderItems[index].tenVPP = found.ten;
            this.tempOrderItems[index].donVi = found.donVi;
            this.tempOrderItems[index].donGia = found.donGia;
            this.tempOrderItems[index].thanhTien = found.donGia * (this.tempOrderItems[index].soLuong || 1);
            this.renderOrderTableRows();
          }
        },

        onItemQtyChanged(index, newQty) {
          const qty = parseInt(newQty) || 1;
          if (this.tempOrderItems[index]) {
            this.tempOrderItems[index].soLuong = Math.max(1, qty);
            this.tempOrderItems[index].thanhTien = this.tempOrderItems[index].donGia * this.tempOrderItems[index].soLuong;
            this.renderOrderTableRows();
          }
        },

        approveOrder(id, status) {
          const data = DataService.getData();
          const item = (data.ordersVPP || []).find(o => o.id === id);
          if (item) {
            item.trangThai = status;
            item.nguoiDuyet = CoreService.currentUser.hoTen;
            item.chucVuNguoiDuyet = CoreService.currentUser.chucVu;
            item.ngayDuyet = new Date().toLocaleString("vi-VN");

            DataService.saveData(data);
            CoreService.showToast(status === "da_phat" ? "Đã xác nhận cấp phát VPP!" : "Đã phê duyệt đơn VPP!", "success");

        printOrderModal(id) {
          const data = DataService.getData();
          const item = (data.ordersVPP || []).find(o => o.id === id);
          if (!item) return;
